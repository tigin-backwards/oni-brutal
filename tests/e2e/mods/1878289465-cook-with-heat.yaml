# Cook With Heat (1878289465), class P.
#
# What it does: postfixes on the prefabs of Meat, Raw Fish, Mush Bar, Mushroom and Bristle
# Berry add a TemperatureCookable: above 71 °C (344.15 K) the item turns into its cooked food
# (Barbeque, Cooked Fish, Mush Fry, Fried Mushroom, Gristle Berry), as raw eggs do in the
# game.
# How a player reaches it: heat such food, as in a hot room.
# What changes: food cooks by heat, with no cooking station.
#
# setup drops a piece of meat in the corridor west of the printing pod, heated to 90 °C. It
# is selected while the game is paused; a few seconds later it has become Barbeque, and
# the selection has followed it.
from: early-base
mods: [1878289465]
setup:
  - driver: {setup.call: {target: "Scenario.SpawnPrefab(131128, 0, 0, \"Meat\", \"Ore\")", method: SetActive, args: [true]}}
  - driver: {setup.call: {target: "all:TemperatureCookable::[0].GetComponent<PrimaryElement>", method: set_Temperature, args: [363.15]}}
steps:
  - expect_state:
      "Assets.GetPrefab(\"Meat\").GetComponent<TemperatureCookable>.cookedID": CookedMeat
      "Assets.GetPrefab(\"Mushroom\").GetComponent<TemperatureCookable>.cookedID": FriedMushroom
      "Assets.GetPrefab(\"PrickleFruit\").GetComponent<TemperatureCookable>.cookedID": GrilledPrickleFruit
      "count:all:KPrefabID::[*] if .PrefabTag.Name == CookedMeat": 0
  - driver: {camera.set: {cell: [112, 208], ortho: 8}}
  - click_world: {pos: [112.5, 206.2], select: Meat}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - run: {seconds: 3, speed: 1}
  - expect_state:
      "count:all:KPrefabID::[*] if .PrefabTag.Name == CookedMeat": 1
      "count:all:KPrefabID::[*] if .PrefabTag.Name == Meat": 0
      "selected:GetComponent<KPrefabID>.PrefabTag.Name": CookedMeat
  - expect_ui:
      "**/DetailsScreen/TitleBar/Border/LabelGroup/Label": {text: "~Barbeque"}

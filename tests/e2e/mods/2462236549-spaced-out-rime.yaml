# [DLC Only] Spaced Out Rime (2462236549), class O (a worldgen mod, no code; Spaced Out).
#
# What it does: adds two frozen clusters, Rime (RimeStartCluster, a Spaced Out cluster, start
# asteroid RimeMoonlet, 200x300) and a classic one (RimeClassicCluster, RimeRoid), with chilly
# variants of the sandstone, jungle, marsh, barren and wasteland subworlds.
# How a player reaches it: New Game, Survival, Spaced Out: the cluster carousel (coordinate
# prefix RIME-DLC).
# What changes: a colder start.
#
# From early-base: the main menu, New Game, Survival, Spaced Out; the carousel offers the
# cluster, picked at a fixed coordinate, launched and embarked. Functional expectations
# (mod-play-testing.md, "Worldgen mods"): the start world is RimeMoonlet at its size, with the
# mod's subworlds among those generated.
from: early-base
mods: [2462236549]
memory_gb: 8
steps:
  - key: {code: Escape}
  - ui_wait: {path: "**/PauseScreen/**/Main MenuButton", cond: stable}
  - click: {ui: "**/PauseScreen/**/Main MenuButton"}
  - ui_wait: {path: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton", cond: stable}
  - click: {ui: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton"}
  - ui_wait: {path: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons", cond: stable, frames: 3000}
  - click: {text: "NEW GAME", under: "**/MainMenuButtons"}
  - ui_wait: {path: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame", cond: stable}
  - click: {ui: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame"}
  - ui_wait: {path: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/SpacedOutGame", cond: stable}
  - click: {ui: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/SpacedOutGame"}
  - ui_wait: {path: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton", cond: stable, frames: 3000}
  - expect_state:
      "all:DestinationSelectPanel::[0].clusterKeys": {contains: clusters/RimeStartCluster}
  - click: {ui: "**/CoordinateContainer/SeedInput"}
  - ui_wait: {path: "**/CoordinateContainer/SeedInput", cond: stable}
  - type: {ui: "**/CoordinateContainer/SeedInput", text: "RIME-DLC-12345-0-0-0", clear: true, enter: true}
  - ui_wait: {path: "**/CoordinateContainer/SeedInput/Text Area/Text", cond: text, value: "~RIME-DLC-12345-0-0-0"}
  - expect_state:
      "CustomGameSettings.Instance.GetCurrentQualitySetting(\"ClusterLayout\").id": clusters/RimeStartCluster
  - ui_dump: {name: asteroids, root: "**/Section - Destination/World Scoll (Rect Size Set By Screen Code!)/Content/Details"}
  - click: {ui: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton"}
  - ui_wait: {path: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton", cond: stable, frames: 60000}
  - click: {ui: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton"}
  - ui_wait: {path: "**/MinionSelectScreen", cond: gone, frames: 6000}
  - expect_state:
      "ClusterManager.Instance.GetStartWorld().worldName": worlds/RimeMoonlet
      "ClusterManager.Instance.GetStartWorld().worldSize.x": 200
      "ClusterManager.Instance.GetStartWorld().worldSize.y": 300
      "Components.LiveMinionIdentities.Count": 3
      "ClusterManager.Instance.WorldContainers.Count": "== original"
      "ClusterManager.Instance.GetStartWorld().m_generatedSubworlds": [{contains: subworlds/sandstone/SandstoneStartCold}, {contains: subworlds/sandstone/SandstoneMiniCool}]

# Single Small Asteroid With Everything (2923696064), class P (a worldgen mod, no code).
#
# What it does: three Classic-style clusters for Spaced Out (coordinate prefixes M-SNDST-ES,
# M-FRST-ES and M-SWMP-ES), each a single small asteroid (160x274, the Terrania, Folia and
# Quagmiris moonlets) holding every resource: classic and Spaced Out subworlds (wasteland,
# radioactive, the Moo caverns, aquatic graphite caves, rust, oil) and the mod's own niobium
# core, with a starmap of harvestable and artifact POIs and the Temporal Tear.
# How a player reaches it: the main menu, New Game, Survival, Classic; the destination screen's
# carousel lists the mod's clusters.
# What changes: the cluster a new game generates.
#
# From a colony: the pause menu's Main Menu, Quit Without Saving, New Game, Survival, Classic.
# The mod's sandstone cluster is chosen by typing its coordinate (fixed seed), launched, and the
# new colony embarked. Worldgen expectations are functional (mod-play-testing.md, "Worldgen
# mods"): one asteroid, the mod's world and size, its start biome, POIs on the starmap. The
# destination's list of asteroids is dumped (the main menu cannot be shot).
from: early-base
mods: [2923696064]
memory_gb: 8
steps:
  - key: {code: Escape}
  - ui_wait: {path: "**/PauseScreen/**/Main MenuButton", cond: stable}
  - click: {ui: "**/PauseScreen/**/Main MenuButton"}
  - ui_wait: {path: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton", cond: stable}
  - click: {ui: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton"}   # Quit Without Saving
  - ui_wait: {path: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons", cond: stable, frames: 3000}
  - click: {text: "NEW GAME", under: "**/MainMenuButtons"}
  - ui_wait: {path: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame", cond: stable}
  - click: {ui: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame"}
  - ui_wait: {path: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/ClassicStyleGame", cond: stable}
  - click: {ui: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/ClassicStyleGame"}
  - ui_wait: {path: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton", cond: stable, frames: 3000}
  # The carousel offers the mod's three clusters.
  - expect_state:
      "all:DestinationSelectPanel::[0].clusterKeys": {contains: clusters/EverythingSmallSandstoneCluster}
      "count:all:DestinationSelectPanel::[0].clusterKeys[*] if .StartsWith(\"clusters/EverythingSmall\") == true": 3
  - click: {ui: "**/CoordinateContainer/SeedInput"}
  - ui_wait: {path: "**/CoordinateContainer/SeedInput", cond: stable}
  - type: {ui: "**/CoordinateContainer/SeedInput", text: "M-SNDST-ES-12345-0-0-0", clear: true, enter: true}
  - ui_wait: {path: "**/CoordinateContainer/SeedInput/Text Area/Text", cond: text, value: "~M-SNDST-ES-12345-0-0-0"}
  - expect_state:
      "CustomGameSettings.Instance.GetCurrentQualitySetting(\"ClusterLayout\").id": clusters/EverythingSmallSandstoneCluster
  - ui_dump: {name: asteroids, root: "**/Section - Destination/World Scoll (Rect Size Set By Screen Code!)/Content/Details"}
  - click: {ui: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton"}
  # Worldgen runs on its own thread; the Duplicant selection follows once the world is loaded.
  - ui_wait: {path: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton", cond: stable, frames: 60000}
  - click: {ui: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton"}
  - ui_wait: {path: "**/MinionSelectScreen", cond: gone, frames: 6000}
  - expect_state:
      "ClusterManager.Instance.WorldContainers.Count": 1
      "ClusterManager.Instance.GetStartWorld().worldName": worlds/EverythingSmallSandstoneDefault
      "ClusterManager.Instance.GetStartWorld().worldSize.x": 160
      "ClusterManager.Instance.GetStartWorld().worldSize.y": 274
      "Components.LiveMinionIdentities.Count": 3
      "ClusterManager.Instance.GetStartWorld().m_generatedSubworlds": {contains: "expansion1::subworlds/sandstone/SandstoneStart"}
      "ClusterManager.Instance.GetStartWorld().Biomes.Count": ">= 6"
      "all:TemporalTear::Length": 1
      "all:HarvestablePOIClusterGridEntity::Length": ">= 15"
      "all:ArtifactPOIClusterGridEntity::Length": ">= 4"

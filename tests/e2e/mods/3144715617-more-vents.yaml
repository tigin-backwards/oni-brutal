# More Vents Rime World (3144715617), class O (a worldgen mod; Spaced Out).
#
# What it does: a Classic-style cluster, More Vents (coordinate prefix V-VENTYRIME-L): a 220 x
# 360 Rime start with colder subworlds of its own (MoreVents_SandstoneStartCold and others), a
# curated set of volcanoes, geysers and vents, Gravitas rooms of its own (fridge, cryofarm,
# break room, a heat sink), a larger Swampy teleport world and a rusty ocean regolith moon
# among the game's moonlets. Its code only adds the cluster's and world's names.
# How a player reaches it: the main menu, New Game, Survival, Classic; the carousel lists
# More Vents.
# What changes: the cluster a new game generates.
#
# From a colony: Main Menu, Quit Without Saving, New Game, Survival, Classic; the cluster chosen
# by typing its coordinate (fixed seed), launched and embarked. Functional expectations
# (mod-play-testing.md, "Worldgen mods"): the eight worlds, the start world's size and
# subworlds, its geysers and the heat sink among the spawners.
from: early-base
mods: [3144715617]
memory_gb: 9
steps:
  - key: {code: Escape}
  - ui_wait: {path: "**/PauseScreen/**/Main MenuButton", cond: stable}
  - click: {ui: "**/PauseScreen/**/Main MenuButton"}
  - ui_wait: {path: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton", cond: stable}
  - click: {ui: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton"}   # Quit Without Saving
  - ui_wait: {path: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons", cond: stable, frames: 3000}
  - click: {text: "NEW GAME", under: "**/MainMenuButtons"}
  - ui_wait: {path: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame", cond: stable}
  - click: {ui: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame"}
  - ui_wait: {path: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/ClassicStyleGame", cond: stable}
  - click: {ui: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/ClassicStyleGame"}
  - ui_wait: {path: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton", cond: stable, frames: 3000}
  - expect_state:
      "all:DestinationSelectPanel::[0].clusterKeys": {contains: "expansion1::clusters/VanillaBumRimeCluster"}
  - click: {ui: "**/CoordinateContainer/SeedInput"}
  - ui_wait: {path: "**/CoordinateContainer/SeedInput", cond: stable}
  - type: {ui: "**/CoordinateContainer/SeedInput", text: "V-VENTYRIME-L-12345-0-0-0", clear: true, enter: true}
  - ui_wait: {path: "**/Section - Destination/DestinationDetailsHeader/ClusterName", cond: text, value: "~More Vents"}
  - expect_ui:
      "**/CoordinateContainer/SeedInput/Text Area/Text": {text: "~V-VENTYRIME-L-12345-0-0-0"}
  - expect_state:
      "CustomGameSettings.Instance.GetCurrentQualitySetting(\"ClusterLayout\").id": "expansion1::clusters/VanillaBumRimeCluster"
  - ui_dump: {name: asteroids, root: "**/Section - Destination/World Scoll (Rect Size Set By Screen Code!)/Content/Details"}
  - click: {ui: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton"}
  # Worldgen runs on its own thread; the Duplicant selection follows once the world is loaded.
  - ui_wait: {path: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton", cond: stable, frames: 60000}
  - click: {ui: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton"}
  - ui_wait: {path: "**/MinionSelectScreen", cond: gone, frames: 6000}
  - expect_state:
      "ClusterManager.Instance.WorldContainers.Count": 8
      "ClusterManager.Instance.GetStartWorld().worldName": "expansion1::worlds/VanillaBumRimeFrozen"
      "ClusterManager.Instance.GetStartWorld().worldSize.x": 220
      "ClusterManager.Instance.GetStartWorld().worldSize.y": 360
      "count:ClusterManager.Instance.WorldContainers[*] if .worldName == expansion1::worlds/MediumBumSwampy": 1
      "count:ClusterManager.Instance.WorldContainers[*] if .worldName == expansion1::worlds/RustyOceanRegolithMoon": 1
      "Components.LiveMinionIdentities.Count": 3
      "ClusterManager.Instance.GetStartWorld().m_generatedSubworlds": {contains: subworlds/rime/MoreVents_SandstoneStartCold}
      "count:SaveGame.Instance.worldGenSpawner.spawnables[*] if .spawnInfo.id.StartsWith(\"GeyserGeneric\") == true": ">= 12"
      "count:SaveGame.Instance.worldGenSpawner.spawnables[*] if .spawnInfo.id == MassiveHeatSink": ">= 1"
      "all:TemporalTear::Length": 1

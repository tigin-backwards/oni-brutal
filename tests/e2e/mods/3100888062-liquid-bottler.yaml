# Liquid Bottler (3100888062), class B.
#
# What it does: adds two buildings: the Liquid Bottle Filler (Alesseon.LiquidBottler, 3x2,
# the gas bottler's look), which takes 300 kg of piped liquid and, once full, offers it as
# bottles for Duplicants to fetch (or drops them, with its user menu's auto drop); and the
# Liquid Bottle Emptier (1x3), which takes the bottles its filter names and pipes them out.
# How a player reaches it: the build menu (Plumbing), after Improved Plumbing; the filler's
# user menu button.
# What changes: piped liquid can be bottled and carried.
#
# setup builds a filler in the dug-out corridor west of the printing pod and fills it with
# 300 kg of water. Its user menu (dumped) offers "Disable auto drop"; pressed, the filler
# drops its water as a bottle on the floor.
from: early-base
mods: [3100888062]
setup:
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"Alesseon.LiquidBottler\")", method: Build, args: [131129, Neutral, null, [Cuprite], 293.15, DEFAULT_FACADE]}}
  - driver: {setup.call: {target: "last:GetComponent<Storage>", method: AddLiquid, args: [Water, 300.0, 293.15, 255, 0]}}
steps:
  - expect_state:
      "Assets.GetPrefab(\"Alesseon.LiquidBottleEmptier\").GetComponent<ConduitDispenser>": exists
      "Db.Get().Techs.Get(\"ImprovedLiquidPiping\").unlockedItemIDs": [{contains: Alesseon.LiquidBottler}, {contains: Alesseon.LiquidBottleEmptier}]
  - run: {seconds: 4}
  - expect_state:
      "all:Alesseon.LiquidBottler.Building.LiquidBottler::[0].GetComponent<Storage>.MassStored()": 300
  - driver: {camera.set: {cell: [113, 208], ortho: 8}}
  - click_world: {cell: [113, 207], select: Alesseon.LiquidBottler}
  - ui_wait: {path: "**/DetailsScreen/UserMenuButtons/UserMenuScreen/Buttons", cond: stable}
  - ui_dump: {name: usermenu, root: "**/DetailsScreen/UserMenuButtons/UserMenuScreen/Buttons"}
  - click: {ui: "**/UserMenuScreen/Buttons/Disable auto dropButton"}
  - run: {seconds: 4}
  - expect_state:
      "all:Alesseon.LiquidBottler.Building.LiquidBottler::[0].GetComponent<Storage>.MassStored()": 0
      "sum:all:Pickupable::[*].GetComponent<PrimaryElement>.Mass if .GetComponent<PrimaryElement>.ElementID == Water": ">= 299"

# Infinite Liquid/Gas Sources (1711115962).
#
# What it does: adds buildings that make or destroy
# liquid and gas without end.
# How a player reaches it: the build menu.
#
# Broken upstream: Its Workshop build has no mod_info.yaml, which the game requires since 2021: KMod logs
# "Is missing a mod_info.yaml file and will not be loaded" and leaves it out.
# The spec checks that it is enabled, then runs the colony.
from: early-base
mods: [1711115962]
steps:
  - expect_state:
      "count:Global.Instance.modManager.mods[*] if .label.id == 1711115962 and .IsEnabledForActiveDlc() == true": 1
  - run: {seconds: 30}
  - expect: {duplicants: 3}

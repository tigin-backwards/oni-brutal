# Anti-Entropy Generator - 反熵发电机 (3772839873), classes B, S.
#
# What it does: adds the Anti-Entropy Generator (2x3, its own kanim, refined metal) for the
# Power menu, unlocked by Renewable Energy: it turns the heat around it into up to 1.2 kW of
# power while cooling its surroundings; its side screen has sliders (with a patch fixing their
# number inputs).
# How a player reaches it: research Renewable Energy; the Power menu; select it.
# What changes: free power from ambient heat.
#
# Renewable Energy is researched in setup and one built in the west corridor. The def's rating
# is 1200 W; the Power menu offers its card.
from: early-base
mods: [3772839873]
setup:
  - driver: {setup.call: {target: "Research.Instance", method: SetActiveResearch, args: [{"$": "Db.Get().Techs.Get(\"RenewableEnergy\")"}, true]}}
  - driver: {setup.call: {target: "Research.Instance", method: CompleteQueue}}
  - driver: {setup.call: {target: "Game.Instance", method: Trigger, args: [-107300940]}}
  - driver: {setup.call: {target: "PlanScreen.Instance._researchedDefs", method: Clear}}
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"AntiEntropyGenerator\")", method: Build, args: [131763, Neutral, null, [Copper], 293.15, DEFAULT_FACADE]}}
steps:
  - expect_state:
      "Db.Get().Techs.Get(\"RenewableEnergy\").unlockedItemIDs": {contains: AntiEntropyGenerator}
      "Assets.GetBuildingDef(\"AntiEntropyGenerator\").GeneratorWattageRating": 1200
  - run: {seconds: 3}
  - expect: {buildings: {AntiEntropyGenerator: 1}}
  - driver: {camera.set: {cell: [113, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Power"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/AntiEntropyGenerator Group*", cond: stable}
  # Its card sits in the menu's last row, below the 720-pixel screen in both players even
  # scrolled down, so it is checked for, not clicked.
  - expect_ui:
      "**/BuildingGroups/**/Grid/AntiEntropyGenerator Group*": {active: true}

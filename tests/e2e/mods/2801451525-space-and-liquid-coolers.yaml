# 空间冷却器和液体冷却器 / liquid (space) cooler (2801451525), class B.
#
# What it does: adds two Utilities buildings, researched with Temperature Modulation, named in
# Chinese: the Space Cooler (ShinseiIndustrialAirHeater, a 2x2 Space Heater of any metal that
# removes 400 kW of heat from the air for 200 W, down to -200 degrees) and the Liquid Cooler
# (ShinseiSuperHeater, a 4x1 Liquid Tepidizer that removes 4000 kW from liquid for 600 W).
# Both take a logic input.
# How a player reaches it: the build menu (Utilities), after research.
# What changes: cheap, strong coolers.
#
# setup grants Temperature Modulation and spawns copper ore. A Space Cooler is picked in the
# Utilities menu, placed in the dug-out corridor west of the printing pod, built and selected,
# unpowered (early-base has no circuit for it): its definition removes heat, and its card and
# details show.
from: early-base
mods: [2801451525]
setup:
  - driver: {setup.call: {target: "Research.Instance.GetTechInstance(\"TemperatureModulation\")", method: Purchased}}
  - driver: {setup.call: {target: "Game.Instance", method: Trigger, args: [-107300940]}}
  - driver: {setup.call: {target: "PlanScreen.Instance._researchedDefs", method: Clear}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"Cuprite\").substance", method: SpawnResource, args: [[109.5, 206.5, -12], 600, 300, 255, 0]}}
steps:
  - expect_state:
      "Assets.GetBuildingDef(\"ShinseiIndustrialAirHeater\").ExhaustKilowattsWhenActive": -400
      "Assets.GetBuildingDef(\"ShinseiSuperHeater\").ExhaustKilowattsWhenActive": -4000
      "Assets.GetBuildingDef(\"ShinseiIndustrialAirHeater\").BuildingComplete.GetComponent<MinimumOperatingTemperature>.minimumTemperature": 73.15
  - run: {seconds: 5}
  - driver: {camera.set: {cell: [113, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Utilities"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/ShinseiIndustrialAirHeater Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/ShinseiIndustrialAirHeater Group*"}
  - ui_wait: {path: "**/ProductInfoScreen", cond: stable}
  - shot: {name: product, crop: "**/ProductInfoScreen", threshold: 0.04}
  - click_world: {cell: [113, 206]}
  - key: {code: Escape}
  - expect: {blueprints: {ShinseiIndustrialAirHeater: 1}}
  - run: {seconds: 1200, until: {buildings: {ShinseiIndustrialAirHeater: 1}, pending_construction: 0}}
  - driver: {camera.set: {cell: [113, 207], ortho: 8}}
  - click_world: {cell: [113, 206], select: ShinseiIndustrialAirHeater}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - expect_state:
      "selected:GetComponent<SpaceHeater>.targetTemperature": 773.15
  - shot: {name: details, crop: "**/DetailsScreen", threshold: 0.04}

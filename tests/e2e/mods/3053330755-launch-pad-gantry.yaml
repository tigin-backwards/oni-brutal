# Launch Pad Gantry (Deprecated) (3053330755), class P.
#
# What it does: every Rocket Platform's tower (LaunchPadTower, the scaffolding shown beside
# a rocket) is replaced at spawn by the mod's Scaffolding: walkable fake floors, three cells
# wide every five rows, up the side of the rocket standing on it (up to 35 high), refreshed
# every four seconds; a prefix on SetTowerHeight leaves the game's own tower alone.
# How a player reaches it: build a rocket on a platform (Spaced Out).
# What changes: Duplicants can climb a rocket's gantry.
#
# The rockets-so fixture has two rockets on platforms: after a few seconds their towers are
# the mod's scaffolding. The two dialogs the save opens are closed first.
from: rockets-so
mods: [3053330755]
steps:
  - expect_ui: {"**/SpriteListDialog": {count: 2}}
  - click: {ui: "**/SpriteListDialog/**/ConfigurableButton", index: 1}
  - expect_ui: {"**/SpriteListDialog": {count: 1}}
  - click: {ui: "**/SpriteListDialog/**/ConfigurableButton"}
  - ui_wait: {path: "**/SpriteListDialog", cond: gone, frames: 120}
  - expect_state:
      "Components.LaunchPads.Items.Count": 2
  - run: {seconds: 10}
  - expect_state:
      "count:Components.LaunchPads.Items[*] if .tower.GetType().FullName == LaunchPadGantry.Scaffolding": [2, "== original"]

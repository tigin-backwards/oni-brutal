# No Sensor Limits (2277619848), class S.
#
# What it does: a value typed into a sensor's threshold side screen may exceed the slider's
# maximum: postfixes on ThresholdSwitchSideScreen.SetTarget (and CapacityControlSideScreen's,
# for critter drop-offs) lift the number field's maximum, and prefixes on UpdateThresholdValue
# (UpdateMaxCapacity) store a larger value while the slider stays at its end. The timer
# sensor's side screen allows up to 100 cycles.
# How a player reaches it: a sensor's side screen.
# What changes: thresholds beyond the slider's range.
#
# setup grants Improved Ventilation and sets copper down. A Gas Pressure Sensor (range up to
# 20 kg) is built in the dug-out corridor west of the printing pod and selected; 50,000 g typed
# into its threshold field (in grams) is kept: 50 kg.
from: early-base
mods: [2277619848]
setup:
  - driver: {setup.call: {target: "Research.Instance.GetTechInstance(\"ImprovedGasPiping\")", method: Purchased}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"Copper\").substance", method: SpawnResource, args: [[110.5, 206.5, -12], 200, 300, 255, 0]}}
steps:
  - build: {prefab: LogicPressureSensorGas, at: [113, 208]}
  - expect: {blueprints: {LogicPressureSensorGas: 1}}
  - run: {seconds: 900, until: {buildings: {LogicPressureSensorGas: 1}, pending_construction: 0}}
  - driver: {camera.set: {cell: [113, 208], ortho: 8}}
  - click_world: {cell: [113, 208], select: LogicPressureSensorGas}
  - ui_wait: {path: "**/DetailsScreen/SideScreen/**/ThresholdSwitchSideScreen", cond: stable}
  - expect_state:
      "selected:LogicPressureSensor.RangeMax": 20
  - shot: {name: side-screen, crop: "**/ThresholdSwitchSideScreen", threshold: 0.04}
  - type: {ui: "**/ThresholdSwitchSideScreen/**/*Input*", text: "50000", enter: true, clear: true}
  - expect_state:
      "selected:LogicPressureSensor.Threshold": 50

# Insulated Door (2054432034), class B.
#
# What it does: adds four doors to the Base menu: Insulated Manual Airlock and Tiny Insulated
# Manual Airlock (Temperature Modulation), Insulated Mechanized Airlock and its tiny version
# (HVAC). They are airlocks of raw mineral and metal whose cells conduct heat at 1 % (the
# building's ThermalConductivity 0.01 written into the cells' insulation once built).
# How a player reaches it: the build menu (Base), then the door's side screen (door access).
# What changes: a door that keeps gas and heat apart.
#
# setup grants Temperature Modulation and spawns copper and sandstone (800 kg raw mineral and
# 200 kg metal per door; early-base has no refined metal). The door stands in the dug-out
# corridor west of the printing pod.
from: early-base
mods: [2054432034]
setup:
  - driver: {setup.call: {target: "Research.Instance.GetTechInstance(\"TemperatureModulation\")", method: Purchased}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"Copper\").substance", method: SpawnResource, args: [[114.5, 207.5, -12], 400, 300, 255, 0]}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"SandStone\").substance", method: SpawnResource, args: [[113.5, 207.5, -12], 1000, 300, 255, 0]}}
steps:
  - expect_state:
      "cells:112,207..112,208::Grid.Insulation.get_Item({cell})": 510
  - build: {prefab: InsulatedManualPressureDoor, at: [112, 207]}
  - expect: {blueprints: {InsulatedManualPressureDoor: 1}}
  - run: {seconds: 1200, until: {buildings: {InsulatedManualPressureDoor: 1}, pending_construction: 0}}
  - click_world: {cell: [112, 208]}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - expect_ui:
      "**/DetailsScreen/TitleBar/Border/LabelGroup/Label": {text: "~Insulated Manual Airlock"}
  - expect_state:
      "selected:Building.Def.ThermalConductivity": 0.01
      "selected:InsulatingDoor.door.doorType": ManualPressure
  # Its cells now conduct heat far less than open cells.
  - expect_state: {"cells:112,207..112,208::Grid.Insulation.get_Item({cell})": "< 510"}
  - expect_state: {"cells:112,207..112,208::Grid.Insulation.get_Item({cell})": "== original"}
  - shot: {name: details, crop: "**/DetailsScreen", threshold: 0.04}

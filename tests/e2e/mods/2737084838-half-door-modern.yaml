# Half Door Modern (Spaced out!+) (2737084838), class B.
#
# What it does: adds three 1x1 doors to the Base menu, half the height of the game's doors (a
# component sets their animation height to 0.5): the Half Pneumatic Door (no research), the
# Half Manual Airlock (Pressure Management) and the Half Mechanized Airlock (Directed Air
# Streams, 60 W), all of any metal.
# How a player reaches it: the build menu (Base).
# What changes: one-tile doors.
#
# setup spawns copper ore. A Half Pneumatic Door is picked in the Base menu and placed in the
# dug-out corridor west of the printing pod (its prefab id has dots, which OniMcp's counts do
# not see, so it is counted through state), built and selected; its animation is half height.
from: early-base
mods: [2737084838]
setup:
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"Cuprite\").substance", method: SpawnResource, args: [[109.5, 206.5, -12], 300, 300, 255, 0]}}
steps:
  - expect_state:
      "Assets.GetBuildingDef(\"Ecenizo.HalfPneumaticDoorConfig\").HeightInCells": 1
      "count:all:Door::[*] if .name == 'Ecenizo.HalfPneumaticDoorConfigComplete'": 0
  - run: {seconds: 5}
  - driver: {camera.set: {cell: [113, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Base"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/Ecenizo.HalfPneumaticDoorConfig Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/Ecenizo.HalfPneumaticDoorConfig Group*"}
  - ui_wait: {path: "**/ProductInfoScreen", cond: stable}
  - shot: {name: product, crop: "**/ProductInfoScreen", threshold: 0.04}
  - click_world: {cell: [113, 206]}
  - key: {code: Escape}
  - run: {seconds: 900, until: {pending_construction: 0}}
  - expect_state:
      "count:all:Door::[*] if .name == 'Ecenizo.HalfPneumaticDoorConfigComplete'": 1
  - driver: {camera.set: {cell: [113, 207], ortho: 8}}
  - click_world: {cell: [113, 206], select: Ecenizo.HalfPneumaticDoorConfig}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - expect_ui:
      "**/DetailsScreen/TitleBar/Border/LabelGroup/Label": {text: "~Half Pneumatic Door"}
  - expect_state:
      "selected:GetComponent<KBatchedAnimController>.animHeight": 0.5
  - shot: {name: details, crop: "**/DetailsScreen", threshold: 0.04}

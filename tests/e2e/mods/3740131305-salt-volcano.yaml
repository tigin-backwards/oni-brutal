# Custom Geysers - Salt Volcano (3740131305), class P (a worldgen mod).
#
# What it does: a new generic geyser, the Salt Volcano (GeyserGeneric_molten_salt, 3 x 3): a
# GeyserGenericConfig.GenerateConfigs postfix adds its type (molten salt at 1600 K, 800 to
# 1600 kg a cycle, a maximum pressure of 150 kg), generic so that worldgen may roll it wherever
# a random geyser goes; a Geotuner postfix gives it tuning settings; its name and description
# are added to the strings, and a template places one.
# How a player reaches it: a new world's random geysers, or the sandbox spawner.
# What changes: one more kind of geyser.
#
# Functional expectations (mod-play-testing.md, "Worldgen mods"): its prefab is registered
# beside the random geyser spawner's, and one placed in the dug-out corridor west of the
# printing pod is selected: its name, its element, its rolled rate within the type's range.
from: early-base
mods: [3740131305]
setup:
  - driver: {setup.call: {target: "Scenario.SpawnPrefab(131124, 0, 0, \"GeyserGeneric_molten_salt\", \"BuildingBack\")", method: SetActive, args: [true]}}
steps:
  - expect_state:
      "Assets.GetPrefab(\"GeyserGeneric_molten_salt\")": exists
      "Assets.GetPrefab(\"GeyserGeneric\")": exists
  - driver: {camera.set: {cell: [110, 208], ortho: 8}}
  - click_world: {cell: [108, 207], select: GeyserGeneric_molten_salt}
  - ui_wait: {path: "**/DetailsScreen/TitleBar", cond: stable}
  - expect_ui:
      "**/DetailsScreen/TitleBar/Border/LabelGroup/Label": {text: "~Salt Volcano"}
  - expect_state:
      "selected:Geyser.configuration.GetElement()": "== 'MoltenSalt'"
      "selected:Geyser.configuration.GetTemperature()": [">= 1599.99", "<= 1600.01"]
      "selected:Geyser.configuration.GetMaxPressure()": 150
      "selected:Geyser.configuration.scaledRate": [">= 800", "<= 1600"]
  # Rolled from the world seed and the cell, as in the original: to a float's last bits, which
  # Mono's double-precision intermediates set (ARCHITECTURE D25).
  - expect_state:
      "selected:Geyser.configuration.scaledRate": [">= 0.99999 * original", "<= 1.00001 * original"]

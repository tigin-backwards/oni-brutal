# Not 0K, But Pretty Cool Place (3413401611), classes P, O (a worldgen mod).
#
# What it does: near-absolute-zero clusters, a base-game one (Not 0K Classic) and for Spaced
# Out a Classic-style cluster (Not 0K Cluster, coordinate prefix ABZ-TG-C) and a mini one: a
# 240 x 380 start of frozen copies of the classic biomes, a shelter cave and critter caves
# (templates of its own), an iced swamp rocket world and the game's moonlets. Its code adds two
# temperature ranges, AbsoluteZero (5 to 15 K) and SuperCold (15 to 100 K), to the Temperature
# enum's names by Harmony prefixes on Enum.ToString and Enum.Parse; turns every subworld of its
# clusters' other worlds to AbsoluteZero and its own worlds' start biome colder (a
# TerrainCell.GetTemperatureRange postfix, by its Mode option); lets elements start below
# their low temperature (a transpiler on TerrainCell.ApplyBackground); edits its template
# rules by its options and the DLCs mixed in (a MutatedWorldData postfix), and when the
# Temporal Tear registers it spawns every waiting entity (Critter Save).
# How a player reaches it: the main menu, New Game, Survival, Classic; the carousel lists the
# Not 0K clusters; its options are in the Mods screen.
# What changes: the cluster a new game generates.
#
# With its defaults (Frigid Challenge, shelter and critter caves, Critter Save): from a colony,
# Main Menu, Quit Without Saving, New Game, Survival, Classic; the cluster chosen by typing its
# coordinate (fixed seed), launched and embarked. Functional expectations (mod-play-testing.md,
# "Worldgen mods"): the worlds, the start world's size and subworlds, many waiting entities
# spawned at once when the tear registered, the tear still shut.
from: early-base
mods: [3413401611]
memory_gb: 9
steps:
  - key: {code: Escape}
  - ui_wait: {path: "**/PauseScreen/**/Main MenuButton", cond: stable}
  - click: {ui: "**/PauseScreen/**/Main MenuButton"}
  - ui_wait: {path: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton", cond: stable}
  - click: {ui: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton"}   # Quit Without Saving
  - ui_wait: {path: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons", cond: stable, frames: 3000}
  - click: {text: "NEW GAME", under: "**/MainMenuButtons"}
  - ui_wait: {path: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame", cond: stable}
  - click: {ui: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame"}
  - ui_wait: {path: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/ClassicStyleGame", cond: stable}
  - click: {ui: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/ClassicStyleGame"}
  - ui_wait: {path: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton", cond: stable, frames: 3000}
  - expect_state:
      "count:all:DestinationSelectPanel::[0].clusterKeys[*] if .Contains(\"AbsoluteZero\") == true": ">= 1"
      # The mod's names for its temperature ranges, through its Enum.ToString prefix.
      "SettingsCache.temperatures.ContainsKey(30)": true
  - click: {ui: "**/CoordinateContainer/SeedInput"}
  - ui_wait: {path: "**/CoordinateContainer/SeedInput", cond: stable}
  - type: {ui: "**/CoordinateContainer/SeedInput", text: "ABZ-TG-C-12345-0-0-0", clear: true, enter: true}
  - ui_wait: {path: "**/Section - Destination/DestinationDetailsHeader/ClusterName", cond: text, value: "~Not 0K Cluster"}
  - expect_ui:
      "**/CoordinateContainer/SeedInput/Text Area/Text": {text: "~ABZ-TG-C-12345-0-0-0"}
  - expect_state:
      "CustomGameSettings.Instance.GetCurrentQualitySetting(\"ClusterLayout\").id": {save_as: layout}
  - ui_dump: {name: asteroids, root: "**/Section - Destination/World Scoll (Rect Size Set By Screen Code!)/Content/Details"}
  - click: {ui: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton"}
  # Worldgen runs on its own thread; the Duplicant selection follows once the world is loaded.
  - ui_wait: {path: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton", cond: stable, frames: 60000}
  - click: {ui: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton"}
  - ui_wait: {path: "**/MinionSelectScreen", cond: gone, frames: 6000}
  - expect_state:
      "ClusterManager.Instance.WorldContainers.Count": {save_as: worlds}
      "ClusterManager.Instance.GetStartWorld().worldName": "expansion1::worlds/AbsoluteZeroSO"
      "ClusterManager.Instance.GetStartWorld().worldSize.x": 240
      "ClusterManager.Instance.GetStartWorld().worldSize.y": 380
      "count:ClusterManager.Instance.WorldContainers[*] if .worldName == expansion1::worlds/MediumSwampyABZ": 1
      "Components.LiveMinionIdentities.Count": 3
      "count:ClusterManager.Instance.GetStartWorld().m_generatedSubworlds[*] if .EndsWith(\"ABZ\") == true": ">= 5"
      "SaveGame.Instance.worldGenSpawner.spawnables.Count": {save_as: spawners}
      "all:TemporalTear::Length": 1
      "all:TemporalTear::[0].IsOpen()": false
  - expect_state:
      "ClusterManager.Instance.WorldContainers.Count": ">= 6"
  # Critter Save: the waiting entities spawned when the tear registered (a new world of the
  # game's spawns only what it uncovers).
  - expect_state:
      "count:SaveGame.Instance.worldGenSpawner.spawnables[*] if .isSpawned == true": ">= 0.2 * spawners"

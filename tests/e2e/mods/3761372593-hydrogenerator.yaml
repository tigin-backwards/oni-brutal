# Hydrogenerator (3761372593), class B.
#
# What it does (Spaced Out only): adds three generators to the Power menu: the Micro and
# Compact Hydro Generators, researched with Acoustics (Smart Battery), and the Hydro
# Generator, with a new Hydrodynamic Power node after Renewable Energy. They attach to a
# water geyser: a postfix on Geyser.OnSpawn gives every water geyser a BuildingAttachPoint
# socket (HydroGeneratorSocket, and a low-flow one for small geysers), and the generator
# makes power while the geyser erupts.
# How a player reaches it: the research screen, then the build menu (Power).
# What changes: a geyser-mounted power source.
#
# setup places a water geyser and a cool steam vent in the dug-out corridor west of the
# printing pod and researches Hydrodynamic Power and Acoustics. The water geyser has the
# socket, the steam vent none; the three generators show in the Power menu.
from: early-base
mods: [3761372593]
setup:
  - driver: {setup.call: {target: "Scenario.SpawnPrefab(0, 110, 206, \"GeyserGeneric_hot_water\", \"BuildingBack\")", method: SetActive, args: [true]}}
  - driver: {setup.call: {target: "Scenario.SpawnPrefab(0, 116, 206, \"GeyserGeneric_steam\", \"BuildingBack\")", method: SetActive, args: [true]}}
  - driver: {setup.call: {target: "Research.Instance", method: SetActiveResearch, args: [{"$": "Db.Get().Techs.Get(\"HydroGenerator_HydrodynamicPower\")"}, true]}}
  - driver: {setup.call: {target: "Research.Instance", method: CompleteQueue}}
  - driver: {setup.call: {target: "Research.Instance", method: SetActiveResearch, args: [{"$": "Db.Get().Techs.Get(\"Acoustics\")"}, true]}}
  - driver: {setup.call: {target: "Research.Instance", method: CompleteQueue}}
steps:
  - expect_state:
      "Db.Get().Techs.Get(\"HydroGenerator_HydrodynamicPower\").unlockedItemIDs": {contains: HydroGenerator_HydroGenerator}
      "Db.Get().Techs.Get(\"Acoustics\").unlockedItemIDs": [{contains: HydroGenerator_MicroHydroGenerator}, {contains: HydroGenerator_CompactHydroGenerator}]
      "Assets.GetBuildingDef(\"HydroGenerator_HydroGenerator\").GeneratorWattageRating": 2400
  - run: {seconds: 5}
  - driver: {camera.set: {cell: [113, 208], ortho: 10}}
  - click_world: {cell: [110, 207], select: GeyserGeneric_hot_water}
  - expect_state:
      "selected:GetComponent<BuildingAttachPoint>.points.Length": ">= 1"
      "selected:GetComponent<BuildingAttachPoint>.points[0].attachableType.Name": HydroGeneratorSocket
  - click_world: {cell: [116, 207], select: GeyserGeneric_steam}
  - expect_state:
      "selected:GetComponent<BuildingAttachPoint>": missing
  - key: {code: Escape}
  - click: {ui: "**/PlanScreen/Toggle:Power"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/HydroGenerator_HydroGenerator Group*", cond: stable}
  - expect_ui:
      "**/BuildingGroups/**/Grid/HydroGenerator_MicroHydroGenerator Group*": {active: true}
      "**/BuildingGroups/**/Grid/HydroGenerator_CompactHydroGenerator Group*": {active: true}
      "**/BuildingGroups/**/Grid/HydroGenerator_HydroGenerator Group*": {active: true}
  - shot: {name: power-menu, crop: "**/PlanBuildingSelectionPanel/BuildingGroups", threshold: 0.04}

# Free Resource Buildings Branch (3047547550), classes B, S, O.
#
# What it does: adds buildings that make resources from nothing, each turned on by a PLib
# option and unlocked by early, mid or late research or none (HowToGetTheseItems, default:
# early): the Power Box (FreeEnergyGenerator, 1x1, refined metal, Power menu, Power
# Regulation research), a free generator whose wattage a side screen slider sets (2000 W by
# default); gas and liquid sources and sinks, magic storage, refrigerator, feeders, wardrobe,
# first aid box, radbolt source, heater, bottle and gas vanishers, conveyor source and trash
# can. Side screen patches order its filter and slider screens.
# How a player reaches it: the build menu, after the research; the buildings' side screens.
# What changes: free power, materials and disposal.
#
# setup grants Power Regulation and sets 300 kg of copper down in the dug-out corridor west
# of the printing pod. A Power Box is built there; once built it is selected, and it
# generates its default 2000 W (its wattage slider is not driven).
from: early-base
mods: [3047547550]
setup:
  - driver: {setup.call: {target: "Research.Instance", method: SetActiveResearch, args: [{"$": "Db.Get().Techs.Get(\"PowerRegulation\")"}, true]}}
  - driver: {setup.call: {target: "Research.Instance", method: CompleteQueue}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"Copper\").substance", method: SpawnResource, args: [[110.5, 206.5, -12], 300, 300, 255, 0]}}
steps:
  - expect_state:
      "Db.Get().Techs.Get(\"PowerRegulation\").unlockedItemIDs": {contains: FreeEnergyGenerator}
  - build: {prefab: FreeEnergyGenerator, at: [114, 206], material: Copper}
  - expect: {blueprints: {FreeEnergyGenerator: 1}}
  - run: {seconds: 900, until: {buildings: {FreeEnergyGenerator: 1}, pending_construction: 0}}
  - driver: {camera.set: {cell: [114, 208], ortho: 8}}
  - click_world: {cell: [114, 206], select: FreeEnergyGenerator}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - expect_state:
      "selected:GetComponent<FreeResourceBuildings.FreeEnergyGenerator>.currentCapacity": 2000

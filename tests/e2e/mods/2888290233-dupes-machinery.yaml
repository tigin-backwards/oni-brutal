# Dupes Machinery (2888290233), classes B, O.
#
# What it does: adds machines to the Oxygen and Refining menus, each in a vanilla tech: algae,
# slime and coral vats, coal, gas and wooden boilers, an ethanol still and polymerizer, a
# flocculation sieve, a salt water synthesizer, and the Carbon Dioxide Pump (Co2Pump,
# Agriculture): a 1x1 powered pump of metal ore that sucks carbon dioxide within 3 cells into
# a gas pipe. A PLib options menu toggles some of them.
# How a player reaches it: the build menu (Oxygen, Refining), after research.
# What changes: new ways to make and move gases and liquids.
#
# setup grants Agriculture. The CO2 pump is picked in the build menu's Oxygen category and
# placed in the dug-out corridor west of the printing pod (from the base's metal ore), built,
# unpowered, and selected.
from: early-base
mods: [2888290233]
setup:
  - driver: {setup.call: {target: "Research.Instance.GetTechInstance(\"Agriculture\")", method: Purchased}}
  # The build menu shows a category once one of its buildings is researched, as it learns.
  - driver: {setup.call: {target: "Game.Instance", method: Trigger, args: [-107300940]}}
  - driver: {setup.call: {target: "PlanScreen.Instance._researchedDefs", method: Clear}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"Cuprite\").substance", method: SpawnResource, args: [[109.5, 206.5, -12], 200, 300, 255, 0]}}
steps:
  - run: {seconds: 5}
  - driver: {camera.set: {cell: [113, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Oxygen"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/Co2Pump Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/Co2Pump Group*"}
  - ui_wait: {path: "**/ProductInfoScreen", cond: stable}
  - shot: {name: product, crop: "**/ProductInfoScreen", threshold: 0.04}
  - click_world: {cell: [114, 206]}
  - key: {code: Escape}
  - expect: {blueprints: {Co2Pump: 1}}
  - run: {seconds: 1200, until: {buildings: {Co2Pump: 1}, pending_construction: 0}}
  - driver: {camera.set: {cell: [114, 207], ortho: 8}}
  - click_world: {cell: [114, 206], select: Co2Pump}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - expect_ui:
      "**/DetailsScreen/TitleBar/Border/LabelGroup/Label": {text: "/\\S/"}
  - expect_state:
      "selected:GetComponent<ElementConsumer>.elementToConsume": CarbonDioxide
      "selected:GetComponent<ConduitDispenser>.conduitType": Gas
  - shot: {name: details, crop: "**/DetailsScreen", threshold: 0.04}

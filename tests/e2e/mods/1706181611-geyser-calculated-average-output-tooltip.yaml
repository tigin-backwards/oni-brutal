# Geyser Calculated Average Output Tooltip (1706181611), class P.
#
# What it does: a geyser's descriptors (its info panel and tooltips) gain "Calculated Average
# Output: N g/s", its output averaged over eruptions and dormancy, or "(Requires Analysis)"
# until a Duplicant has analysed it (a postfix on Geyser.GetDescriptors).
# How a player reaches it: select a geyser.
# What changes: one more line in the geyser's status panel.
#
# early-base has no geyser in sight (its one is buried in rock): setup places a cool steam
# vent in the dug-out corridor west of the printing pod. Analysing it needs a Duplicant with
# the Field Research skill, which early-base lacks, so the unanalysed line is checked.
from: early-base
mods: [1706181611]
setup:
  - driver: {setup.call: {target: "Scenario.SpawnPrefab(0, 112, 206, \"GeyserGeneric_steam\", \"BuildingBack\")", method: SetActive, args: [true]}}
steps:
  - driver: {camera.set: {cell: [112, 208], ortho: 8}}
  - click_world: {cell: [112, 207]}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - expect_state: {"selected:GetComponent<Geyser>": exists}
  - expect_ui:
      "**/SimpleInfoScreen/**/Descriptors/DescLabel": {any_text: "~Calculated Average Output: (Requires Analysis)"}
  - ui_dump: {name: descriptors, root: "**/SimpleInfoScreen/**/ContentStatus/Descriptors"}

# From the landing: dig out the cuprite west of the printing pod and the sandstone east of it,
# then build an outhouse, a research station, a manual generator and a cot from what was dug.
# Saves the early-base checkpoint.
from: landing
steps:
  - expect: {duplicants: 3, buildings: {Headquarters: 1, RationBox: 1}}
  - dig: [110, 207, 118, 209]
  - dig: [131, 207, 135, 209]
  - run: {seconds: 600, until: {pending_digs: 0}}
  - build: {prefab: Outhouse, at: [119, 207]}
  - build: {prefab: ResearchCenter, at: [127, 207]}
  - build: {prefab: ManualGenerator, at: [129, 207]}
  - build: {prefab: Bed, at: [132, 207]}
  - expect: {pending_construction: 4}
  - run: {seconds: 1200, until: {pending_construction: 0}}
  - expect:
      duplicants: 3
      buildings: {Outhouse: 1, ResearchCenter: 1, ManualGenerator: 1, Bed: 1}
  - save: early-base

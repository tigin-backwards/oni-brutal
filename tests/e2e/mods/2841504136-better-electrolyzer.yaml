# Better Electrolyzer (2841504136), class P.
#
# What it does: postfixes on ElectrolyzerConfig: the Electrolyzer stops at 50 kg of gas
# pressure (the game's 1.8 kg), can be built anywhere, cannot be flooded and rotates all four
# ways.
# How a player reaches it: the Oxygen menu's Electrolyzer.
# What changes: an electrolyzer that works under water and at high pressure.
#
# The Electrolyzer's tech is researched in setup. The def and prefab carry the new numbers; an Electrolyzer is built by setup in the
# corridor west of the printing pod and keeps its 50 kg limit.
from: early-base
mods: [2841504136]
setup:
  - driver: {setup.call: {target: "Research.Instance", method: SetActiveResearch, args: [{"$": "Db.Get().Techs.TryGetTechForTechItem(\"Electrolyzer\")"}, true]}}
  - driver: {setup.call: {target: "Research.Instance", method: CompleteQueue}}
  - driver: {setup.call: {target: "Game.Instance", method: Trigger, args: [-107300940]}}
  - driver: {setup.call: {target: "PlanScreen.Instance._researchedDefs", method: Clear}}
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"Electrolyzer\")", method: Build, args: [{"$": "Grid.XYToCell(112, 206)"}, Neutral, null, [Copper], 293.15, DEFAULT_FACADE]}}
steps:
  - expect_state:
      "Assets.GetPrefab(\"Electrolyzer\").GetComponent<Electrolyzer>.maxMass": 50
      "Assets.GetBuildingDef(\"Electrolyzer\").Floodable": false
      "Assets.GetBuildingDef(\"Electrolyzer\").BuildLocationRule": "== 'Anywhere'"
      "Assets.GetBuildingDef(\"Electrolyzer\").PermittedRotations": "== 'R360'"
  - run: {seconds: 3}
  - expect: {buildings: {Electrolyzer: 1}}
  - expect_state:
      "all:Electrolyzer::[0].maxMass": 50
  - driver: {camera.set: {cell: [113, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Oxygen"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/Electrolyzer Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/Electrolyzer Group*"}
  - ui_wait: {path: "**/ProductInfoScreen", cond: stable}
  - shot: {name: product, crop: "**/ProductInfoScreen", threshold: 0.04}

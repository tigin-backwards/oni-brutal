# 污染物挥发器 Fuifaji (Pollutant volatilization machine, 3095401174), class B.
#
# What it does: adds two powered Oxygen buildings researched with Directed Air Streams: the
# Polluted Dirt Volatilizer (Wurantuhuifaqi, 1x2, an electrolyzer-like converter fed polluted
# dirt by hand, 1 kg/s into polluted oxygen, stops above 1000 g of pressure) and the
# Polluted Water Volatilizer (Wuranshuihuifaqi, 2x2, piped polluted water, 1 kg/s into
# polluted oxygen), 120 W each.
# How a player reaches it: research Directed Air Streams; the Oxygen menu.
# What changes: polluted dirt and water turn into polluted oxygen.
#
# The research unlocks both; their converters are the mod's. The Oxygen menu offers them and
# the dirt volatilizer's card is shot.
#
# The card is shot with the pointer still on its button: the card collapses when the pointer
# leaves the build menu (ProductInfoScreen.CheckMouseOver), as in 2906165124-christmas-tree.
from: early-base
mods: [3095401174]
setup:
  - driver: {setup.call: {target: "Research.Instance", method: SetActiveResearch, args: [{"$": "Db.Get().Techs.Get(\"DirectedAirStreams\")"}, true]}}
  - driver: {setup.call: {target: "Research.Instance", method: CompleteQueue}}
  - driver: {setup.call: {target: "Game.Instance", method: Trigger, args: [-107300940]}}
  - driver: {setup.call: {target: "PlanScreen.Instance._researchedDefs", method: Clear}}
steps:
  - expect_state:
      "Db.Get().Techs.Get(\"DirectedAirStreams\").unlockedItemIDs": [{contains: Wurantuhuifaqi}, {contains: Wuranshuihuifaqi}]
      "Assets.GetPrefab(\"Wurantuhuifaqi\").GetComponent<ElementConverter>.consumedElements[0].Tag.Name": ToxicSand
      "Assets.GetPrefab(\"Wurantuhuifaqi\").GetComponent<ElementConverter>.outputElements[0].elementHash": ContaminatedOxygen
      "Assets.GetPrefab(\"Wuranshuihuifaqi\").GetComponent<ConduitConsumer>.capacityTag.Name": DirtyWater
      "Assets.GetBuildingDef(\"Wuranshuihuifaqi\").EnergyConsumptionWhenActive": 120
  - run: {seconds: 3}
  - driver: {camera.set: {cell: [113, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Oxygen"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/Wurantuhuifaqi Group*", cond: stable}
  - expect_ui:
      "**/BuildingGroups/**/Grid/Wuranshuihuifaqi Group*": {active: true}
  - click: {ui: "**/BuildingGroups/**/Grid/Wurantuhuifaqi Group*"}
  - ui_wait: {path: "**/ProductInfoScreen", cond: stable}
  - shot: {name: product, crop: "**/ProductInfoScreen", threshold: 0.04, pointer: stay}

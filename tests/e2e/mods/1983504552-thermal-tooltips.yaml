# Thermal Tooltips (1983504552), classes S, O.
#
# What it does: the build menu's material panel lists, for the material under the pointer, the
# completed building's thermal conductivity, thermal mass and melting point (each with a
# tooltip), instead of the game's effects list; and the hover card over a cell or an item shows
# its heat energy, thermal mass and the temperatures it changes state at. PLib options: show
# these only on the Temperature overlay (the default), and give temperatures in all units.
# How a player reaches it: the build menu (any building, its materials); hovering the world.
# What changes: the material panel's effects, and the hover card.
#
# The Tile is picked in the Base menu after a short run (the menu counts materials only then);
# its material panel shows the thermal lines for the first material, sandstone.
from: early-base
mods: [1983504552]
steps:
  - run: {seconds: 5}
  - driver: {camera.set: {cell: [126, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Base"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/Tile Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/Tile Group*"}
  - ui_wait: {path: "**/ProductInfoScreen", cond: stable}
  - expect_state:
      "type:PeterHan.ThermalTooltips.ThermalTooltipsPatches::buildingInstance.Def.PrefabID": Tile
  - expect_ui:
      "**/ProductInfoScreen/**/MaterialEffects/DescLabel": {any_text: "~Thermal Conductivity"}
  - shot: {name: materials, crop: "**/ProductInfoScreen", threshold: 0.04}

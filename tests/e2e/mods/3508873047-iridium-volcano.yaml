# Custom Geysers - Iridium Volcano (3508873047), classes P, O (a worldgen mod).
#
# What it does: a new generic volcano, the Iridium Volcano (GeyserGeneric_molten_iridium, 3 x 3): a
# GeyserGenericConfig.GenerateConfigs postfix adds its type (Molten Iridium at 3300 K, 200 to
# 400 kg a cycle, a maximum pressure of 150 kg), generic so that worldgen may roll it
# wherever a random geyser goes; a Geotuner postfix gives it tuning settings; its name and
# description are added to the strings.
# How a player reaches it: a new world's random geysers, or the sandbox spawner.
# What changes: one more kind of geyser.
#
# Functional expectations (mod-play-testing.md, "Worldgen mods"): its prefab is registered
# beside the random geyser spawner's, and a Iridium Volcano placed in the dug-out corridor west of the
# printing pod is selected: its name, its element, its rolled rate within the type's range.
from: early-base
mods: [3508873047]
setup:
  - driver: {setup.call: {target: "Scenario.SpawnPrefab(131124, 0, 0, \"GeyserGeneric_molten_iridium\", \"BuildingBack\")", method: SetActive, args: [true]}}
steps:
  - expect_state:
      "Assets.GetPrefab(\"GeyserGeneric_molten_iridium\")": exists
      "Assets.GetPrefab(\"GeyserGeneric\")": exists
  - driver: {camera.set: {cell: [110, 208], ortho: 8}}
  - click_world: {cell: [108, 206], select: GeyserGeneric_molten_iridium}
  - ui_wait: {path: "**/DetailsScreen/TitleBar", cond: stable}
  - expect_ui:
      "**/DetailsScreen/TitleBar/Border/LabelGroup/Label": {text: "~Iridium Volcano"}
  - expect_state:
      "selected:Geyser.configuration.GetElement()": "== 'MoltenIridium'"
      "selected:Geyser.configuration.GetTemperature()": ">= 3299.99"
      "selected:Geyser.configuration.GetMaxPressure()": 150
  - expect_state:
      "selected:Geyser.configuration.GetTemperature()": "<= 3300.01"
      "selected:Geyser.configuration.scaledRate": ">= 200"
  - expect_state:
      "selected:Geyser.configuration.scaledRate": "<= 400"
  # Rolled from the world seed and the cell, as in the original: to a float's last bits, which
  # Mono's double-precision intermediates set (ARCHITECTURE D25).
  - expect_state:
      "selected:Geyser.configuration.scaledRate": ">= 0.99999 * original"
  - expect_state:
      "selected:Geyser.configuration.scaledRate": "<= 1.00001 * original"

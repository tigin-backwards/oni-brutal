# Suit Recharger (2688074001), classes B, S, O.
#
# What it does: adds the Suit Recharger (Equipment, Improved Ventilation; 2x4, refined metal,
# 240 W, a gas input): a Duplicant in an Atmo or Jet Suit whose oxygen or fuel runs low stops
# at it to refill the suit's oxygen and fuel without taking the suit off, and drops the waste
# it carries. Oxygen comes by pipe or is delivered, fuel is delivered (a filter picks which
# fuels); with suit durability on, a side screen sets the durability below which it is not
# used and whether it repairs suits. PLib options set its oxygen and fuel capacities.
# How a player reaches it: the build menu; its side screens.
# What changes: suits are refilled where Duplicants work.
#
# Options here: 300 kg of oxygen. setup grants Improved Ventilation and spawns steel. A Suit
# Recharger is built in the passage west of the printing pod and selected: it takes 300 kg of
# oxygen, and its fuel filter lists the fuels.
from: early-base
mods: [2688074001]
options:
  "2688074001": {o2_capacity: 300}
setup:
  - driver: {setup.call: {target: "Research.Instance.GetTechInstance(\"ImprovedGasPiping\")", method: Purchased}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"Steel\").substance", method: SpawnResource, args: [[110.5, 206.5, -12], 400, 300, 255, 0]}}
steps:
  - expect_state:
      "Db.Get().Techs.Get(\"ImprovedGasPiping\").unlockedItemIDs": {contains: SuitRecharger}
  - build: {prefab: SuitRecharger, at: [113, 206], material: Steel}
  - expect: {blueprints: {SuitRecharger: 1}}
  - run: {seconds: 900, until: {buildings: {SuitRecharger: 1}, pending_construction: 0}}
  - driver: {camera.set: {cell: [113, 208], ortho: 8}}
  - click_world: {cell: [113, 207], select: SuitRecharger}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - expect_ui:
      "**/DetailsScreen/TitleBar/Border/LabelGroup/Label": {text: "~Suit Recharger"}
  - expect_state:
      "selected:GetComponent<ConduitConsumer>.capacityKG": 300
  - shot: {name: details, crop: "**/DetailsScreen", threshold: 0.04}

# Giga-watt Wire (3096204182), classes B, O.
#
# What it does: adds the Jacketed Wire (5 kW), the Mega-watt Wire and its bridge (1 MW), a
# 100 kW transformer (all Renewable Energy), the Giga-watt Wire and its bridge (1 GW) and a 2 MW
# transformer (High Velocity Transport). The big wires are built from a "Conductor" metal
# (copper, gold, aluminium and others, a tag the mod adds) and plastic, by a Duplicant who
# can power-tinker; a prefix on Wire.GetMaxWattageAsFloat gives the new ratings their wattage,
# and wattages print in kW, MW and GW. PLib options toggle each wire and their passing walls.
# How a player reaches it: the build menu (Power), after research; drag-building wires.
# What changes: circuits that carry a megawatt or more.
#
# setup grants Renewable Energy, teaches a Duplicant Power Technician (Technicals1 and 2, for
# CanPowerTinker), and spawns copper and plastic. A run of four Mega-watt Wires is dragged
# with the build tool in the dug-out corridor west of the printing pod, built and selected.
from: early-base
mods: [3096204182]
setup:
  - driver: {setup.call: {target: "Research.Instance.GetTechInstance(\"RenewableEnergy\")", method: Purchased}}
  # The build menu shows a category once one of its buildings is researched, as it learns.
  - driver: {setup.call: {target: "Game.Instance", method: Trigger, args: [-107300940]}}
  - driver: {setup.call: {target: "PlanScreen.Instance._researchedDefs", method: Clear}}
  - driver: {setup.call: {target: "Components.LiveMinionIdentities.Items[1].GetComponent<MinionResume>", method: MasterSkill, args: [Technicals1]}}
  - driver: {setup.call: {target: "Components.LiveMinionIdentities.Items[1].GetComponent<MinionResume>", method: MasterSkill, args: [Technicals2]}}
  - driver: {setup.call: {target: "Components.LiveMinionIdentities.Items[2].GetComponent<MinionResume>", method: MasterSkill, args: [Technicals1]}}
  - driver: {setup.call: {target: "Components.LiveMinionIdentities.Items[2].GetComponent<MinionResume>", method: MasterSkill, args: [Technicals2]}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"Copper\").substance", method: SpawnResource, args: [[111.5, 206.5, -12], 1000, 300, 255, 0]}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"Polypropylene\").substance", method: SpawnResource, args: [[112.5, 206.5, -12], 200, 300, 255, 0]}}
steps:
  - expect_state:
      "ElementLoader.FindElementByName(\"Copper\").oreTags": {contains: Conductor}
  - run: {seconds: 5}
  - driver: {camera.set: {cell: [111, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Power"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/MegawattWire Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/MegawattWire Group*"}
  - ui_wait: {path: "**/ProductInfoScreen", cond: stable}
  - shot: {name: product, crop: "**/ProductInfoScreen", threshold: 0.04}
  - drag: {from: [109, 207], to: [112, 207]}
  - key: {code: Escape}
  - expect: {blueprints: {MegawattWire: 4}}
  - run: {seconds: 1500, until: {buildings: {MegawattWire: 4}, pending_construction: 0}}
  - driver: {camera.set: {cell: [111, 208], ortho: 8}}
  - click_world: {cell: [110, 207], select: MegawattWire}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - expect_state:
      "selected:GetComponent<Wire>.GetMaxWattageRating()": {save_as: rating}
      "Wire.GetMaxWattageAsFloat(7)": 1000000
  - shot: {name: details, crop: "**/DetailsScreen", threshold: 0.04}

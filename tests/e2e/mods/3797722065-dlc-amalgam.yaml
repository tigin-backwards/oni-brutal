# DLC Amalgam — Europa & Mashup (3797722065), classes M, S (worldgen).
#
# What it does: two authored Spaced Out clusters that need all three planet packs, Europa
# (V-EURO-C: a Ceres start over an aquatic underworld, Oily Relica as the warp world, Gravitas
# by rocket, a Demolior impact that misses the start) and Mashup (Onionoid Trinity, V-TRIN-C);
# its own worlds, subworlds and a base template. Patches on the cluster category screen add an
# "Amalgum" asteroid-style card (cloned from the classic one) that shows only these clusters,
# and patches steer the Demolior event onto Relica.
# How a player reaches it: New Game, Survival, the Amalgum card; or a coordinate.
# What changes: two new mixed-DLC clusters.
#
# A new game: the category screen shows the Amalgum card (dumped and shot); it offers the
# mod's clusters, and the coordinate V-EURO-C-12345-0-0-0 selects Europa (its asteroid list is
# dumped). It is launched and the generated cluster is checked functionally: its worlds, the
# start world's name and size.
from: early-base
mods: [3797722065]
memory_gb: 8
steps:
  - key: {code: Escape}
  - ui_wait: {path: "**/PauseScreen/**/Main MenuButton", cond: stable}
  - click: {ui: "**/PauseScreen/**/Main MenuButton"}
  - ui_wait: {path: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton", cond: stable}
  - click: {ui: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton"}   # Quit Without Saving
  - ui_wait: {path: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons", cond: stable, frames: 3000}
  - click: {text: "NEW GAME", under: "**/MainMenuButtons"}
  - ui_wait: {path: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame", cond: stable}
  - click: {ui: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame"}
  - ui_wait: {path: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/DLCAmalgamCategory", cond: stable}
  - ui_dump: {name: categories, root: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles"}
  - shot: {name: categories, crop: "**/ClusterCategorySelectionScreen/Panel", threshold: 0.04}
  - click: {ui: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/DLCAmalgamCategory"}
  - ui_wait: {path: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton", cond: stable, frames: 3000}
  - expect_state:
      "count:all:DestinationSelectPanel::[0].clusterKeys[*] if .EndsWith(\"clusters/EuropaCluster\") == true": 1
      "all:DestinationSelectPanel::[0].clusterKeys.Count": "== original"
  - click: {ui: "**/CoordinateContainer/SeedInput"}
  - ui_wait: {path: "**/CoordinateContainer/SeedInput", cond: stable}
  - type: {ui: "**/CoordinateContainer/SeedInput", text: "V-EURO-C-12345-0-0-0", clear: true, enter: true}
  - ui_wait: {path: "**/Section - Destination/DestinationDetailsHeader/ClusterName", cond: text, value: "~Europa"}
  - expect_state:
      "CustomGameSettings.Instance.GetCurrentQualitySetting(\"ClusterLayout\").id": [{contains: EuropaCluster}, "== original"]
  - ui_dump: {name: asteroids, root: "**/Section - Destination/World Scoll (Rect Size Set By Screen Code!)/Content/Details"}
  - click: {ui: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton"}
  - ui_wait: {path: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton", cond: stable, frames: 60000}
  - click: {ui: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton"}
  - ui_wait: {path: "**/MinionSelectScreen", cond: gone, frames: 6000}
  - expect_state:
      "ClusterManager.Instance.WorldContainers.Count": "== original"
      "ClusterManager.Instance.GetStartWorld().worldName": expansion1::worlds/Europa
      "ClusterManager.Instance.GetStartWorld().worldSize.x": 240
      "ClusterManager.Instance.GetStartWorld().worldSize.y": 380
      "count:ClusterManager.Instance.WorldContainers[*] if .worldName == expansion1::worlds/OilyRelica": 1
      "count:ClusterManager.Instance.WorldContainers[*] if .worldName == expansion1::worlds/EuropaGravitas": 1
      "Components.LiveMinionIdentities.Count": ">= 1"

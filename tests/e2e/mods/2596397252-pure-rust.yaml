# Pure Rust (2596397252), class P (a worldgen mod, with a little code).
#
# What it does: a Spaced Out cluster, Pure Rust (and a mini one), whose 144x232 start world is
# mostly rust biome over uranium and ice, with a rocket world (ocean and oil), a warp world
# (caustic forest and jungle) and small sandstone, wasteland and swamp asteroids of its own
# beside the game's moonlets; its code names them and adds ethanol and liquid chlorine
# geysers to the game's geyser types, and a rusty ore field to the starmap.
# How a player reaches it: the main menu, New Game, Survival, Spaced Out; the destination
# screen's carousel lists it (coordinate prefix P-RUST-C).
# What changes: the cluster a new game generates.
#
# From a colony: the pause menu's Main Menu, Quit Without Saving, New Game, Survival, Spaced
# Out. The cluster is chosen by typing its coordinate (fixed seed), launched and embarked.
# Worldgen expectations are functional: the mod's start world and size, its six worlds among
# the cluster's, the Temporal Tear, the mod's geyser types. The destination's list of
# asteroids is dumped.
from: early-base
mods: [2596397252]
memory_gb: 8
steps:
  - key: {code: Escape}
  - ui_wait: {path: "**/PauseScreen/**/Main MenuButton", cond: stable}
  - click: {ui: "**/PauseScreen/**/Main MenuButton"}
  - ui_wait: {path: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton", cond: stable}
  - click: {ui: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton"}   # Quit Without Saving
  - ui_wait: {path: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons", cond: stable, frames: 3000}
  - click: {text: "NEW GAME", under: "**/MainMenuButtons"}
  - ui_wait: {path: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame", cond: stable}
  - click: {ui: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame"}
  - ui_wait: {path: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/SpacedOutGame", cond: stable}
  - click: {ui: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/SpacedOutGame"}
  - ui_wait: {path: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton", cond: stable, frames: 3000}
  - expect_state:
      "count:all:DestinationSelectPanel::[0].clusterKeys[*] if .Contains(\"clusters/PureRustCluster\") == true": 1
  - click: {ui: "**/CoordinateContainer/SeedInput"}
  - ui_wait: {path: "**/CoordinateContainer/SeedInput", cond: stable}
  - type: {ui: "**/CoordinateContainer/SeedInput", text: "P-RUST-C-12345-0-0-0", clear: true, enter: true}
  - ui_wait: {path: "**/Section - Destination/DestinationDetailsHeader/ClusterName", cond: stable}
  - expect_state:
      "CustomGameSettings.Instance.GetCurrentQualitySetting(\"ClusterLayout\").id.EndsWith(\"clusters/PureRustCluster\")": true
  - ui_dump: {name: asteroids, root: "**/Section - Destination/World Scoll (Rect Size Set By Screen Code!)/Content/Details"}
  - click: {ui: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton"}
  - ui_wait: {path: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton", cond: stable, frames: 60000}
  - click: {ui: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton"}
  - ui_wait: {path: "**/MinionSelectScreen", cond: gone, frames: 6000}
  - expect_state:
      "ClusterManager.Instance.GetStartWorld().worldName.EndsWith(\"worlds/PureStartRustRadioactive\")": true
      "ClusterManager.Instance.GetStartWorld().worldSize.x": 144
      "ClusterManager.Instance.GetStartWorld().worldSize.y": 232
      "ClusterManager.Instance.WorldContainers.Count": ">= 10"
      "count:GeyserConfigurator.geyserTypes[*] if .id == liquid_ethanol": 1
      "count:ClusterManager.Instance.WorldContainers[*] if .worldName.Contains(\"worlds/Pure\") == true": 6
      "Components.LiveMinionIdentities.Count": 3
      "all:TemporalTear::Length": 1

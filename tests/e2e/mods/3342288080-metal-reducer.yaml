# 金属还原器 Metal Reducer (3342288080), class B.
#
# What it does: adds the 金属还原器 (reMetalRefinery, 3x4, the Metal Refinery's art), a powered
# fabricator for the Refining menu unlocked by Smelting: 100 kg of a refined metal turn back
# into 100 kg of its ore (one recipe per metal whose melt freezes into something else), 40 s
# each, at 2000 W.
# How a player reaches it: research Smelting; the Refining menu; its recipe side screen.
# What changes: refined metal can be turned back into ore.
#
# Smelting is researched in setup and one built in the west corridor. The Refining menu offers
# it (its card is shot); it has its recipes (as many as in the original), copper back to
# copper ore among them.
from: early-base
mods: [3342288080]
setup:
  - driver: {setup.call: {target: "Research.Instance", method: SetActiveResearch, args: [{"$": "Db.Get().Techs.Get(\"Smelting\")"}, true]}}
  - driver: {setup.call: {target: "Research.Instance", method: CompleteQueue}}
  - driver: {setup.call: {target: "Game.Instance", method: Trigger, args: [-107300940]}}
  - driver: {setup.call: {target: "PlanScreen.Instance._researchedDefs", method: Clear}}
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"reMetalRefinery\")", method: Build, args: [131763, Neutral, null, [SandStone], 293.15, DEFAULT_FACADE]}}
steps:
  - expect_state:
      "Db.Get().Techs.Get(\"Smelting\").unlockedItemIDs": {contains: reMetalRefinery}
      "Assets.GetBuildingDef(\"reMetalRefinery\").EnergyConsumptionWhenActive": 2000
      "count:ComplexRecipeManager.Get().recipes[*] if .fabricators[0].Name == reMetalRefinery": [">= 3", "== original"]
      "count:ComplexRecipeManager.Get().recipes[*] if .fabricators[0].Name == reMetalRefinery and .ingredients[0].material.Name == Copper and .results[0].material.Name == Cuprite": 1
  - run: {seconds: 3}
  - expect: {buildings: {reMetalRefinery: 1}}
  - driver: {camera.set: {cell: [113, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Refinement"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/reMetalRefinery Group*", cond: stable}
  - scroll: {at: "**/PlanBuildingSelectionPanel/BuildingGroups", notches: -10}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/reMetalRefinery Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/reMetalRefinery Group*"}
  - ui_wait: {path: "**/ProductInfoScreen", cond: stable}
  - shot: {name: product, crop: "**/ProductInfoScreen", threshold: 0.04}

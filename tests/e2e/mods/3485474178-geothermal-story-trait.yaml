# Geothermal Story Trait (3485474178), classes P, O (a worldgen mod; needs the Frosty Planet
# DLC).
#
# What it does: makes the Frosty Planet pack's geothermal power plant a story trait any
# asteroid can take (storytraits/CGM_GeothermalHeatPump): a Stories postfix adds the story
# CGM_GeothermalHeatPump; its trait places the geothermal controller near the depths and three
# geothermal vents around it; switching it on turns the Frosty Planet's mixing on, and it is
# switched off on a cluster that has the plant already (Ceres); its icons join the sprites.
# How a player reaches it: the destination screen's Story Traits tab, its row's checkbox.
# What changes: a new game gets the geothermal plant.
#
# From a colony: Main Menu, Quit Without Saving, New Game, Survival, Classic; Terra at a fixed
# coordinate (the random story traits seeded); on the Story Traits tab Geothermal Heat Pump is
# chosen and switched on; launched and embarked. Functional expectations (mod-play-testing.md,
# "Worldgen mods"): the start world has the story trait, the controller and the vents wait
# among the spawners.
from: early-base
mods: [3485474178]
memory_gb: 8
steps:
  - key: {code: Escape}
  - ui_wait: {path: "**/PauseScreen/**/Main MenuButton", cond: stable}
  - click: {ui: "**/PauseScreen/**/Main MenuButton"}
  - ui_wait: {path: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton", cond: stable}
  - click: {ui: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton"}   # Quit Without Saving
  - ui_wait: {path: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons", cond: stable, frames: 3000}
  - click: {text: "NEW GAME", under: "**/MainMenuButtons"}
  - ui_wait: {path: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame", cond: stable}
  - click: {ui: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame"}
  - ui_wait: {path: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/ClassicStyleGame", cond: stable}
  # The screen picks five story traits at random (StoryContentPanel.SelectRandomStories).
  - driver: {seed: 12345}
  - click: {ui: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/ClassicStyleGame"}
  - ui_wait: {path: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton", cond: stable, frames: 3000}
  # A new cluster picks five story traits at random again (StoryContentPanel.SelectRandomStories).
  - driver: {seed: 12345}
  - click: {ui: "**/CoordinateContainer/SeedInput"}
  - ui_wait: {path: "**/CoordinateContainer/SeedInput", cond: stable}
  - type: {ui: "**/CoordinateContainer/SeedInput", text: "V-SNDST-C-12345-0-0-0", clear: true, enter: true}
  - ui_wait: {path: "**/CoordinateContainer/SeedInput/Text Area/Text", cond: text, value: "~V-SNDST-C-12345"}
  - expect_state:
      "CustomGameSettings.Instance.GetCurrentQualitySetting(\"ClusterLayout\").id": "expansion1::clusters/VanillaSandstoneCluster"
  - expect_state:
      "count:Db.Get().Stories.resources[*] if .Id == CGM_GeothermalHeatPump": 1
      "CustomGameSettings.Instance.GetCurrentStoryTraitSetting(\"CGM_GeothermalHeatPump\").id": Disabled
  - click: {ui: "**/ColonyDestinationScreen2/Layout/Map/MenuTabs/Story Traits Tab"}
  - ui_wait: {path: "**/ColonyDestinationScreen2/Layout/StoryContent/StoryLeftPanel", cond: stable}
  # The mod's story is the list's last row, below its fold.
  - scroll: {at: "**/StoryContent/StoryLeftPanel/Story Scoll (Rect Size Set By Screen Code!)", notches: -10}
  - ui_wait: {path: "**/StoryContent/StoryLeftPanel/Story Scoll (Rect Size Set By Screen Code!)/Content", cond: stable}
  - click: {text: "Geothermal Heat Pump", under: "**/StoryContent/StoryLeftPanel"}
  - click: {ui: "**/StoryContent/StoryLeftPanel/**/Details/StoryPrefab/ToggleAnchor/Checkbox", index: 6}
  - expect_state:
      "CustomGameSettings.Instance.GetCurrentStoryTraitSetting(\"CGM_GeothermalHeatPump\").id": Guaranteed
  - ui_dump: {name: stories, root: "**/ColonyDestinationScreen2/Layout/StoryContent/StoryLeftPanel"}
  - click: {ui: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton"}
  - ui_wait: {path: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton", cond: stable, frames: 60000}
  - click: {ui: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton"}
  - ui_wait: {path: "**/MinionSelectScreen", cond: gone, frames: 6000}
  - expect_state:
      "Components.LiveMinionIdentities.Count": 3
      "ClusterManager.Instance.GetStartWorld().StoryTraitIds": {contains: storytraits/CGM_GeothermalHeatPump}
      "count:SaveGame.Instance.worldGenSpawner.spawnables[*] if .spawnInfo.id == GeothermalControllerEntity": 1
      "count:SaveGame.Instance.worldGenSpawner.spawnables[*] if .spawnInfo.id.StartsWith(\"GeothermalVent\") == true": ">= 3"

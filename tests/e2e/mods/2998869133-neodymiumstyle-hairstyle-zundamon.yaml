# NeodymiumStyle Hairstyle MOD "ZUNDAMON" (2998869133), class X (content for Dupery).
#
# What it does: no code. With Dupery (here Dupery Fixed, 3172734005, which the catalog names as
# its requirement), its PERSONALITIES.json adds a printable Duplicant personality, Zundamon
# (female, Ugly Crier stress reaction, Balloon Artist joy trait), whose hair,
# hair_neo_zundamon, comes from the mod's anim folder; a dream icon and strings/ja.po go with
# it.
# How a player reaches it: Duplicants printed or picked for a new colony; the Duplicant's
# Personality tab.
# What changes: another personality in the pool, with its own hairstyle.
#
# Dupery imports the personality into the game's Personalities and loads the hair as an
# accessory, as its log says.
from: early-base
mods: [3172734005, 2998869133]
require_log: ['\[Dupery\]: accessory hair_neo_zundamon successfully loaded']
steps:
  - expect_state:
      "Db.Get().Personalities.TryGet(\"ZUNDAMON\")": exists
      "Db.Get().Personalities.TryGet(\"ZUNDAMON\").Disabled": false
      "Db.Get().Accessories.TryGet(\"hair_neo_zundamon\")": exists
      "Db.Get().Personalities.Count": "== original"
  - run: {seconds: 10}
  - expect: {duplicants: 3}

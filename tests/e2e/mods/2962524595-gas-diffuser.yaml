# 气体扩散器 Gas Diffuser (2962524595), class B.
#
# What it does: adds five 1x2 metal generators to the Oxygen menu, no research needed: each
# is an Electrolyzer drawing 120 W that burns 0.55 kg/s of algae (330 kg stored, fetched as a
# critical errand) into 0.5 kg/s of one gas at 30 °C: oxygen (GD20230415001), natural gas
# (…002), chlorine (…003), carbon dioxide (…004) or hydrogen (…005). Each has a logic input.
# How a player reaches it: the build menu (Oxygen).
# What changes: algae into any of five gases.
#
# The converters are read; the Oxygen menu lists all five (shot), and a natural gas
# generator built by setup in the dug-out corridor west of the printing pod is selected.
from: early-base
mods: [2962524595]
setup:
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"GD20230415002\")", method: Build, args: [131129, Neutral, null, [Cuprite], 293.15, DEFAULT_FACADE]}}
steps:
  - expect_state:
      "Assets.GetPrefab(\"GD20230415001\").GetComponent<ElementConverter>.outputElements[0].elementHash": "== 'Oxygen'"
      "Assets.GetPrefab(\"GD20230415002\").GetComponent<ElementConverter>.outputElements[0].elementHash": "== 'Methane'"
      "Assets.GetPrefab(\"GD20230415003\").GetComponent<ElementConverter>.outputElements[0].elementHash": "== 'ChlorineGas'"
      "Assets.GetPrefab(\"GD20230415004\").GetComponent<ElementConverter>.outputElements[0].elementHash": "== 'CarbonDioxide'"
      "Assets.GetPrefab(\"GD20230415005\").GetComponent<ElementConverter>.outputElements[0].elementHash": "== 'Hydrogen'"
      "Assets.GetPrefab(\"GD20230415002\").GetComponent<ElementConverter>.consumedElements[0].MassConsumptionRate": 0.55
      "Assets.GetBuildingDef(\"GD20230415002\").EnergyConsumptionWhenActive": 120
  - run: {seconds: 10}
  - expect: {buildings: {GD20230415002: 1}}
  - click: {ui: "**/PlanScreen/Toggle:Oxygen"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/GD20230415005 Group*", cond: stable, stable: 120, frames: 600}
  - expect_ui:
      "**/BuildingGroups/**/Grid/GD20230415001 Group*": {active: true}
  - shot: {name: oxygen-menu, crop: "**/PlanBuildingSelectionPanel/BuildingGroups", threshold: 0.04}
  - key: {code: Escape}
  - driver: {camera.set: {cell: [113, 208], ortho: 8}}
  - click_world: {cell: [113, 207], select: GD20230415002}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - expect_state:
      "selected:ManualDeliveryKG.RequestedItemTag.Name": Algae
      "selected:Storage.capacityKg": 330

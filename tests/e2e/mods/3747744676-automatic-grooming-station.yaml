# automatic Grooming Station (3747744676), class B.
#
# What it does: adds three powered ranching stations that work without a rancher, beside the
# Grooming Station in the Stations menu: the Auto Grooming Station (AutoGroomingStation, 2x3,
# 120 W, Critter Ranching II) pulls a critter in its ranch room onto its table and grooms it
# for 12 s, giving it the Ranched effect; the Auto Shearing Station (Critter Ranching II) and
# the Auto Milking Station (Dairy Operation) shear and milk the same way.
# How a player reaches it: research Critter Ranching II; the Stations menu.
# What changes: ranching without ranchers.
#
# Critter Ranching II is researched in setup. The three stations are unlocked; one built in
# the corridor west of the printing pod needs a ranch room. The Stations menu offers it (its
# card is shot).
#
# The card is shot with the pointer still on its button: the card collapses when the pointer
# leaves the build menu (ProductInfoScreen.CheckMouseOver), as in 2906165124-christmas-tree.
from: early-base
mods: [3747744676]
setup:
  - driver: {setup.call: {target: "Research.Instance", method: SetActiveResearch, args: [{"$": "Db.Get().Techs.Get(\"AnimalControl\")"}, true]}}
  - driver: {setup.call: {target: "Research.Instance", method: CompleteQueue}}
  - driver: {setup.call: {target: "Game.Instance", method: Trigger, args: [-107300940]}}
  - driver: {setup.call: {target: "PlanScreen.Instance._researchedDefs", method: Clear}}
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"AutoGroomingStation\")", method: Build, args: [{"$": "Grid.XYToCell(113, 206)"}, Neutral, null, [Copper], 293.15, DEFAULT_FACADE]}}
steps:
  - expect_state:
      "Db.Get().Techs.Get(\"AnimalControl\").unlockedItemIDs": [{contains: AutoGroomingStation}, {contains: AutoShearingStation}]
      "Db.Get().Techs.Get(\"DairyOperation\").unlockedItemIDs": {contains: AutoMilkingStation}
      "Assets.GetBuildingDef(\"AutoGroomingStation\").EnergyConsumptionWhenActive": 120
  - run: {seconds: 3}
  - expect: {buildings: {AutoGroomingStation: 1}}
  - expect_state:
      "all:AutoGroomingStationMod.AutoGroomingStation::[0].GetComponent<RoomTracker>.requiredRoomType": CreaturePen
  - driver: {camera.set: {cell: [113, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Stations"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/AutoGroomingStation Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/AutoGroomingStation Group*"}
  - ui_wait: {path: "**/ProductInfoScreen", cond: stable}
  - shot: {name: product, crop: "**/ProductInfoScreen", threshold: 0.04, pointer: stay}

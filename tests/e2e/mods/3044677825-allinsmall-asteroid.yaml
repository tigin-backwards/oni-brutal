# AllInSmall-Asteroid (3044677825), class W.
#
# What it does: adds four Spaced Out clusters of small asteroids ("Moonlet Cluster -
# AllInSmall" and its Strange, very Strange and Tiny variants): a 128x153 start moonlet
# (MiniStart) with the mod's own tiny base, rooms and POI templates, among the Spaced Out
# moonlets, and strange or tiny versions of each moonlet.
# How a player reaches it: New Game, the cluster carousel (or its coordinate).
# What changes: a cluster of small worlds.
#
# From the base, the main menu's New Game: the cluster's coordinate (M-S) with a fixed seed
# picks it (its asteroids dumped); embarked, its twelve worlds generate with the 128x153
# start moonlet.
from: early-base
mods: [3044677825]
memory_gb: 8
steps:
  - key: {code: Escape}
  - ui_wait: {path: "**/PauseScreen/**/Main MenuButton", cond: stable}
  - click: {ui: "**/PauseScreen/**/Main MenuButton"}
  - ui_wait: {path: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton", cond: stable}
  - click: {ui: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton"}   # Quit Without Saving
  - ui_wait: {path: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons", cond: stable, frames: 3000}
  - click: {text: "NEW GAME", under: "**/MainMenuButtons"}
  - ui_wait: {path: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame", cond: stable}
  - click: {ui: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame"}
  - ui_wait: {path: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/EventGame", cond: stable}
  - click: {ui: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/EventGame"}
  - ui_wait: {path: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton", cond: stable, frames: 3000}
  - click: {ui: "**/CoordinateContainer/SeedInput"}
  - ui_wait: {path: "**/CoordinateContainer/SeedInput", cond: stable}
  - type: {ui: "**/CoordinateContainer/SeedInput", text: "M-S-12345-0-0-0", clear: true, enter: true}
  - ui_wait: {path: "**/Section - Destination/DestinationDetailsHeader/ClusterName", cond: text, value: "~AllInSmall"}
  - expect_state:
      "CustomGameSettings.Instance.GetCurrentQualitySetting(\"ClusterLayout\").id": "== original"
  - ui_dump: {name: asteroids, root: "**/Section - Destination/World Scoll (Rect Size Set By Screen Code!)/Content/Details"}
  - click: {ui: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton"}
  - ui_wait: {path: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton", cond: stable, frames: 60000}
  - click: {ui: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton"}
  - ui_wait: {path: "**/MinionSelectScreen", cond: gone, frames: 6000}
  - expect_state:
      "ClusterManager.Instance.WorldContainers.Count": 12
      "ClusterManager.Instance.GetStartWorld().worldName": [{contains: MiniStart}, "== original"]
      "ClusterManager.Instance.GetStartWorld().worldSize.x": 128
      "ClusterManager.Instance.GetStartWorld().worldSize.y": 153
      "Components.LiveMinionIdentities.Count": 3

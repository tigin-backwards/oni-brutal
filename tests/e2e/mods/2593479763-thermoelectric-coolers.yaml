# Thermoelectric Coolers (2593479763), classes B, O.
#
# What it does: adds two tiles, researched with Low-Resistance Conductors: the TEC Tile
# (Utilities menu), a 1x1 floor tile of ceramic and refined metal that, powered (240 W),
# pumps heat from the cell below it to the cell above (less as the difference nears 70 °C),
# and the TEG Tile (Power menu), which makes power from a temperature difference across it.
# PLib options set wattages, efficiencies, the kDTU per watt, temperature limits, the run
# speed on the tiles and whether lead is required.
# How a player reaches it: the build menu (Utilities, Power); the Mods screen's options.
# What changes: tiles that move heat with power, and make power from heat.
#
# Options here: the TEC draws 300 W. setup grants Low-Resistance Conductors and spawns ceramic
# and copper; a TEC Tile is picked in the Utilities menu, placed in the dug-out corridor west
# of the printing pod, built and selected.
from: early-base
mods: [2593479763]
options:
  TECBlock: {CoolerWattage: 300.0}
setup:
  - driver: {setup.call: {target: "Research.Instance", method: SetActiveResearch, args: [{"$": "Db.Get().Techs.Get(\"PrettyGoodConductors\")"}, true]}}
  - driver: {setup.call: {target: "Research.Instance", method: CompleteQueue}}
  - driver: {setup.call: {target: "Game.Instance", method: Trigger, args: [-107300940]}}
  - driver: {setup.call: {target: "PlanScreen.Instance._researchedDefs", method: Clear}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"Ceramic\").substance", method: SpawnResource, args: [[110.5, 206.5, -12], 300, 293.15, 255, 0]}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"Copper\").substance", method: SpawnResource, args: [[110.5, 206.5, -12], 200, 293.15, 255, 0]}}
steps:
  - expect_state:
      "Db.Get().Techs.Get(\"PrettyGoodConductors\").unlockedItemIDs": {contains: TECTile}
      "Db.Get().Techs.Get(\"PrettyGoodConductors\").unlockedItemIDs": {contains: RomenH_TEGTile}
      "Assets.GetBuildingDef(\"TECTile\").EnergyConsumptionWhenActive": 300
  - run: {seconds: 5}
  - driver: {camera.set: {cell: [113, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Utilities"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/TECTile Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/TECTile Group*"}
  - ui_wait: {path: "**/ProductInfoScreen", cond: stable}
  - shot: {name: product, crop: "**/ProductInfoScreen", threshold: 0.04}
  - click_world: {cell: [113, 209]}
  - key: {code: Escape}
  - expect: {blueprints: {TECTile: 1}}
  - run: {seconds: 900, until: {buildings: {TECTile: 1}, pending_construction: 0}}
  - driver: {camera.set: {cell: [113, 209], ortho: 8}}
  - click_world: {cell: [113, 209], select: TECTile}
  - ui_wait: {path: "**/DetailsScreen/TitleBar", cond: stable}
  - expect_ui:
      "**/DetailsScreen/TitleBar/Border/LabelGroup/Label": {text: "~TEC Tile"}
  - expect_state:
      "selected:GetComponent<RomenH.TECBlock.TECTile>.kDTUsPerWatt": 0.1
      "selected:Building.Def.EnergyConsumptionWhenActive": 300

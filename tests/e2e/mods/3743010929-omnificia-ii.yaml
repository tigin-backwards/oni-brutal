# Omnificia II (3743010929), class P (a worldgen mod; needs Spaced Out, Frosty, Prehistoric and
# the aquatic DLC).
#
# What it does: six Classic-style clusters (Sandstone, Forest, Swamp, Ice Caves, Garden, Beach
# starts), each a single 352 x 448 asteroid with every biome, the DLCs' ones included (carrot
# quarry, sugar woods, raptor, wetlands, reef, kelp forest, abyss), their research unlocks and
# geysers. Its code adds a meteor shower season with every cluster shower
# (OmnificiaMeteorShowers), lets a season start more than five events on its single planetoid,
# counts it as five colonies for the Temporal Tear and The Great Escape, keeps its world traits
# apart from other worlds', adds its strings and the Frozen Core trait's sprite.
# How a player reaches it: the main menu, New Game, Survival, Classic; the carousel lists the
# six Omnificia II clusters (coordinate prefixes XL-OM2-...-C).
# What changes: the cluster a new game generates.
#
# From a colony: Main Menu, Quit Without Saving, New Game, Survival, Classic; the Sandstone
# cluster chosen by typing its coordinate (fixed seed), launched and embarked. Functional
# expectations (mod-play-testing.md, "Worldgen mods"): one asteroid of the mod's size, its
# biomes, the mod's season, geysers among the spawners, starmap POIs.
from: early-base
mods: [3743010929]
memory_gb: 10
steps:
  - key: {code: Escape}
  - ui_wait: {path: "**/PauseScreen/**/Main MenuButton", cond: stable}
  - click: {ui: "**/PauseScreen/**/Main MenuButton"}
  - ui_wait: {path: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton", cond: stable}
  - click: {ui: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton"}   # Quit Without Saving
  - ui_wait: {path: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons", cond: stable, frames: 3000}
  - click: {text: "NEW GAME", under: "**/MainMenuButtons"}
  - ui_wait: {path: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame", cond: stable}
  - click: {ui: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame"}
  - ui_wait: {path: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/ClassicStyleGame", cond: stable}
  - click: {ui: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/ClassicStyleGame"}
  - ui_wait: {path: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton", cond: stable, frames: 3000}
  - expect_state:
      "count:all:DestinationSelectPanel::[0].clusterKeys[*] if .StartsWith(\"clusters/Omnificia2\") == true": 6
  - click: {ui: "**/CoordinateContainer/SeedInput"}
  - ui_wait: {path: "**/CoordinateContainer/SeedInput", cond: stable}
  - type: {ui: "**/CoordinateContainer/SeedInput", text: "XL-OM2-SND-C-12345-0-0-0", clear: true, enter: true}
  - ui_wait: {path: "**/Section - Destination/DestinationDetailsHeader/ClusterName", cond: text, value: "~Omnificia II Cluster - Sandstone"}
  - expect_ui:
      "**/CoordinateContainer/SeedInput/Text Area/Text": {text: "~XL-OM2-SND-C-12345-0-0-0"}
      "**/StartingAsteroidCategory/Content/Prefab_AsteroidLine/Label": {text: "Omnificia II Asteroid"}
  - expect_state:
      "CustomGameSettings.Instance.GetCurrentQualitySetting(\"ClusterLayout\").id": clusters/Omnificia2SandstoneCluster
  - ui_dump: {name: asteroids, root: "**/Section - Destination/World Scoll (Rect Size Set By Screen Code!)/Content/Details"}
  - click: {ui: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton"}
  # Worldgen runs on its own thread; the Duplicant selection follows once the world is loaded.
  - ui_wait: {path: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton", cond: stable, frames: 60000}
  - click: {ui: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton"}
  - ui_wait: {path: "**/MinionSelectScreen", cond: gone, frames: 6000}
  - expect_state:
      "ClusterManager.Instance.WorldContainers.Count": 1
      "ClusterManager.Instance.GetStartWorld().worldName": worlds/Omnificia2Sandstone
      "ClusterManager.Instance.GetStartWorld().worldSize.x": 352
      "ClusterManager.Instance.GetStartWorld().worldSize.y": 448
      "Components.LiveMinionIdentities.Count": 3
      "ClusterManager.Instance.GetStartWorld().Biomes.Count": ">= 20"
      "ClusterManager.Instance.GetStartWorld().m_seasonIds": {contains: OmnificiaMeteorShowers}
      "ClusterManager.Instance.GetStartWorld().WorldTraitIds.Count": ">= 1"
      "Db.Get().GameplaySeasons.TryGet(\"OmnificiaMeteorShowers\").events.Count": 10
      "count:SaveGame.Instance.worldGenSpawner.spawnables[*] if .spawnInfo.id.StartsWith(\"GeyserGeneric\") == true": ">= 10"
      "all:TemporalTear::Length": 1
      "all:HarvestablePOIClusterGridEntity::Length": ">= 10"
      "Assets.GetSprite(\"OmnificiaFrozenCore\").name": OmnificiaFrozenCore
  - expect_state:
      "ClusterManager.Instance.GetStartWorld().Biomes": {contains: sugarwoods}
  - expect_state:
      "ClusterManager.Instance.GetStartWorld().Biomes": {contains: wetlands}

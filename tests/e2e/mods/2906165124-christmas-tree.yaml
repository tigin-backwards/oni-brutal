# 圣诞树 Christmas Tree (2906165124), class B.
#
# What it does: adds the Christmas Tree (CHRISTMASTREE, 2x3, 20 W) to the Furniture menu, no
# research needed: a lamp of 25 lux in a range of 12, with its own animation.
# How a player reaches it: the Furniture menu.
# What changes: a decorative lamp.
#
# The Furniture menu offers the tree (its card); one built in the corridor west of the
# printing pod by setup is selected and carries its light.
from: early-base
mods: [2906165124]
setup:
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"CHRISTMASTREE\")", method: Build, args: [131765, Neutral, null, [Copper], 293.15, DEFAULT_FACADE]}}
steps:
  - expect_state:
      "Assets.GetPrefab(\"CHRISTMASTREE\").GetComponent<Light2D>.Lux": 25
      "Assets.GetBuildingDef(\"CHRISTMASTREE\").EnergyConsumptionWhenActive": [">= 20.21", "<= 20.23"]
  - run: {seconds: 3}
  - driver: {camera.set: {cell: [113, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Furniture"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/CHRISTMASTREE Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/CHRISTMASTREE Group*"}
  - ui_wait: {path: "**/ProductInfoScreen", cond: stable}
  - shot: {name: product, crop: "**/ProductInfoScreen", threshold: 0.04}
  - key: {code: Escape}
  - click_world: {cell: [113, 208], select: CHRISTMASTREE}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - expect_ui:
      "**/DetailsScreen/TitleBar/Border/LabelGroup/Label": {text: "~Christmas Tree"}
  - expect_state:
      "selected:GetComponent<Light2D>.Range": 12

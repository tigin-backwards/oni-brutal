# One cell battery (2870926065), classes B, O.
#
# What it does: adds a 1x1 battery to the Power menu ("一格电池", Onecellbattery), of raw
# metal, with no research needed. It stores a1 joules (PLib option "Power", default 3333,
# Controler.json) and leaks 0.1 J/s.
# How a player reaches it: the build menu (Power).
# What changes: a battery one cell in size, of the configured capacity.
#
# The option is set to 5000. The battery is picked in the Power menu, placed of copper ore in
# the dug-out corridor west of the printing pod and built; selected, it holds 5000 J at most.
from: early-base
mods: [2870926065]
options:
  "2870926065": {$file: Controler.json, a1: 5000}
steps:
  - expect_state:
      "Assets.GetBuildingDef(\"Onecellbattery\").WidthInCells": 1
      "Assets.GetBuildingDef(\"Onecellbattery\").HeightInCells": 1
      "Assets.GetBuildingDef(\"Onecellbattery\").BuildingComplete.GetComponent<Battery>.capacity": 5000
  - run: {seconds: 5}
  - driver: {camera.set: {cell: [114, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Power"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/Onecellbattery Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/Onecellbattery Group*"}
  - ui_wait: {path: "**/PlanBuildingSelectionPanel/ProductInfoScreen", cond: stable}
  - shot: {name: product, crop: "**/PlanBuildingSelectionPanel/ProductInfoScreen", threshold: 0.04}
  - click: {ui: "**/MaterialSelectorTemplate/**/Toggles/MaterialSelection_*"}
  - click_world: {cell: [113, 206]}
  - key: {code: Escape}
  - expect: {blueprints: {Onecellbattery: 1}}
  - run: {seconds: 900, until: {buildings: {Onecellbattery: 1}, pending_construction: 0}}
  - click_world: {cell: [113, 206], select: Onecellbattery}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - expect_ui:
      "**/DetailsScreen/TitleBar/Border/LabelGroup/Label": {text: "~一格电池"}
  - expect_state:
      "selected:Battery.capacity": 5000
      "selected:Battery.joulesLostPerSecond": 0.1

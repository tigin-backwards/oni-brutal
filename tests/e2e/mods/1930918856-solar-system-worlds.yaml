# Solar System Worlds (1930918856), class P (a worldgen mod).
#
# What it does: in Spaced Out, the Classic-style Solar System cluster: the start planet Earth
# (224 x 320, its own subworlds: surface, sky, ocean, mantle, asthenosphere, core) with the Moon,
# Ganymede and Titan as planets of their own beside five Klei moonlets. Its code registers the
# worlds' strings and an Iron Core trait sprite, adds an ExtremelyCold2 temperature range (a
# prefix on Enum.ToString and Enum.Parse for Temperature.Range), names an asteroid whose icon
# is a planet_*_kanim after it ("earth", "moon", ...), logs worldgen errors, and on its base-game
# clusters swaps the background Earth's animation.
# How a player reaches it: the main menu, New Game, Survival, Classic; the carousel lists the
# Solar System (coordinate prefix ERT-PHO).
# What changes: the cluster a new game generates.
#
# From a colony: Main Menu, Quit Without Saving, New Game, Survival, Classic; the cluster chosen
# by typing its coordinate (fixed seed), launched and embarked. Functional expectations
# (mod-play-testing.md, "Worldgen mods"): its nine worlds, the four planets among them and named
# by the mod, Earth's size and subworlds, geysers among the spawners, starmap POIs.
from: early-base
mods: [1930918856]
memory_gb: 8
steps:
  - key: {code: Escape}
  - ui_wait: {path: "**/PauseScreen/**/Main MenuButton", cond: stable}
  - click: {ui: "**/PauseScreen/**/Main MenuButton"}
  - ui_wait: {path: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton", cond: stable}
  - click: {ui: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton"}   # Quit Without Saving
  - ui_wait: {path: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons", cond: stable, frames: 3000}
  - click: {text: "NEW GAME", under: "**/MainMenuButtons"}
  - ui_wait: {path: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame", cond: stable}
  - click: {ui: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame"}
  - ui_wait: {path: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/ClassicStyleGame", cond: stable}
  - click: {ui: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/ClassicStyleGame"}
  - ui_wait: {path: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton", cond: stable, frames: 3000}
  - expect_state:
      "all:DestinationSelectPanel::[0].clusterKeys": {contains: "expansion1::clusters/EarthDLC"}
  - click: {ui: "**/CoordinateContainer/SeedInput"}
  - ui_wait: {path: "**/CoordinateContainer/SeedInput", cond: stable}
  - type: {ui: "**/CoordinateContainer/SeedInput", text: "ERT-PHO-12345-0-0-0", clear: true, enter: true}
  - ui_wait: {path: "**/Section - Destination/DestinationDetailsHeader/ClusterName", cond: text, value: "~Solar System"}
  - expect_ui:
      "**/CoordinateContainer/SeedInput/Text Area/Text": {text: "~ERT-PHO-12345-0-0-0"}
      "**/StartingAsteroidCategory/Content/Prefab_AsteroidLine/Label": {text: "Earth"}
  - expect_state:
      "CustomGameSettings.Instance.GetCurrentQualitySetting(\"ClusterLayout\").id": "expansion1::clusters/EarthDLC"
  - ui_dump: {name: asteroids, root: "**/Section - Destination/World Scoll (Rect Size Set By Screen Code!)/Content/Details"}
  - click: {ui: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton"}
  # Worldgen runs on its own thread; the Duplicant selection follows once the world is loaded.
  - ui_wait: {path: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton", cond: stable, frames: 60000}
  - click: {ui: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton"}
  - ui_wait: {path: "**/MinionSelectScreen", cond: gone, frames: 6000}
  - expect_state:
      "ClusterManager.Instance.WorldContainers.Count": 9
      "ClusterManager.Instance.GetStartWorld().worldName": "expansion1::worlds/EarthDLC"
      "ClusterManager.Instance.GetStartWorld().worldSize.x": 224
      "ClusterManager.Instance.GetStartWorld().worldSize.y": 320
      "Components.LiveMinionIdentities.Count": 3
      "ClusterManager.Instance.GetStartWorld().Biomes": {contains: earth}
      "ClusterManager.Instance.GetStartWorld().m_generatedSubworlds": {contains: PholithWorlds/subworlds/earth/SurfaceStart}
      # The planets, named by the mod after their icons.
      "count:all:AsteroidGridEntity::[*] if .m_name == earth": 1
      "count:all:AsteroidGridEntity::[*] if .m_name == moon": 1
      "count:all:AsteroidGridEntity::[*] if .m_name == ganymede": 1
      "count:all:AsteroidGridEntity::[*] if .m_name == titan": 1
      "count:ClusterManager.Instance.WorldContainers[*] if .worldName == expansion1::worlds/TitanDLC": 1
      "Assets.Sprites[\"IronCore\"]": exists
      "count:SaveGame.Instance.worldGenSpawner.spawnables[*] if .spawnInfo.id.StartsWith(\"GeyserGeneric\") == true": ">= 3"
      "all:TemporalTear::Length": 1
      "all:HarvestablePOIClusterGridEntity::Length": ">= 15"

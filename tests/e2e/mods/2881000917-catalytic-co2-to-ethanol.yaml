# 催化CO2制乙醇 Catalytic CO2 to ethanol (2881000917), class B.
#
# What it does: adds a 2x2 building to the Oxygen menu ("催化CO2", CHCO2ZYC, no research
# needed), of raw metal, drawing 111 W: it takes in carbon dioxide from 3 cells around it and
# piped water, 0.5 kg/s of each, and makes 0.5 kg/s of ethanol (dropped) and 0.5 kg/s of
# oxygen (piped out). It can be flipped.
# How a player reaches it: the build menu (Oxygen).
# What changes: carbon dioxide and water become oxygen and ethanol.
#
# The building is picked in the Oxygen menu, placed of copper ore in the dug-out corridor west
# of the printing pod and built; selected, it is the mod's building with its converter.
from: early-base
mods: [2881000917]
steps:
  - expect_state:
      "Assets.GetBuildingDef(\"CHCO2ZYC\").EnergyConsumptionWhenActive": 111
      "Assets.GetBuildingDef(\"CHCO2ZYC\").BuildingComplete.GetComponent<ElementConverter>.outputElements[0].elementHash": Ethanol
  - run: {seconds: 5}
  - driver: {camera.set: {cell: [114, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Oxygen"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/CHCO2ZYC Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/CHCO2ZYC Group*"}
  - ui_wait: {path: "**/PlanBuildingSelectionPanel/ProductInfoScreen", cond: stable}
  - shot: {name: product, crop: "**/PlanBuildingSelectionPanel/ProductInfoScreen", threshold: 0.04}
  - click: {ui: "**/MaterialSelectorTemplate/**/Toggles/MaterialSelection_*"}
  - click_world: {cell: [112, 206]}
  - key: {code: Escape}
  - expect: {blueprints: {CHCO2ZYC: 1}}
  - run: {seconds: 900, until: {buildings: {CHCO2ZYC: 1}, pending_construction: 0}}
  - click_world: {cell: [112, 206], select: CHCO2ZYC}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - expect_ui:
      "**/DetailsScreen/TitleBar/Border/LabelGroup/Label": {text: "~催化CO2"}
  - expect_state:
      "selected:ElementConverter.consumedElements.Length": 2
      "selected:PassiveElementConsumer.elementToConsume": CarbonDioxide

# Travel tube crossing wall and ladder (1830443217).
#
# What it does: lets travel tube wall and
# ladder crossings be built.
# How a player reaches it: the build menu (Base).
#
# Broken upstream: Its Workshop build has no mod_info.yaml, which the game requires since 2021: KMod logs
# "Is missing a mod_info.yaml file and will not be loaded" and leaves it out.
# The spec checks that it is enabled, then runs the colony.
from: early-base
mods: [1830443217]
steps:
  - expect_state:
      "count:Global.Instance.modManager.mods[*] if .label.id == 1830443217 and .IsEnabledForActiveDlc() == true": 1
  - run: {seconds: 30}
  - expect: {duplicants: 3}

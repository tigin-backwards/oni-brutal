# 机械哈奇 meitanji (Coal synthesis machine, 3091670103), class B.
#
# What it does: adds the Meitanji ("mechanical Hatch", 2x3, no power, no Duplicant), a
# Utilities building unlocked by Smelting. It turns 100 kg of any crushable element into
# 50 kg of coal, and 100 kg of three other elements into 50 or 100 kg of coal, 5 s a batch.
# How a player reaches it: research Smelting; the Utilities menu.
# What changes: rock becomes coal.
#
# Smelting is researched in setup and a machine built in the corridor west of the printing
# pod. The Utilities menu offers it (its card); selected, the built one lists its recipes.
from: early-base
mods: [3091670103]
setup:
  - driver: {setup.call: {target: "Research.Instance", method: SetActiveResearch, args: [{"$": "Db.Get().Techs.Get(\"Smelting\")"}, true]}}
  - driver: {setup.call: {target: "Research.Instance", method: CompleteQueue}}
  - driver: {setup.call: {target: "Game.Instance", method: Trigger, args: [-107300940]}}
  - driver: {setup.call: {target: "PlanScreen.Instance._researchedDefs", method: Clear}}
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"Meitanji\")", method: Build, args: [131765, Neutral, null, [Copper], 293.15, DEFAULT_FACADE]}}
steps:
  - expect_state:
      "Db.Get().Techs.Get(\"Smelting\").unlockedItemIDs": {contains: Meitanji}
      "ComplexRecipeManager.Get().GetRecipe(\"Meitanji_I_SandStone_O_Carbon\").results[0].amount": 50
      "count:ComplexRecipeManager.Get().recipes[*] if .id.StartsWith(\"Meitanji_I_\") == true": ">= 4"
  - run: {seconds: 3}
  - driver: {camera.set: {cell: [113, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Utilities"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/Meitanji Group*", cond: stable}
  - scroll: {at: "**/PlanBuildingSelectionPanel/BuildingGroups", notches: -10}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/Meitanji Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/Meitanji Group*"}
  - ui_wait: {path: "**/ProductInfoScreen", cond: stable}
  - shot: {name: product, crop: "**/ProductInfoScreen", threshold: 0.04}
  - key: {code: Escape}
  - click_world: {cell: [113, 208], select: Meitanji}
  - ui_wait: {path: "**/ComplexFabricatorSideScreen/Contents/ButtonScrollView", cond: stable}
  - ui_dump: {name: recipes, root: "**/ComplexFabricatorSideScreen/Contents/ButtonScrollView"}

# Mars (3038061222), class P (a worldgen mod; its code only adds strings).
#
# What it does: two Spaced Out clusters in the event category, Mars and Mars Classic
# (difficulty 5), each with eleven worlds: a 190x290 hot start world of its own subworlds
# (CustomStart, BarrenCustom, an iron core, liquid iron at depth), a flipped warp world and
# the game's moonlets. Strings for the worlds and the Iron Depth trait come from a postfix on
# Db.Initialize.
# How a player reaches it: the main menu, New Game, Survival, the event clusters; the
# destination screen's carousel lists both (coordinate prefixes Mars and Marsclassic).
# What changes: the cluster a new game generates.
#
# From a colony: the pause menu's Main Menu, Quit Without Saving, New Game, Survival, the
# event clusters. The Mars cluster is chosen by typing its coordinate (seed 1; with 12345 its
# oil pockets fail to place and worldgen stops in the original), launched, and the new colony
# embarked. Worldgen expectations are functional (mod-play-testing.md, "Worldgen mods"): the
# mod's start world with its size and subworlds, the cluster's worlds.
from: early-base
mods: [3038061222]
memory_gb: 11
steps:
  - key: {code: Escape}
  - ui_wait: {path: "**/PauseScreen/**/Main MenuButton", cond: stable}
  - click: {ui: "**/PauseScreen/**/Main MenuButton"}
  - ui_wait: {path: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton", cond: stable}
  - click: {ui: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton"}   # Quit Without Saving
  - ui_wait: {path: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons", cond: stable, frames: 3000}
  - click: {text: "NEW GAME", under: "**/MainMenuButtons"}
  - ui_wait: {path: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame", cond: stable}
  - click: {ui: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame"}
  - ui_wait: {path: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/EventGame", cond: stable}
  - click: {ui: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/EventGame"}
  - ui_wait: {path: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton", cond: stable, frames: 3000}
  - expect_state:
      "count:all:DestinationSelectPanel::[0].clusterKeys[*] if .EndsWith(\"clusters/Mars\") == true": 1
      "count:all:DestinationSelectPanel::[0].clusterKeys[*] if .EndsWith(\"clusters/MarsClassic\") == true": 1
  - click: {ui: "**/CoordinateContainer/SeedInput"}
  - ui_wait: {path: "**/CoordinateContainer/SeedInput", cond: stable}
  - type: {ui: "**/CoordinateContainer/SeedInput", text: "Mars-1-0-0-0", clear: true, enter: true}
  - ui_wait: {path: "**/Section - Destination/DestinationDetailsHeader/ClusterName", cond: text, value: "~Mars"}
  - ui_dump: {name: asteroids, root: "**/Section - Destination/World Scoll (Rect Size Set By Screen Code!)/Content/Details"}
  - click: {ui: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton"}
  - ui_wait: {path: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton", cond: stable, frames: 60000}
  - click: {ui: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton"}
  - ui_wait: {path: "**/MinionSelectScreen", cond: gone, frames: 6000}
  - expect_state:
      "ClusterManager.Instance.GetStartWorld().worldName.EndsWith(\"worlds/Mars\")": true
      "ClusterManager.Instance.GetStartWorld().worldSize.x": 190
      "ClusterManager.Instance.GetStartWorld().worldSize.y": 290
      "ClusterManager.Instance.WorldContainers.Count": ">= 8"
      "Components.LiveMinionIdentities.Count": ">= 3"
  - expect_state:
      "ClusterManager.Instance.GetStartWorld().m_generatedSubworlds": [{contains: subworlds/CustomStart}, {contains: subworlds/BarrenCustom}]

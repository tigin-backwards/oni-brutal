# Speed Control - Outdated (1713359495).
#
# What it does: adds faster game speeds beyond the third.
# How a player reaches it: the speed buttons and keys.
#
# Broken upstream: Its Workshop build has no mod_info.yaml, which the game requires since 2021: KMod logs
# "Is missing a mod_info.yaml file and will not be loaded" and leaves it out.
# The spec checks that it is enabled, then runs the colony.
from: early-base
mods: [1713359495]
steps:
  - expect_state:
      "count:Global.Instance.modManager.mods[*] if .label.id == 1713359495 and .IsEnabledForActiveDlc() == true": 1
  - run: {seconds: 30}
  - expect: {duplicants: 3}

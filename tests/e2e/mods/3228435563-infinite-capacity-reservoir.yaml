# 真·无限气液库V2.0 (Infinite Capacity Reservoir) (3228435563), class B.
#
# What it does: adds four buildings to the Base menu: an infinite liquid reservoir (Improved
# Liquid Piping) and an infinite gas reservoir (HVAC), 2x3 of 1500 kg of metal, each with a
# "twin" port building placed over it for a second input and output. A reservoir keeps 40 kg
# in its storage and moves anything above 30 kg into an unbounded store of one element (and
# back out below 10 kg), shown in a status line and an element icon over it; its logic port
# sends green while the total is above a threshold set on a logarithmic slider in its side
# screen (10,000 t by default). Its strings are Chinese.
# How a player reaches it: the build menu (Base); the reservoir's side screen.
# What changes: storage without a limit.
#
# A smaller spec: no pipe fills it. setup grants Improved Liquid Piping and spawns copper ore.
# The liquid reservoir is built in the dug-out corridor west of the printing pod and
# selected; its side screen's slider shows the threshold, and 3 typed into its field sets the
# threshold to 999 kg (10^3 - 1).
from: early-base
mods: [3228435563]
setup:
  - driver: {setup.call: {target: "Research.Instance.GetTechInstance(\"ImprovedLiquidPiping\")", method: Purchased}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"Cuprite\").substance", method: SpawnResource, args: [[116.5, 207.5, -12], 1600, 300, 255, 0]}}
steps:
  - expect_state:
      "Db.Get().Techs.Get(\"ImprovedLiquidPiping\").unlockedItemIDs": {contains: FullLiquidReservoir}
  - build: {prefab: FullLiquidReservoir, at: [113, 206]}
  - expect: {blueprints: {FullLiquidReservoir: 1}}
  - run: {seconds: 1500, until: {buildings: {FullLiquidReservoir: 1}, pending_construction: 0}}
  - driver: {camera.set: {cell: [113, 208], ortho: 8}}
  - click_world: {cell: [113, 207], select: FullLiquidReservoir}
  - ui_wait: {path: "**/DetailsScreen/SideScreen/**/SingleSliderSideScreen", cond: stable}
  - expect_state:
      "selected:GetComponent<FullCapacityReservoir.t>.i": ">= 9999998"   # the slider writes back 10^7 - 1
      "selected:GetComponent<Storage>.capacityKg": 40
  - expect_ui:
      "**/DetailsScreen/TitleBar/Border/LabelGroup/Label": {text: "~无限储液库"}
      "**/SingleSliderSideScreen/Contents/MaxLabel": {text: "~15"}
  - shot: {name: details, crop: "**/DetailsScreen", threshold: 0.04}
  - type: {ui: "**/SingleSliderSideScreen/Contents/NumberInputField", text: "3", enter: true, clear: true}
  - expect_state: {"selected:GetComponent<FullCapacityReservoir.t>.i": ">= 998.9"}
  - expect_state: {"selected:GetComponent<FullCapacityReservoir.t>.i": "<= 999.1"}

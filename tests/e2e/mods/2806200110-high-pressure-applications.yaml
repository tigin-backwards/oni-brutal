# High Pressure Applications (2806200110), classes B, O, V.
#
# What it does: adds high-pressure gas and liquid pipes and bridges (steel and plastic; HVAC
# and Liquid Tuning), pressure pumps and decompression valves. A high-pressure pipe holds 10
# times a gas pipe's 1 kg (HPGas) or 40 times a liquid pipe's 10 kg (HPLiquid), PLib options;
# transpilers on ConduitFlow let its cells hold more, and pipes and bridges get a Pressurized
# component that tints their flow in the overlay. Ordinary outputs into a high-pressure pipe
# push 3 times their usual mass.
# How a player reaches it: the build menu (HVAC, Plumbing), after research; drag-building pipes.
# What changes: pipes that carry far more per packet.
#
# setup grants HVAC and spawns steel and plastic. A run of four high-pressure gas pipes is
# dragged with the build tool in the dug-out corridor west of the printing pod, built and
# selected: it carries the mod's Pressurized info.
from: early-base
mods: [2806200110]
setup:
  - driver: {setup.call: {target: "Research.Instance.GetTechInstance(\"HVAC\")", method: Purchased}}
  # The build menu shows a category once one of its buildings is researched, as it learns.
  - driver: {setup.call: {target: "Game.Instance", method: Trigger, args: [-107300940]}}
  - driver: {setup.call: {target: "PlanScreen.Instance._researchedDefs", method: Clear}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"Steel\").substance", method: SpawnResource, args: [[111.5, 206.5, -12], 100, 300, 255, 0]}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"Polypropylene\").substance", method: SpawnResource, args: [[112.5, 206.5, -12], 100, 300, 255, 0]}}
steps:
  - expect_state:
      "Assets.GetBuildingDef(\"HighPressureGasConduit\").PrefabID": HighPressureGasConduit
  - run: {seconds: 5}
  - driver: {camera.set: {cell: [111, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Ventilation"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/HighPressureGasConduit Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/HighPressureGasConduit Group*"}
  - ui_wait: {path: "**/ProductInfoScreen", cond: stable}
  - shot: {name: product, crop: "**/ProductInfoScreen", threshold: 0.04}
  - drag: {from: [109, 207], to: [112, 207]}
  - key: {code: Escape}
  - expect: {blueprints: {HighPressureGasConduit: 4}}
  - run: {seconds: 1200, until: {buildings: {HighPressureGasConduit: 4}, pending_construction: 0}}
  - driver: {camera.set: {cell: [111, 208], ortho: 8}}
  - click_world: {cell: [110, 207], select: HighPressureGasConduit}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - expect_ui:
      "**/DetailsScreen/TitleBar/Border/LabelGroup/Label": {text: "~High Pressure Gas"}
  - expect_state:
      "selected:GetComponent<Pressurized>.Info.Capacity": 10
      "selected:GetComponent<Pressurized>.Info.IsDefault": false
  - shot: {name: details, crop: "**/DetailsScreen", threshold: 0.04}

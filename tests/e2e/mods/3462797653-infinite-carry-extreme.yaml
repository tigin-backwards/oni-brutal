# Infinite Carry EXTREME (3462797653), classes P, O.
#
# What it does: multiplies what Duplicants carry. Its PLib options (InfiniteCarryOptions.json)
# pick a level, 1 to 10, for 1x to 100x: a Db.Initialize postfix sets the Strength-to-carry
# converter to 40 kg per point times that, and a MinionConfig.OnPrefabInit postfix gives each
# standard Duplicant a "Infinite Carry Mod Base" modifier of 200 kg times (multiplier - 1). A
# second option adds 0 to 500 Construction (levels 1 to 5).
# How a player reaches it: the Mods screen's options; any hauling.
# What changes: Duplicants haul far more at once, and build faster.
#
# options pick 100x and the second build speed level (+20 Construction). After the load the
# converter is 4,000 kg a point, and the two standard Duplicants (the first is a bionic one,
# which the patch does not reach) carry at least 20,000 kg, with +20 Construction from the mod.
from: early-base
mods: [3462797653]
options:
  InfiniteCarry: {$file: InfiniteCarryOptions.json, MultiplierLevel: 10, BuildSpeedLevel: 2}
steps:
  - expect_state:
      "Db.Get().AttributeConverters.CarryAmountFromStrength.multiplier": 4000
      "Components.LiveMinionIdentities.Items[1].GetComponent<Modifiers>.attributes.Get(\"CarryAmount\").GetTotalValue()": ">= 20000"
      "Components.LiveMinionIdentities.Items[2].GetComponent<Modifiers>.attributes.Get(\"CarryAmount\").GetTotalValue()": ">= 20000"
      "Components.LiveMinionIdentities.Items[0].GetComponent<Modifiers>.attributes.Get(\"CarryAmount\").GetTotalValue()": "< 20000"
  - expect_state:
      "Components.LiveMinionIdentities.Items[1].GetComponent<Modifiers>.attributes.Get(\"CarryAmount\").GetTotalValue()": "== original"
      "Components.LiveMinionIdentities.Items[1].GetComponent<Modifiers>.attributes.Get(\"Construction\").GetTotalValue()": "== original"

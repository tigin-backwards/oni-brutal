# C 黄金淋浴间 Gold Shower 1.7 (2847163162), class B.
#
# What it does: adds a Gold Shower to the Plumbing menu (C013GG1, no research needed): 2x4, of
# 400 kg of refined metal, decor +20 in 8 cells, no power. It is a shower that also counts as an
# advanced wash station: 15 s a use, it removes 95 % of a Duplicant's germs, turns piped water
# into polluted water at 1 kg/s and pipes it out.
# How a player reaches it: the build menu (Plumbing).
# What changes: a decorative shower for a washroom.
#
# setup spawns 400 kg of copper. The shower is picked in the Plumbing menu, placed in the
# dug-out corridor west of the printing pod and built; selected, it is the mod's shower.
from: early-base
mods: [2847163162]
setup:
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"Copper\").substance", method: SpawnResource, args: [[115.5, 207.5, -12], 450, 300, 255, 0]}}
steps:
  - expect_state:
      "Assets.GetBuildingDef(\"C013GG1\").HeightInCells": 4
      "Assets.GetBuildingDef(\"C013GG1\").BuildingComplete.GetComponent<KPrefabID>.HasTag(\"AdvancedWashStation\")": true
      "Assets.GetBuildingDef(\"C013GG1\").BuildingComplete.GetComponent<Shower>.fractionalDiseaseRemoval": 0.95
  - run: {seconds: 5}
  - driver: {camera.set: {cell: [114, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Plumbing"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/C013GG1 Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/C013GG1 Group*"}
  - ui_wait: {path: "**/PlanBuildingSelectionPanel/ProductInfoScreen", cond: stable}
  - shot: {name: product, crop: "**/PlanBuildingSelectionPanel/ProductInfoScreen", threshold: 0.04}
  - click: {ui: "**/MaterialSelectorTemplate/**/Toggles/MaterialSelection_*"}
  - click_world: {cell: [112, 206]}
  - key: {code: Escape}
  - expect: {blueprints: {C013GG1: 1}}
  - run: {seconds: 900, until: {buildings: {C013GG1: 1}, pending_construction: 0}}
  - click_world: {cell: [112, 207], select: C013GG1}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - expect_ui:
      "**/DetailsScreen/TitleBar/Border/LabelGroup/Label": {text: "~Gold Shower"}
  - expect_state:
      "selected:Shower.workTime": 15
      "selected:PrimaryElement.ElementID": Copper

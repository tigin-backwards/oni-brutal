# 蒸汽涡轮机 (Steam Turbine tweaks, 3024606677), class P.
#
# What it does: patches on SteamTurbineConfig2 rework the Steam Turbine: built anywhere, of
# metal ore instead of refined metal (its plastic swap finds no plastic in the current def), no
# mechatronics perk to build, 200 decor in a radius of 20, no flooding, entombing or
# overheating, a 10 MW rating, no self-heat, and transpiled temperature constants (it runs on
# steam from 105 °C and its output is cooled to 10 °C).
# How a player reaches it: research Renewable Energy; the Power menu's Steam Turbine.
# What changes: a much stronger, easier steam turbine.
#
# Renewable Energy is researched in setup. The Power menu's Steam Turbine card shows the
# new materials.
from: early-base
mods: [3024606677]
setup:
  - driver: {setup.call: {target: "Research.Instance", method: SetActiveResearch, args: [{"$": "Db.Get().Techs.Get(\"RenewableEnergy\")"}, true]}}
  - driver: {setup.call: {target: "Research.Instance", method: CompleteQueue}}
  - driver: {setup.call: {target: "Game.Instance", method: Trigger, args: [-107300940]}}
  - driver: {setup.call: {target: "PlanScreen.Instance._researchedDefs", method: Clear}}
steps:
  - expect_state:
      "Assets.GetBuildingDef(\"SteamTurbine2\").BaseDecor": 200
      "Assets.GetBuildingDef(\"SteamTurbine2\").GeneratorWattageRating": 10000000
      "Assets.GetBuildingDef(\"SteamTurbine2\").BuildLocationRule": "== 'Anywhere'"
      "Assets.GetBuildingDef(\"SteamTurbine2\").MaterialCategory": [{contains: Metal}, {contains: BuildingGasket}]
      "Assets.GetBuildingDef(\"SteamTurbine2\").Floodable": false
      "Assets.GetPrefab(\"SteamTurbine2\").GetComponent<SteamTurbine>.minActiveTemperature": "== original"
  - run: {seconds: 3}
  - driver: {camera.set: {cell: [113, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Power"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/SteamTurbine2 Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/SteamTurbine2 Group*"}
  - ui_wait: {path: "**/ProductInfoScreen/MaterialSelectionPanel", cond: stable}
  - shot: {name: product, crop: "**/ProductInfoScreen", threshold: 0.04}

# LightingAndArt (3252090977), class B.
#
# What it does: adds four 1x1 Furniture buildings of 3 kg of raw minerals, unpowered and
# always on: the Utility light (NewISLight, a ceiling light of 3000 lux, range 14), Beautiful
# Light (NewISArtLight, 3000 lux, range 8), Night Light (NewISArtNightLight, 1 lux, range 8)
# and Super Art (NewISArt), each with a large decor bonus.
# How a player reaches it: the Furniture menu.
# What changes: free light and decor.
#
# A Utility light is built by setup on the corridor ceiling west of the printing pod; the
# corridor below it is lit as in the original. The Furniture menu offers all four; the
# light's card is shot.
from: early-base
mods: [3252090977]
setup:
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"NewISLight\")", method: Build, args: [{"$": "Grid.XYToCell(112, 209)"}, Neutral, null, [SandStone], 293.15, DEFAULT_FACADE]}}
steps:
  - expect_state:
      "Assets.GetPrefab(\"NewISLight\").GetComponent<Light2D>.Lux": 3000
      "Assets.GetPrefab(\"NewISArtNightLight\").GetComponent<Light2D>.Lux": 1
      "Assets.GetBuildingDef(\"NewISArt\").BaseDecor": "== original"
      "Assets.GetBuildingDef(\"NewISLight\").BaseDecor": "== original"
  - run: {seconds: 3}
  - expect: {buildings: {NewISLight: 1}}
  - expect_state:
      "Grid.LightIntensity.get_Item(131128)": "> 1000"
  - expect_state:
      "Grid.LightIntensity.get_Item(131128)": "== original"
      "cells:108,206..116,208::Grid.LightIntensity.get_Item({cell})": "== original"
  - driver: {camera.set: {cell: [113, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Furniture"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/NewISLight Group*", cond: stable}
  - expect_ui:
      "**/BuildingGroups/**/Grid/NewISArt Group*": {active: true}
      "**/BuildingGroups/**/Grid/NewISArtLight Group*": {active: true}
      "**/BuildingGroups/**/Grid/NewISArtNightLight Group*": {active: true}
  - click: {ui: "**/BuildingGroups/**/Grid/NewISLight Group*"}
  - ui_wait: {path: "**/ProductInfoScreen", cond: stable}
  - shot: {name: product, crop: "**/ProductInfoScreen", threshold: 0.04}

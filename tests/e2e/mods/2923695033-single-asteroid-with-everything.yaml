# Single Asteroid With Everything (2923695033), class O (a worldgen mod, no code; Spaced Out).
#
# What it does: four Classic-style clusters (Sandstone, Sandstone Frozen, Forest, Swamp starts),
# each a single asteroid with every biome of the base game and Spaced Out on it (wasteland,
# radioactive, graphite caves, moo caverns, a niobium core of its own), the Spaced Out metal
# volcanoes as fixed geysers, and the whole starmap's POIs around it.
# How a player reaches it: the main menu, New Game, Survival, Classic; the carousel lists the
# four clusters (coordinate prefixes M-...-EL), named as the game's own starts.
# What changes: the cluster a new game generates.
#
# From a colony: Main Menu, Quit Without Saving, New Game, Survival, Classic; the Sandstone
# cluster chosen by typing its coordinate (fixed seed), launched and embarked. Functional
# expectations (mod-play-testing.md, "Worldgen mods"): one 320 x 384 asteroid, the Spaced Out
# subworlds and the mod's niobium core among its subworlds, the fixed volcanoes among the
# spawners, the starmap's POIs and the Temporal Tear.
from: early-base
mods: [2923695033]
memory_gb: 9
steps:
  - key: {code: Escape}
  - ui_wait: {path: "**/PauseScreen/**/Main MenuButton", cond: stable}
  - click: {ui: "**/PauseScreen/**/Main MenuButton"}
  - ui_wait: {path: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton", cond: stable}
  - click: {ui: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton"}   # Quit Without Saving
  - ui_wait: {path: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons", cond: stable, frames: 3000}
  - click: {text: "NEW GAME", under: "**/MainMenuButtons"}
  - ui_wait: {path: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame", cond: stable}
  - click: {ui: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame"}
  - ui_wait: {path: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/ClassicStyleGame", cond: stable}
  - click: {ui: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/ClassicStyleGame"}
  - ui_wait: {path: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton", cond: stable, frames: 3000}
  - expect_state:
      "count:all:DestinationSelectPanel::[0].clusterKeys[*] if .StartsWith(\"clusters/Everything\") == true": 4
  - click: {ui: "**/CoordinateContainer/SeedInput"}
  - ui_wait: {path: "**/CoordinateContainer/SeedInput", cond: stable}
  - type: {ui: "**/CoordinateContainer/SeedInput", text: "M-SNDST-EL-12345-0-0-0", clear: true, enter: true}
  - ui_wait: {path: "**/CoordinateContainer/SeedInput/Text Area/Text", cond: text, value: "~M-SNDST-EL-12345-0-0-0"}
  - expect_state:
      "CustomGameSettings.Instance.GetCurrentQualitySetting(\"ClusterLayout\").id": clusters/EverythingSandstoneCluster
  - ui_wait: {path: "**/Section - Destination/DestinationDetailsHeader/ClusterName", cond: stable}
  - ui_dump: {name: asteroids, root: "**/Section - Destination/World Scoll (Rect Size Set By Screen Code!)/Content/Details"}
  - click: {ui: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton"}
  # Worldgen runs on its own thread; the Duplicant selection follows once the world is loaded.
  - ui_wait: {path: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton", cond: stable, frames: 60000}
  - click: {ui: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton"}
  - ui_wait: {path: "**/MinionSelectScreen", cond: gone, frames: 6000}
  - expect_state:
      "ClusterManager.Instance.WorldContainers.Count": 1
      "ClusterManager.Instance.GetStartWorld().worldName": worlds/EverythingSandstoneDefault
      "ClusterManager.Instance.GetStartWorld().worldSize.x": 320
      "ClusterManager.Instance.GetStartWorld().worldSize.y": 384
      "Components.LiveMinionIdentities.Count": 3
      "ClusterManager.Instance.GetStartWorld().m_generatedSubworlds": {contains: subworlds/niobium/NiobiumCoreE}
      "count:SaveGame.Instance.worldGenSpawner.spawnables[*] if .spawnInfo.id == GeyserGeneric_molten_tungsten": ">= 1"
      "count:SaveGame.Instance.worldGenSpawner.spawnables[*] if .spawnInfo.id == GeyserGeneric_molten_cobalt": ">= 1"
      "count:SaveGame.Instance.worldGenSpawner.spawnables[*] if .spawnInfo.id.StartsWith(\"GeyserGeneric\") == true": ">= 8"
      "all:TemporalTear::Length": 1
      "all:HarvestablePOIClusterGridEntity::Length": ">= 20"
      "all:ArtifactPOIClusterGridEntity::Length": ">= 5"
  - expect_state:
      "ClusterManager.Instance.GetStartWorld().m_generatedSubworlds": {contains: expansion1::subworlds/moo/MooCaverns}
  - expect_state:
      "ClusterManager.Instance.GetStartWorld().m_generatedSubworlds": {contains: expansion1::subworlds/aquatic/GraphiteCaves}
  - expect_state:
      "ClusterManager.Instance.GetStartWorld().m_generatedSubworlds": {contains: expansion1::subworlds/radioactive/Radioactive}
  - expect_state:
      "ClusterManager.Instance.GetStartWorld().Biomes": {contains: wasteland}

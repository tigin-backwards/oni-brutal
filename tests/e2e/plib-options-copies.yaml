# PLib options dialogs of two mods that each patch their own copy of PLib's dialog (issue #14).
#
# Advanced Mopping by Type (3793108683) and Ultimate Power Tweaks (3792767193) each merge PLib
# 4.25 into their assembly and give their copy's OptionsDialog.FillModOptions a postfix; a
# mod's options open through its own copy. Harmony's MonoMod built Ultimate Power Tweaks'
# replacement, the second, with Advanced Mopping's IEnumerable<IOptionsEntry>.GetEnumerator
# (ARCHITECTURE D33): Mono's dispatch falls back to the instantiation the list implements, and
# CoreCLR's threw EntryPointNotFoundException, so its options dialog did not open. Better
# Farming Effects and Tweaks (2778941969) and Mod Updater (2018291283) bring older copies.
#
# From a colony to the main menu's Mods screen: each mod's Options opens its dialog, with its
# title, and Cancel closes it.
from: early-base
mods: [3793108683, 3792767193, 2778941969, 2018291283]
steps:
  - key: {code: Escape}
  - ui_wait: {path: "**/PauseScreen/**/Main MenuButton", cond: stable}
  - click: {ui: "**/PauseScreen/**/Main MenuButton"}
  - ui_wait: {path: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton", cond: stable}
  - click: {ui: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton"}   # Quit Without Saving
  - ui_wait: {path: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons", cond: stable, frames: 3000}
  - click: {text: "MODS", under: "**/MainMenuButtons"}
  - ui_wait: {path: "**/ModsScreen/Panel", cond: stable}
  - click: {ui: "**/ModsScreen/**/Content/Ultimate Power Tweaks/ModSettingsButton"}
  - ui_wait: {path: "**/ModOptions", cond: stable}
  - expect_ui:
      "**/ModOptions/Title/Text": {text: "~Ultimate Power Tweaks"}
  - ui_dump: {name: upt-title, root: "**/ModOptions/Title"}
  - click: {text: "CANCEL", under: "**/ModOptions"}
  - ui_wait: {path: "**/ModOptions", cond: gone}
  - click: {ui: "**/ModsScreen/**/Content/Advanced Mopping/ModSettingsButton"}
  - ui_wait: {path: "**/ModOptions", cond: stable}
  - expect_ui:
      "**/ModOptions/Title/Text": {text: "~Advanced Mopping"}
  - click: {text: "CANCEL", under: "**/ModOptions"}
  - ui_wait: {path: "**/ModOptions", cond: gone}
  - click: {ui: "**/ModsScreen/**/Content/Better Farming Effects and Tweaks/ModSettingsButton"}
  - ui_wait: {path: "**/ModOptions", cond: stable}
  - expect_ui:
      "**/ModOptions/Title/Text": {text: "~Better Farming Effects and Tweaks"}
      "**/ModOptions/Body/**/Entries/Label/Text": {any_text: "~Farmer's Touch"}
  - click: {text: "CANCEL", under: "**/ModOptions"}
  - ui_wait: {path: "**/ModOptions", cond: gone}
  - click: {ui: "**/ModsScreen/**/Content/Mod Updater/ModSettingsButton"}
  - ui_wait: {path: "**/ModOptions", cond: stable}
  - expect_ui:
      "**/ModOptions/Title/Text": {text: "~Mod Updater"}
  - click: {text: "CANCEL", under: "**/ModOptions"}
  - ui_wait: {path: "**/ModOptions", cond: gone}

  - expect_state:
      "count:all:KPrefabID::[*] if .PrefabTag.Name == Hatch": ">= 16"
      "count:all:KPrefabID::[*] if .PrefabTag.Name == Hatch and .HasTag(\"Overcrowded\") == true": 0
      "count:all:KPrefabID::[*] if .PrefabTag.Name == Hatch and .HasTag(\"Confined\") == true": 0

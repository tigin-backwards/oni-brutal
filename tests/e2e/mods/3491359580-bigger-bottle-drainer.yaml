# Bigger Bottle Emptier Conduit Liquid (3491359580), class P.
#
# What it does: a postfix on BottleEmptierConduitLiquidConfig.ConfigureBuildingTemplate sets
# the Bottle Drainer's storage to 1600 kg (the game's holds 200 kg), so Duplicants bring it
# eight times as much bottled liquid at once for its pipe.
# How a player reaches it: the build menu (Plumbing), after Liquid Distribution research.
# What changes: fewer, bigger deliveries to a Bottle Drainer.
#
# setup grants Liquid Distribution and spawns steel. A Bottle Drainer is built in the dug-out
# corridor west of the printing pod and selected: its storage holds 1600 kg, as its details
# say.
from: early-base
mods: [3491359580]
setup:
  - driver: {setup.call: {target: "Research.Instance.GetTechInstance(\"LiquidDistribution\")", method: Purchased}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"Steel\").substance", method: SpawnResource, args: [[109.5, 206.5, -12], 200, 300, 255, 0]}}
steps:
  - expect_state:
      "Assets.GetPrefab(\"BottleEmptierConduitLiquid\").GetComponent<Storage>.capacityKg": 1600
  - build: {prefab: BottleEmptierConduitLiquid, at: [113, 206], material: Steel}
  - expect: {blueprints: {BottleEmptierConduitLiquid: 1}}
  - run: {seconds: 900, until: {buildings: {BottleEmptierConduitLiquid: 1}, pending_construction: 0}}
  - driver: {camera.set: {cell: [113, 207], ortho: 8}}
  - click_world: {cell: [113, 206], select: BottleEmptierConduitLiquid}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - expect_ui:
      "**/DetailsScreen/TitleBar/Border/LabelGroup/Label": {text: "~Bottle Drainer"}
  - expect_state:
      "selected:GetComponent<Storage>.capacityKg": 1600
  - shot: {name: details, crop: "**/DetailsScreen", threshold: 0.04}

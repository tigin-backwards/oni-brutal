# Blueprints (1814341183).
#
# What it does: saves a selection of buildings as a blueprint and places it again,
# with its own tools.
# How a player reaches it: its tools in the tool menu and hotkeys.
#
# Broken upstream: Its Workshop build's mod_info.yaml (lastWorkingBuild 447598, 2021) names no APIVersion, so
# KMod logs "DLLs found but not using the correct API version" and disables it: built for
# Harmony 1, before the game moved to Harmony 2.
# The spec checks that it is enabled, then runs the colony.
from: early-base
mods: [1814341183]
steps:
  - expect_state:
      "count:Global.Instance.modManager.mods[*] if .label.id == 1814341183 and .IsEnabledForActiveDlc() == true": 1
  - run: {seconds: 30}
  - expect: {duplicants: 3}

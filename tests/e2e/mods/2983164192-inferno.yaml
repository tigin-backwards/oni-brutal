# Inferno dlc spaced out (2983164192), classes P, M (worldgen).
#
# What it does: adds a Spaced Out cluster, Inferno (coordinate prefix INFERNO, difficulty 5,
# the Spaced Out style), whose start world is the mod's hot Inferno asteroid (its own iron
# biome and flipped bottom subworlds), with a mini flipped Inferno as the warp destination
# among the game's minis and moonlets; the DLL only adds the cluster's name and description.
# How a player reaches it: New Game, Survival, Spaced Out style, the carousel or its coordinate.
# What changes: a new, hot starting cluster.
#
# A new game: the coordinate INFERNO-12345-0-0-0 selects the cluster (its asteroid list is
# dumped); it is launched, and the generated cluster is checked functionally: its worlds, the
# start world's name, size and subworlds, and the starmap's POIs.
from: early-base
mods: [2983164192]
memory_gb: 8
steps:
  - key: {code: Escape}
  - ui_wait: {path: "**/PauseScreen/**/Main MenuButton", cond: stable}
  - click: {ui: "**/PauseScreen/**/Main MenuButton"}
  - ui_wait: {path: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton", cond: stable}
  - click: {ui: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton"}   # Quit Without Saving
  - ui_wait: {path: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons", cond: stable, frames: 3000}
  - click: {text: "NEW GAME", under: "**/MainMenuButtons"}
  - ui_wait: {path: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame", cond: stable}
  - click: {ui: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame"}
  - ui_wait: {path: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/SpacedOutGame", cond: stable}
  - click: {ui: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/SpacedOutGame"}
  - ui_wait: {path: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton", cond: stable, frames: 3000}
  - expect_state:
      "count:all:DestinationSelectPanel::[0].clusterKeys[*] if .EndsWith(\"clusters/Inferno\") == true": 1
  - click: {ui: "**/CoordinateContainer/SeedInput"}
  - ui_wait: {path: "**/CoordinateContainer/SeedInput", cond: stable}
  - type: {ui: "**/CoordinateContainer/SeedInput", text: "INFERNO-12345-0-0-0", clear: true, enter: true}
  - ui_wait: {path: "**/Section - Destination/DestinationDetailsHeader/ClusterName", cond: text, value: "~Inferno"}
  - expect_state:
      "CustomGameSettings.Instance.GetCurrentQualitySetting(\"ClusterLayout\").id": [{contains: Inferno}, "== original"]
  - ui_dump: {name: asteroids, root: "**/Section - Destination/World Scoll (Rect Size Set By Screen Code!)/Content/Details"}
  - click: {ui: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton"}
  - ui_wait: {path: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton", cond: stable, frames: 60000}
  - click: {ui: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton"}
  - ui_wait: {path: "**/MinionSelectScreen", cond: gone, frames: 6000}
  - expect_state:
      "ClusterManager.Instance.WorldContainers.Count": ["== original", ">= 10"]
      "ClusterManager.Instance.GetStartWorld().worldName": expansion1::worlds/Inferno
      "ClusterManager.Instance.GetStartWorld().worldSize.x": "== original"
      "ClusterManager.Instance.GetStartWorld().worldSize.y": "== original"
      "count:ClusterManager.Instance.WorldContainers[*] if .worldName == expansion1::worlds/MiniFlippedInfernoWarp": 1
      "ClusterManager.Instance.GetStartWorld().m_generatedSubworlds": [{contains: subworlds/BottomIron}]
      "Components.LiveMinionIdentities.Count": 3
      "all:TemporalTear::Length": 1
      "all:HarvestablePOIClusterGridEntity::Length": ">= 10"

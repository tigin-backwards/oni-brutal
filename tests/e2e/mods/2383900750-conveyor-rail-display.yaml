# [Vanilla + DLC] Conveyor Rail Display (2383900750), class P.
#
# What it does: in the conveyor overlay, the buildings on a rail network (loaders,
# receptacles, chutes, bridges, filters, sensors, valves, auto-sweepers) are drawn behind the
# rails instead of in front: they get the OverlayBehindConduits tag (OverlayBackLayer) in place
# of OverlayInFrontOfConduits, and while the overlay is on, a postfix on SolidConveyor.Update
# moves them back in z (restored when it is turned off). It patches by hand once all mods have
# loaded, unless Combined Conduit Display is active.
# How a player reaches it: the conveyor overlay.
# What changes: the drawing order in that overlay.
#
# setup grants Solid Management. A Conveyor Filter (which, unlike the loader, needs no skill to
# build) is built in the dug-out corridor west of the printing pod; the conveyor overlay is
# opened over it, and the mod's layer flag turns on.
from: early-base
mods: [2383900750]
require_log: ['ConveyorRailDisplay: Manual patching finished']
setup:
  - driver: {setup.call: {target: "Research.Instance", method: SetActiveResearch, args: [{"$": "Db.Get().Techs.Get(\"SolidManagement\")"}, true]}}
  - driver: {setup.call: {target: "Research.Instance", method: CompleteQueue}}
steps:
  - expect_state:
      "Assets.GetPrefab(\"SolidFilter\").GetComponent<KPrefabID>.HasTag(\"OverlayBackLayer\")": true
      "Assets.GetPrefab(\"SolidFilter\").GetComponent<KPrefabID>.HasTag(\"OverlayFrontLayer\")": false
      "type:ConveyorRailDisplay.ConveyorRailDisplay_Patches::IsLayerOn": false
  - build: {prefab: SolidFilter, at: [113, 209]}
  - expect: {blueprints: {SolidFilter: 1}}
  - run: {seconds: 1200, until: {buildings: {SolidFilter: 1}, pending_construction: 0}}
  - driver: {camera.set: {cell: [114, 209], ortho: 6}}
  - key: {code: "Shift+F3"}
  - expect_state: {"OverlayScreen.Instance.mode.HashValue": "== original"}
  - expect_state: {"type:ConveyorRailDisplay.ConveyorRailDisplay_Patches::IsLayerOn": true}
  - world_shot: {name: conveyor-overlay, ortho: 4, at: [114, 209], mask: [[0, 420, 1280, 300]]}
  - key: {code: Escape}

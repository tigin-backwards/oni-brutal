# Advanced Coolers (3145815349), classes B, O.
#
# What it does: adds two coolers to the Utilities menu: the Space Cooler (2x2 on a floor,
# Temperature Modulation; removes 64 kDTU/s for 60 W) and the Liquid Cooler (4x1, Liquid
# Tuning; removes 2,048 kDTU/s from the liquid it sits in for 960 W). Each takes refined metal
# and, by a PLib option on by default, fullerene; the options set their cooling and wattage.
# How a player reaches it: the build menu (Utilities), after the research.
# What changes: buildings that delete heat for power.
#
# Options: no fullerene, and the Space Cooler draws 100 W. setup grants Temperature
# Modulation and sets copper down; a Space Cooler is built in the dug-out corridor west of the
# printing pod and selected.
from: early-base
mods: [3145815349]
options:
  Daron.advancedCoolers: {Fullerene: false, SCWattage: 100}
setup:
  - driver: {setup.call: {target: "Research.Instance", method: SetActiveResearch, args: [{"$": "Db.Get().Techs.Get(\"TemperatureModulation\")"}, true]}}
  - driver: {setup.call: {target: "Research.Instance", method: CompleteQueue}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"Copper\").substance", method: SpawnResource, args: [[110.5, 206.5, -12], 600, 300, 255, 0]}}
steps:
  - expect_state:
      "Db.Get().Techs.Get(\"TemperatureModulation\").unlockedItemIDs": {contains: SpaceCooler}
      "Db.Get().Techs.Get(\"LiquidTemperature\").unlockedItemIDs": {contains: LiquidCooler}
      "Assets.GetBuildingDef(\"SpaceCooler\").EnergyConsumptionWhenActive": 100
      "Assets.GetBuildingDef(\"SpaceCooler\").SelfHeatKilowattsWhenActive": -64
      "Assets.GetBuildingDef(\"SpaceCooler\").MaterialCategory.Length": 1
  - build: {prefab: SpaceCooler, at: [113, 206]}
  - expect: {blueprints: {SpaceCooler: 1}}
  - run: {seconds: 1200, until: {buildings: {SpaceCooler: 1}, pending_construction: 0}}
  - driver: {camera.set: {cell: [114, 208], ortho: 8}}
  - click_world: {cell: [113, 206], select: SpaceCooler}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - expect_ui:
      "**/DetailsScreen/TitleBar/Border/LabelGroup/Label": {text: "~Space Cooler"}
  - expect_state:
      "selected:PrimaryElement.ElementID": Copper
      "selected:GetComponent<EnergyConsumer>.BaseWattageRating": 100
  - shot: {name: details, crop: "**/DetailsScreen", threshold: 0.04}

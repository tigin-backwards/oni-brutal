# [Vanilla + DLC] Fast Wireless Automation+ (1722812098), class B.
#
# What it does: adds a Fast Wireless Emitter and Receiver to the Automation menu, researched
# with Dupe Traffic Control (in this game version the tech registration finds no tech, so
# they need no research): 1x1 refined-metal buildings on 5 W; an emitter sends its input signal on one of 1024 channels the moment it changes, and
# every receiver on that channel outputs it.
# How a player reaches it: the build menu (Automation), after the research; their channel
# side screen.
# What changes: automation signals without wires.
#
# The Automation menu lists both, and an emitter built
# by setup in the dug-out corridor west of the printing pod is selected.
from: early-base
mods: [1722812098]
setup:
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"FastWirelessEmitter\")", method: Build, args: [131764, Neutral, null, [Copper], 293.15, DEFAULT_FACADE]}}
steps:
  - expect_state:
      "Db.Get().Techs.TryGetTechForTechItem(\"FastWirelessEmitter\")": missing
      "Assets.GetBuildingDef(\"FastWirelessEmitter\").EnergyConsumptionWhenActive": 5
  - run: {seconds: 10}
  - expect: {buildings: {FastWirelessEmitter: 1}}
  - click: {ui: "**/PlanScreen/Toggle:Automation"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/FastWirelessEmitter Group*", cond: stable}
  - expect_ui:
      "**/BuildingGroups/**/Grid/FastWirelessReceiver Group*": {active: true}
  - shot: {name: automation-menu, crop: "**/PlanBuildingSelectionPanel/BuildingGroups", threshold: 0.04}
  - key: {code: Escape}
  - driver: {camera.set: {cell: [112, 208], ortho: 8}}
  - click_world: {cell: [112, 207], select: FastWirelessEmitter}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - ui_dump: {name: emitter, root: "**/DetailsScreen/SideScreen"}

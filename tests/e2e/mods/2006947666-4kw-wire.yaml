# 4kwWire 4kw的导线 dlc适用 (2006947666), class P.
#
# What it does: Conductive Wire (rating Max2000) carries 4 kW instead of 2 kW (a prefix that
# replaces Wire.GetMaxWattageAsFloat; the other ratings keep the game's 500 W, 1 kW, 20 kW
# and 50 kW).
# How a player reaches it: building Conductive Wire (Power, researched with Pretty Good
# Conductors) and loading a circuit on it.
# What changes: a conductive-wire circuit overloads only above 4 kW.
#
# setup grants Pretty Good Conductors and spawns steel. Conductive Wire is picked in the
# Power menu, its card read (4 kW), and a run of four cells dragged in the dug-out corridor
# west of the printing pod, built and selected.
from: early-base
mods: [2006947666]
setup:
  - driver: {setup.call: {target: "Research.Instance.GetTechInstance(\"PrettyGoodConductors\")", method: Purchased}}
  # The build menu shows a category once one of its buildings is researched, as it learns.
  - driver: {setup.call: {target: "Game.Instance", method: Trigger, args: [-107300940]}}
  - driver: {setup.call: {target: "PlanScreen.Instance._researchedDefs", method: Clear}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"Steel\").substance", method: SpawnResource, args: [[111.5, 206.5, -12], 400, 300, 255, 0]}}
steps:
  - expect_state:
      "Wire.GetMaxWattageAsFloat(\"Max500\")": 500
      "Wire.GetMaxWattageAsFloat(\"Max1000\")": 1000
      "Wire.GetMaxWattageAsFloat(\"Max2000\")": 4000
      "Wire.GetMaxWattageAsFloat(\"Max20000\")": 20000
      "Wire.GetMaxWattageAsFloat(\"Max50000\")": 50000
  - run: {seconds: 5}
  - driver: {camera.set: {cell: [111, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Power"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/WireRefined Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/WireRefined Group*"}
  - ui_wait: {path: "**/ProductInfoScreen", cond: stable}
  - shot: {name: product, crop: "**/ProductInfoScreen", threshold: 0.04}
  - drag: {from: [109, 207], to: [112, 207]}
  - key: {code: Escape}
  - expect: {blueprints: {WireRefined: 4}}
  - run: {seconds: 1200, until: {buildings: {WireRefined: 4}, pending_construction: 0}}
  - driver: {camera.set: {cell: [111, 208], ortho: 8}}
  - click_world: {cell: [110, 207], select: WireRefined}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - expect_ui:
      "**/DetailsScreen/TitleBar/Border/LabelGroup/Label": {text: "~Conductive Wire"}
  - expect_state:
      "selected:Wire.MaxWattageRating": Max2000
  - shot: {name: details, crop: "**/DetailsScreen", threshold: 0.04}

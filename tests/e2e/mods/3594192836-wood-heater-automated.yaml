# Wood Heater Automated (3594192836), class P.
#
# What it does: a postfix on CampfireConfig.CreateBuildingDef gives the Wood Heater a logic
# input port on its base cell, and a postfix on the campfire state machine's instance adds a
# LogicOperationalController, so a red signal turns the heater off.
# How a player reaches it: the Utilities menu's Wood Heater; the Automation overlay.
# What changes: wood heaters under automation.
#
# The heater's tech is researched in setup. Its def has the port; one built by setup in the corridor west of the printing pod
# has its operational controller. Its card is shot.
from: early-base
mods: [3594192836]
setup:
  - driver: {setup.call: {target: "Research.Instance", method: SetActiveResearch, args: [{"$": "Db.Get().Techs.TryGetTechForTechItem(\"Campfire\")"}, true]}}
  - driver: {setup.call: {target: "Research.Instance", method: CompleteQueue}}
  - driver: {setup.call: {target: "Game.Instance", method: Trigger, args: [-107300940]}}
  - driver: {setup.call: {target: "PlanScreen.Instance._researchedDefs", method: Clear}}
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"Campfire\")", method: Build, args: [{"$": "Grid.XYToCell(112, 206)"}, Neutral, null, [Copper], 293.15, DEFAULT_FACADE]}}
steps:
  - expect_state:
      "Assets.GetBuildingDef(\"Campfire\").LogicInputPorts.Count": 1
  - run: {seconds: 3}
  - expect: {buildings: {Campfire: 1}}
  - expect_state:
      "count:all:LogicOperationalController::[*] if .GetComponent<KPrefabID>.PrefabTag.Name == Campfire": 1
  - driver: {camera.set: {cell: [113, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Utilities"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/Campfire Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/Campfire Group*"}
  - ui_wait: {path: "**/ProductInfoScreen", cond: stable}
  - shot: {name: product, crop: "**/ProductInfoScreen", threshold: 0.04}

# Thermal Tooltips Reworked (3780815871), classes P, U.
#
# What it does: in the Temperature overlay, the hover card over buildings and items is
# redrawn with each one's mass (and thermal mass) and temperature in several units; the
# build menu's material panel gains "Advanced Properties" for the chosen material in that
# building: its thermal conductivity, specific heat, thermal mass and melting point. It turns
# off Thermal Tooltips and Material Selection Properties if they are enabled.
# How a player reaches it: the build menu's material panel; the Temperature overlay.
# What changes: thermal numbers where materials are picked.
#
# The Base menu's Tile is picked; its material panel lists the advanced properties of the
# selected material (dumped, shot).
from: early-base
mods: [3780815871]
steps:
  - run: {seconds: 3}
  - driver: {camera.set: {cell: [126, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Base"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/Tile Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/Tile Group*"}
  - ui_wait: {path: "**/ProductInfoScreen", cond: stable}
  - expect_ui:
      "**/ProductInfoScreen/**/MaterialEffects/DescLabel": {any_text: "~Thermal Mass"}
  - ui_dump: {name: effects, root: "**/ProductInfoScreen/**/MaterialEffects"}
  - shot: {name: materials, crop: "**/ProductInfoScreen", threshold: 0.04}

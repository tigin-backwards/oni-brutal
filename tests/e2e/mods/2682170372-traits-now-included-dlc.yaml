# Traits Now Included (DLC-compatible) (2682170372), class O (a worldgen mod, no code).
#
# What it does: replaces Terra's world files, the base game's (worlds/SandstoneDefault) and
# Spaced Out's (expansion1 VanillaSandstoneDefault and TerraMoonlet), with copies whose world
# traits are on (two to four random traits), where the game turns them off in Spaced Out.
# How a player reaches it: New Game, Survival, then the Classic or Spaced Out Terra cluster:
# its asteroid list shows the rolled traits, and the world generates with them.
# What changes: Terra has world traits in Spaced Out too.
#
# From early-base: the main menu, New Game, Survival, Classic; Spaced Out's Terra cluster at a
# fixed coordinate, launched and embarked. Functional expectations (mod-play-testing.md,
# "Worldgen mods"): the asteroid list shows the traits (dumped), and the start world has two
# to four, as many as in the original.
from: early-base
mods: [2682170372]
memory_gb: 8
steps:
  - key: {code: Escape}
  - ui_wait: {path: "**/PauseScreen/**/Main MenuButton", cond: stable}
  - click: {ui: "**/PauseScreen/**/Main MenuButton"}
  - ui_wait: {path: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton", cond: stable}
  - click: {ui: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton"}
  - ui_wait: {path: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons", cond: stable, frames: 3000}
  - click: {text: "NEW GAME", under: "**/MainMenuButtons"}
  - ui_wait: {path: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame", cond: stable}
  - click: {ui: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame"}
  - ui_wait: {path: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/ClassicStyleGame", cond: stable}
  - click: {ui: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/ClassicStyleGame"}
  - ui_wait: {path: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton", cond: stable, frames: 3000}
  - expect_state:
      "ProcGen.SettingsCache.worlds.GetWorldData(\"expansion1::worlds/VanillaSandstoneDefault\").disableWorldTraits": false
      "ProcGen.SettingsCache.worlds.GetWorldData(\"expansion1::worlds/TerraMoonlet\").disableWorldTraits": false
  - click: {ui: "**/CoordinateContainer/SeedInput"}
  - ui_wait: {path: "**/CoordinateContainer/SeedInput", cond: stable}
  - type: {ui: "**/CoordinateContainer/SeedInput", text: "V-SNDST-C-12345-0-0-0", clear: true, enter: true}
  - ui_wait: {path: "**/CoordinateContainer/SeedInput/Text Area/Text", cond: text, value: "~V-SNDST-C-12345-0-0-0"}
  - expect_state:
      "CustomGameSettings.Instance.GetCurrentQualitySetting(\"ClusterLayout\").id": expansion1::clusters/VanillaSandstoneCluster
  - ui_dump: {name: asteroids, root: "**/Section - Destination/World Scoll (Rect Size Set By Screen Code!)/Content/Details"}
  - click: {ui: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton"}
  - ui_wait: {path: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton", cond: stable, frames: 60000}
  - click: {ui: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton"}
  - ui_wait: {path: "**/MinionSelectScreen", cond: gone, frames: 6000}
  - expect_state:
      "ClusterManager.Instance.GetStartWorld().worldName": expansion1::worlds/VanillaSandstoneDefault
      "Components.LiveMinionIdentities.Count": 3
      "ClusterManager.Instance.GetStartWorld().WorldTraitIds.Count": [">= 2", "<= 4", "== original"]

# Build Straight Up (2135682628), class P.
#
# What it does: a building that sits on another's attachment point (the Great Monument's
# middle and top, the base game's rocket modules) may be planned on top of one that is still
# under construction: a transpiler on BuildingDef.IsAreaClear and IsValidBuildLocation also
# accepts an attachment point of a blueprint's finished building. The game accepts only
# finished buildings (Components.BuildingAttachPoints).
# How a player reaches it: the build menu; planning a stack in one go.
# What changes: a whole monument or rocket planned at once.
#
# setup grants Monuments, spawns the monument's materials, and clears a 5x10 space from
# the floor of the dug-out corridor west of the printing pod through its ceiling (setup only;
# the Duplicants cannot reach that high). The Monument Base is planned on the floor, then the
# Monument Midsection on top of its blueprint, which the game refuses.
from: early-base
mods: [2135682628]
setup:
  - driver: {setup.call: {target: "Research.Instance.GetTechInstance(\"Monuments\")", method: Purchased}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"Steel\").substance", method: SpawnResource, args: [[116.5, 207.5, -12], 13000, 300, 255, 0]}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"Obsidian\").substance", method: SpawnResource, args: [[116.5, 207.5, -12], 2600, 300, 255, 0]}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"Ceramic\").substance", method: SpawnResource, args: [[116.5, 207.5, -12], 2600, 300, 255, 0]}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"Polypropylene\").substance", method: SpawnResource, args: [[116.5, 207.5, -12], 2600, 300, 255, 0]}}
  - driver: {setup.call: {type: SimMessages, method: ReplaceElement, args: [{"$": "Grid.XYToCell(106, 206)"}, Oxygen, null, 1, 300]}}

# 更大的施工距离 (Bigger construction distance) (2964691906), class P.
#
# What it does: Duplicants reach further up: a postfix on Game.OnPrefabInit appends the
# offsets (0, -4) and (0, -5), mirrored, to OffsetGroups.InvertedStandardTable and
# InvertedStandardTableWithCorners, the cells a Duplicant may stand in to work on a cell. So
# a Duplicant on the floor digs or builds up to five cells above its feet.
# How a player reaches it: any dig or build order out of the game's reach.
# What changes: fewer ladders and scaffolds to reach a ceiling.
#
# The dug-out corridor west of the printing pod is open from y=206 to 210 under a cuprite
# ceiling at y=211. A dig order on that ceiling, five cells above the floor, is dug from the
# floor (the game reaches only up to y=209).
from: early-base
mods: [2964691906]
steps:
  - expect_state:
      "OffsetGroups.InvertedStandardTable.Length": "== original"
      "cells:110,211..110,211::Grid.Mass.get_Item({cell})": {save_as: ceiling}
  - expect: {pending_digs: 0}
  - dig: [110, 211, 110, 211]
  - expect: {pending_digs: 1}
  - run: {seconds: 900, until: {pending_digs: 0}}
  - expect: {pending_digs: 0}
  - expect_state: {"cells:110,211..110,211::Grid.Mass.get_Item({cell})": "< 0.1 * ceiling"}

# Dupes Refrigeration (2021324045), classes B, O.
#
# What it does: adds refrigerators to the Food menu: the Simple Fridge (1x2, raw minerals,
# Agriculture), coloured and advanced 2x2 fridges, a fridge pod, a space box and high-tech
# fridges. Each keeps food cold (the Simple Fridge's contents at -21 °C) and has a capacity
# and a power draw set by PLib options.
# How a player reaches it: the build menu (Food), after research; the Mods screen's options.
# What changes: more ways to store food chilled.
#
# Options here: the Simple Fridge holds 150 kg (100 by default) and draws 90 W (120). setup
# grants Agriculture. The Simple Fridge is picked in the build menu's Food category, placed in
# the dug-out corridor west of the printing pod (from the base's sandstone), built and
# selected.
from: early-base
mods: [2021324045]
options:
  "2021324045": {Capacity_SimpleFridge: 150, Power_SimpleFridge: 90}
setup:
  - driver: {setup.call: {target: "Research.Instance.GetTechInstance(\"Agriculture\")", method: Purchased}}
  # The build menu shows a category once one of its buildings is researched, as it learns.
  - driver: {setup.call: {target: "Game.Instance", method: Trigger, args: [-107300940]}}
  - driver: {setup.call: {target: "PlanScreen.Instance._researchedDefs", method: Clear}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"SandStone\").substance", method: SpawnResource, args: [[109.5, 206.5, -12], 500, 300, 255, 0]}}
steps:
  - run: {seconds: 5}
  - driver: {camera.set: {cell: [113, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Food"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/SimpleFridge Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/SimpleFridge Group*"}
  - ui_wait: {path: "**/ProductInfoScreen", cond: stable}
  - shot: {name: product, crop: "**/ProductInfoScreen", threshold: 0.04}
  - click_world: {cell: [114, 206]}
  - key: {code: Escape}
  - expect: {blueprints: {SimpleFridge: 1}}
  - run: {seconds: 1200, until: {buildings: {SimpleFridge: 1}, pending_construction: 0}}
  - driver: {camera.set: {cell: [114, 207], ortho: 8}}
  - click_world: {cell: [114, 206], select: SimpleFridge}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - expect_ui:
      "**/DetailsScreen/TitleBar/Border/LabelGroup/Label": {text: "/\\S/"}
  - expect_state:
      "selected:GetComponent<Storage>.capacityKg": 150
      "selected:GetComponent<Building>.Def.EnergyConsumptionWhenActive": 90
  - shot: {name: details, crop: "**/DetailsScreen", threshold: 0.04}

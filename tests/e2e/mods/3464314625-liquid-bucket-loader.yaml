# 自动化-液体装桶器 Automation - Liquid Bucket Loader (3464314625), class P.
#
# What it does: the Bottle Filler (LiquidBottler) empties itself: an AutoDropComponent completes
# its DropAllWorkable as soon as its storage reaches the capacity the player set, so the
# bottled liquid drops beside it without waiting for a Duplicant. The filler also no longer
# floods or gets entombed.
# How a player reaches it: a Bottle Filler fed by a pipe, its capacity side screen.
# What changes: filled bottles come out on their own.
#
# setup builds a Liquid Reservoir holding 300 kg of water and a Bottle Filler in the dug-out
# corridor west of the printing pod, joined by a liquid pipe. The filler's capacity is set to
# 20 kg in its side screen; over 60 s of play water flows in and is dropped as bottles.
from: early-base
mods: [3464314625]
setup:
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"LiquidReservoir\")", method: Build, args: [131126, Neutral, null, [Cuprite], 300.0, DEFAULT_FACADE]}}
  - driver: {setup.call: {target: "last:GetComponent<Storage>", method: AddLiquid, args: [Water, 300.0, 300.0, 255, 0]}}
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"LiquidBottler\")", method: Build, args: [131130, Neutral, null, [Cuprite], 300.0, DEFAULT_FACADE]}}
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"LiquidConduit\")", method: Build, args: [131126, Neutral, null, [SandStone], 300.0, DEFAULT_FACADE]}}
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"LiquidConduit\")", method: Build, args: [131127, Neutral, null, [SandStone], 300.0, DEFAULT_FACADE]}}
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"LiquidConduit\")", method: Build, args: [131128, Neutral, null, [SandStone], 300.0, DEFAULT_FACADE]}}
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"LiquidConduit\")", method: Build, args: [131129, Neutral, null, [SandStone], 300.0, DEFAULT_FACADE]}}
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"LiquidConduit\")", method: Build, args: [131130, Neutral, null, [SandStone], 300.0, DEFAULT_FACADE]}}
  - driver: {setup.call: {target: "Game.Instance.liquidConduitSystem", method: SetConnections, args: ["Right", 131126, true]}}
  - driver: {setup.call: {target: "Game.Instance.liquidConduitSystem", method: SetConnections, args: ["Left, Right", 131127, true]}}
  - driver: {setup.call: {target: "Game.Instance.liquidConduitSystem", method: SetConnections, args: ["Left, Right", 131128, true]}}
  - driver: {setup.call: {target: "Game.Instance.liquidConduitSystem", method: SetConnections, args: ["Left, Right", 131129, true]}}
  - driver: {setup.call: {target: "Game.Instance.liquidConduitSystem", method: SetConnections, args: ["Left", 131130, true]}}
  - driver: {setup.call: {target: "Game.Instance.liquidConduitSystem", method: ForceRebuildNetworks}}
steps:
  - expect_state:
      "Assets.GetBuildingDef(\"LiquidBottler\").Floodable": false
      "Assets.GetBuildingDef(\"LiquidBottler\").BuildingComplete.GetComponent<液体装桶器.AutoLiquidBottlerDropMod.AutoDropComponent>": exists
      "count:all:Pickupable::[*] if .GetComponent<PrimaryElement>.ElementID == Water": {save_as: bottles}
  - driver: {camera.set: {cell: [113, 208], ortho: 8}}
  - click_world: {cell: [114, 206], select: LiquidBottler}
  - ui_wait: {path: "**/CapacityControlSideScreen/**/InputField", cond: stable}
  - type: {ui: "**/CapacityControlSideScreen/**/InputField", text: "20", enter: true, clear: true}
  - expect_state:
      "selected:Bottler.userMaxCapacity": 20
  - run: {seconds: 60}
  - expect_state:
      "count:all:Pickupable::[*] if .GetComponent<PrimaryElement>.ElementID == Water": "> bottles"
      "all:Reservoir::[0].GetComponent<Storage>.MassStored()": "<= 280"
      "all:Bottler::[0].GetComponent<Storage>.MassStored()": "< 20"

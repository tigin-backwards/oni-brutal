# Worldgen Designer (updated) (3807584811), classes U, W.
#
# What it does: a designer for custom planetoids and Spaced Out clusters inside the game. The
# cluster category screen gets a "Worldgen Designer" category (with an animated asteroid
# cutaway), and the destination screen a "Worldgen Designer" button under Customize; both
# open the designer menu (uGUI built in code), where a player lays out biomes, features,
# geysers and POIs and saves them as worldgen files that its patches on SettingsCache,
# CustomGameSettings, TemplateCache and the destination screen register as clusters.
# How a player reaches it: New Game, the cluster category screen or the destination screen.
# What changes: new clusters a player designs.
#
# From a colony: the pause menu's Main Menu, Quit Without Saving, New Game, Survival. The
# category screen shows the designer's category beside the game's; Classic leads to the
# destination screen, whose Worldgen Designer button opens the designer.
from: early-base
mods: [3807584811]
memory_gb: 8
steps:
  - key: {code: Escape}
  - ui_wait: {path: "**/PauseScreen/**/Main MenuButton", cond: stable}
  - click: {ui: "**/PauseScreen/**/Main MenuButton"}
  - ui_wait: {path: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton", cond: stable}
  - click: {ui: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton"}   # Quit Without Saving
  - ui_wait: {path: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons", cond: stable, frames: 3000}
  - click: {text: "NEW GAME", under: "**/MainMenuButtons"}
  - ui_wait: {path: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame", cond: stable}
  - click: {ui: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame"}
  - ui_wait: {path: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/ClassicStyleGame", cond: stable}
  - expect_ui:
      "**/ClusterCategorySelectionScreen/**/WorldgenDesignerCategoryButton": {active: true}
  - click: {ui: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/ClassicStyleGame"}
  - ui_wait: {path: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton", cond: stable, frames: 3000}
  - expect_ui:
      "**/ColonyDestinationScreen2/**/WorldgenDesignerButton": {active: true}
      "**/ColonyDestinationScreen2/**/WorldgenDesignerButton/**": {any_text: "Worldgen Designer"}
  - click: {ui: "**/ColonyDestinationScreen2/**/WorldgenDesignerButton"}
  - ui_wait: {path: "**/WorldgenDesignerUnityMenu", cond: stable, frames: 600}
  - expect_ui:
      "**/WorldgenDesignerUnityMenu": {active: true}

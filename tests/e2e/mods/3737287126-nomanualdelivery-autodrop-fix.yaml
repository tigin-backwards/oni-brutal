# 修复NoManualDelivery与AutoDropGasBottlerAndLiquid共存 (3737287126), class P: a compatibility
# fix for No Manual Delivery (2047308624) with Auto Drop Gas Bottler Filler and Liquid Filler
# (3477214095), installed with both.
#
# What it does: a postfix on the Auto Drop mod's Toggle.OnSpawn points its automatable at No
# Manual Delivery's Automatable2, and a prefix replacing Toggle.ApplyState only adds or
# removes the AutoDropComponent, leaving the automation-only state to No Manual Delivery.
# How a player reaches it: the Canister Filler's "Disable AutoDrop" / "Enable AutoDrop"
# button.
# What changes: the auto drop button no longer fights No Manual Delivery's setting.
#
# setup grants Portable Gases and spawns steel. A Canister Filler is built west of the
# printing pod and selected: its auto drop toggle uses No Manual Delivery's automatable. "Disable AutoDrop"
# removes the auto drop without changing the building's automation-only flag; selected again,
# "Enable AutoDrop" brings it back.
from: early-base
mods: [2047308624, 3477214095, 3737287126]
setup:
  - driver: {setup.call: {target: "Research.Instance.GetTechInstance(\"PortableGasses\")", method: Purchased}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"Steel\").substance", method: SpawnResource, args: [[109.5, 206.5, -12], 500, 300, 255, 0]}}
steps:
  - build: {prefab: GasBottler, at: [113, 206], material: Steel}
  - expect: {blueprints: {GasBottler: 1}}
  - run: {seconds: 900, until: {buildings: {GasBottler: 1}, pending_construction: 0}}
  - driver: {camera.set: {cell: [114, 207], ortho: 8}}
  - click_world: {cell: [114, 206], select: GasBottler}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - expect_state:
      "selected:GetComponent<Auto_Drop_Gas_Bottler_and_Liquid_v2.Patcher.AutoDropComponent>": exists
      "selected:GetComponent<Auto_Drop_Gas_Bottler_and_Liquid.Patcher.Toggle>.automatable.GetType().Name": "== original"
      "selected:Automatable.GetAutomationOnly()": "== original"
  - click: {ui: "**/UserMenuScreen/Buttons/Disable AutoDropButton"}
  - expect_state:
      "selected:GetComponent<Auto_Drop_Gas_Bottler_and_Liquid.Patcher.Toggle>.automationOnly": true
      "selected:GetComponent<Auto_Drop_Gas_Bottler_and_Liquid_v2.Patcher.AutoDropComponent>": missing
      "selected:Automatable.GetAutomationOnly()": "== original"
  - key: {code: Escape}
  - click_world: {cell: [114, 206], select: GasBottler}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - click: {ui: "**/UserMenuScreen/Buttons/Enable AutoDropButton"}
  - expect_state:
      "selected:GetComponent<Auto_Drop_Gas_Bottler_and_Liquid.Patcher.Toggle>.automationOnly": false
      "selected:GetComponent<Auto_Drop_Gas_Bottler_and_Liquid_v2.Patcher.AutoDropComponent>": exists

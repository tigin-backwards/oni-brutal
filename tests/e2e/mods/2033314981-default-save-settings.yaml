# Default Save Settings (2033314981), class P (PLib options).
#
# What it does: a new colony starts with the save settings chosen in the mod's options instead
# of the game's defaults: the auto-save interval and timelapse resolution (SaveConfigurationScreen's
# slider steps), auto-disinfection and its germ threshold (postfix on SaveGame.OnPrefabInit),
# and Enable Proximity in the Priorities screen (postfix on Immigration.OnPrefabInit). A loaded
# save keeps its own settings.
# How a player reaches it: the mod's options; then New Game.
# What changes: the new colony's settings.
#
# Options here: proximity on, auto-save every 10 cycles, timelapse 256x384, auto-disinfect off
# at 5000 germs. From early-base (whose own settings load unchanged), the pause menu's Main
# Menu, Quit Without Saving, then New Game, Survival, Spaced Out! and Start; the new colony's
# settings follow the options once the Duplicants are picked and it starts.
from: early-base
mods: [2033314981]
options:
  "2033314981": {EnableProximity: true, AutoSaveInterval: 3, TimelapseResolution: 1, EnableAutoDisinfect: false, DisinfectMinGermCount: 5000}
steps:
  - expect_state:
      "SaveGame.Instance.AutoSaveCycleInterval": "== original"
      "SaveGame.Instance.TimelapseResolution.x": "== original"
      "SaveGame.Instance.enableAutoDisinfect": "== original"
      "SaveGame.Instance.minGermCountForDisinfect": "== original"
      "Game.Instance.advancedPersonalPriorities": "== original"
  - key: {code: Escape}
  - ui_wait: {path: "**/PauseScreen/**/Main MenuButton", cond: stable}
  - click: {ui: "**/PauseScreen/**/Main MenuButton"}
  - ui_wait: {path: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton", cond: stable}
  - click: {ui: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton"}   # Quit Without Saving
  - ui_wait: {path: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons", cond: stable, frames: 3000}
  - click: {text: "NEW GAME", under: "**/MainMenuButtons"}
  - ui_wait: {path: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame", cond: stable}
  - click: {ui: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame"}
  - ui_wait: {path: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/SpacedOutGame", cond: stable}
  - click: {ui: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/SpacedOutGame"}
  - ui_wait: {path: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton", cond: stable, frames: 3000}
  - click: {ui: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton"}
  - ui_wait: {path: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton", cond: stable, frames: 20000}
  - click: {ui: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton"}
  - ui_wait: {path: "**/WattsonMessage/Dialog/FG/Message", frames: 20000}   # the new colony's welcome
  - expect_state:
      "SaveGame.Instance.AutoSaveCycleInterval": 10
      "SaveGame.Instance.TimelapseResolution.x": 256
      "SaveGame.Instance.enableAutoDisinfect": false
      "SaveGame.Instance.minGermCountForDisinfect": 5000
      "Game.Instance.advancedPersonalPriorities": true

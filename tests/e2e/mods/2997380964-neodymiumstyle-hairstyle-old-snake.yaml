# NeodymiumStyle Hairstyle MOD "OLD-SNAKE" (2997380964), class X (content for Dupery).
#
# What it does: no code. With Dupery (here Dupery Fixed, 3172734005, which the catalog names as
# its requirement), its PERSONALITIES.json adds a printable Duplicant personality, Old_Snake
# (male, Binge Eater stress reaction, Super Productive joy trait), whose hair, hair_old_snake, comes from the mod's anim folder; strings/ translates its
# description into Japanese.
# How a player reaches it: Duplicants printed or picked for a new colony; the Duplicant's
# Personality tab.
# What changes: another personality in the pool, with its own hairstyle.
#
# Dupery imports the personality into the game's Personalities and loads the hair as an
# accessory, as its log says.
from: early-base
mods: [3172734005, 2997380964]
require_log: ['\[Dupery\]: accessory hair_old_snake successfully loaded']
steps:
  - expect_state:
      "Db.Get().Personalities.TryGet(\"OLD_SNAKE\")": exists
      "Db.Get().Personalities.TryGet(\"OLD_SNAKE\").Disabled": false
      "Db.Get().Accessories.TryGet(\"hair_old_snake\")": exists
      "Db.Get().Personalities.Count": "== original"
  - run: {seconds: 10}
  - expect: {duplicants: 3}

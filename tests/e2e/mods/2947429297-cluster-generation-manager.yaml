# Cluster Generation Manager [Vanilla/DLC] (2947429297), classes S, K, O, M.
#
# What it does: a new game's destination screen gets a gear button beside the coordinate's
# shuffle button (a copy of it, ColonyDestinationSelectScreen.OnSpawn). It opens the mod's
# cluster editor (ClusterSelectionView, from its asset bundle): starmap item categories (start,
# teleport and outer asteroids, points of interest, the starmap), each asteroid's size,
# traits, geysers and biomes, DLC content, mixing, game settings and story traits, and presets.
# The cluster is then generated from those settings, and the save remembers them.
# How a player reaches it: the main menu, New Game, a game mode and an asteroid style, then the
# gear on the destination screen.
# What changes: the cluster a new game generates.
#
# From a colony: the pause menu's Main Menu, Quit Without Saving; then New Game, Survival,
# Spaced Out!, and the gear. The main menu cannot be screenshot through OniMcp, so the editor
# is compared by its layout dump only. A category is clicked; the item list follows it.
from: early-base
mods: [2947429297]
steps:
  - key: {code: Escape}
  - ui_wait: {path: "**/PauseScreen/**/Main MenuButton", cond: stable}
  - click: {ui: "**/PauseScreen/**/Main MenuButton"}
  - ui_wait: {path: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton", cond: stable}
  - click: {ui: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton"}   # Quit Without Saving
  - ui_wait: {path: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons", cond: stable, frames: 3000}
  - click: {text: "NEW GAME", under: "**/MainMenuButtons"}
  - ui_wait: {path: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame", cond: stable}
  - click: {ui: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame"}
  - ui_wait: {path: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/SpacedOutGame", cond: stable}
  - click: {ui: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/SpacedOutGame"}
  - ui_wait: {path: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton", cond: stable, frames: 3000}
  # The game's shuffle button and the mod's gear beside it.
  - expect_ui:
      "**/CoordinateContainer/ShuffleButton": {count: 2}
  - click: {ui: "**/CoordinateContainer/ShuffleButton", index: 1}
  - ui_wait: {path: "**/ClusterSelectionView/Categories", cond: stable, frames: 600}
  - expect_ui:
      "**/ClusterSelectionView/Categories/Header/Label": {text: "Starmap Item Categories"}
      "**/ClusterSelectionView/Categories/Content/Item/Label": {any_text: "Outer Asteroids"}
      "**/ClusterSelectionView/ItemSelection/Header/Label": {text: "Asteroids in this category:"}
  - ui_dump: {name: categories, root: "**/ClusterSelectionView/Categories"}
  - click: {text: "Points of Interest", under: "**/ClusterSelectionView/Categories"}
  - expect_ui:
      "**/ClusterSelectionView/ItemSelection/Header/Label": {text: "POI Groups in this category:"}

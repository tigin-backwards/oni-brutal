# Fast Insulated Self Sealing AirLock Continued (3755915137), classes B, O.
#
# What it does: adds the Fast Insulated Self-Sealing Airlock (1x2, 200 kg of any metal, a
# manual door after the Mechanized Airlock in the Base menu, researched with Temperature
# Modulation): it opens Multiplier times faster than a manual airlock, conducts no heat
# (ThermalConductivity), lets no gas or liquid through when open, and refunds its exact cost
# when deconstructed. PLib options (config.json) set the speed, the conductivity and an extra
# reed fibre or plastic cost.
# How a player reaches it: the build menu (Base); the door's side screen; the Mods screen.
# What changes: a fast door that seals and insulates.
#
# Options here: Multiplier 10. setup grants Temperature Modulation and spawns copper ore. The
# airlock is built in the dug-out corridor west of the printing pod and selected.
from: early-base
mods: [3755915137]
options:
  "3755915137": {Multiplier: 10}
setup:
  - driver: {setup.call: {target: "Research.Instance", method: SetActiveResearch, args: [{"$": "Db.Get().Techs.Get(\"TemperatureModulation\")"}, true]}}
  - driver: {setup.call: {target: "Research.Instance", method: CompleteQueue}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"Cuprite\").substance", method: SpawnResource, args: [[114.5, 207.5, -12], 300, 300, 255, 0]}}
steps:
  - expect_state:
      "Db.Get().Techs.Get(\"TemperatureModulation\").unlockedItemIDs": {contains: FastInsulatedSelfSealingAirLock}
      "Assets.GetBuildingDef(\"FastInsulatedSelfSealingAirLock\").BuildingComplete.GetComponent<Door>.poweredAnimSpeed": 10
      "Assets.GetBuildingDef(\"FastInsulatedSelfSealingAirLock\").ThermalConductivity": 0
  - build: {prefab: FastInsulatedSelfSealingAirLock, at: [113, 206]}
  - expect: {blueprints: {FastInsulatedSelfSealingAirLock: 1}}
  - run: {seconds: 900, until: {buildings: {FastInsulatedSelfSealingAirLock: 1}, pending_construction: 0}}
  - driver: {camera.set: {cell: [113, 207], ortho: 8}}
  - click_world: {cell: [113, 207], select: FastInsulatedSelfSealingAirLock}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - expect_state:
      "selected:GetComponent<KPrefabID>.PrefabTag.Name": FastInsulatedSelfSealingAirLock
      "selected:GetComponent<Door>.insulationModifier": 0
      "selected:GetComponent<Door>.unpoweredAnimSpeed": 10
  - expect_ui:
      "**/DetailsScreen/TitleBar/Border/LabelGroup/Label": {text: "/./"}
  - shot: {name: title, crop: "**/DetailsScreen/TitleBar", threshold: 0.04}

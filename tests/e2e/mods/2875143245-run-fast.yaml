# P 跑快快 Run Fast 1.3 (2875143245), classes P, O.
#
# What it does: a prefix on Db.Initialize sets every TUNING.DUPLICANTSTATS.MOVEMENT_MODIFIERS
# value (neutral, the bonuses and the penalties, 1 to 1.75 in the game) to a PLib option
# (P014GGG1X1, default 5), the movement speed a Duplicant has on the tiles built from them;
# with a second option (P014GGG1) the tile configurations (Tile, Metal, Plastic, Carpet,
# Storage, Bunker, Insulation, Window, Mesh, Airflow, Farm and Hydroponic tiles) also set
# their speed multiplier to it outright.
# How a player reaches it: the Mods screen's options; then walking on built tiles.
# What changes: Duplicants walk five times as fast on tiles.
#
# Options here: both on, 5. The tunings read 5, and so does the speed multiplier of the Tile
# prefab and of the 8 Tiles already built in the colony.
from: early-base
mods: [2875143245]
options:
  "2875143245": {$file: P014GGG1.json, P014GGG1: true, P014GGG1X1: 5.0}
steps:
  - expect_state:
      "type:TUNING.DUPLICANTSTATS+MOVEMENT_MODIFIERS::NEUTRAL": 5
      "type:TUNING.DUPLICANTSTATS+MOVEMENT_MODIFIERS::BONUS_3": 5
      "type:TUNING.DUPLICANTSTATS+MOVEMENT_MODIFIERS::PENALTY_1": 5
      "Assets.GetBuildingDef(\"Tile\").BuildingComplete.GetComponent<SimCellOccupier>.movementSpeedMultiplier": 5
      "Assets.GetBuildingDef(\"MetalTile\").BuildingComplete.GetComponent<SimCellOccupier>.movementSpeedMultiplier": 5
      "count:all:SimCellOccupier::[*] if .movementSpeedMultiplier == 5.0": ">= 8"

# Water Gate (3586927171), classes B, O.
#
# What it does: adds four gates to the Utilities menu that build into thin layers of liquid
# and then remove themselves, leaving a liquid airlock: the Water Gate 1x2 (100 kg of raw
# mineral, researched with Plumbing), 1x3 and 1x4 (Renewable Energy) and a Gel Gate. The 1x2
# gate's material picks its liquids: igneous rock salt water under water, granite two
# liquids the options choose, any other crude oil under petroleum. PLib options set the build
# time, the bottom layer's mass and the granite liquids.
# How a player reaches it: the build menu (Utilities); the options on the Mods screen.
# What changes: layers of liquid where a gate was built.
#
# Options here: a bottom layer of 0.05 kg (0.03 by default). setup grants Plumbing. The 1x2
# gate is built of sandstone in the corridor west of the printing pod; crude oil and
# petroleum are left in its two cells, and the building is gone.
from: early-base
mods: [3586927171]
options:
  "3586927171": {BottomLiquidMass: 0.05}
setup:
  - driver: {setup.call: {target: "Research.Instance.GetTechInstance(\"LiquidPiping\")", method: Purchased}}
steps:
  - expect_state:
      "Db.Get().Techs.Get(\"LiquidPiping\").unlockedItemIDs": {contains: PiapiWaterGate1x2}
      "type:WaterGateKai.ConfigOptions::Instance.BottomLiquidMass": 0.05
      "Grid.Element[131129].IsLiquid": false
  - build: {prefab: PiapiWaterGate1x2, at: [113, 206], material: SandStone}
  - expect: {blueprints: {PiapiWaterGate1x2: 1}}
  - run: {seconds: 900, until: {pending_construction: 0}}
  - run: {seconds: 2}
  - expect: {buildings: {PiapiWaterGate1x2: 0}}
  - expect_state:
      "Grid.Element[131129].id": CrudeOil
      "Grid.Element[131765].id": Petroleum
      "Grid.Mass.get_Item(131129)": "< 0.08"

# 南瓜灯 Pumpkin Lantern 2.1 (2919045981), class B.
#
# What it does: adds the 南瓜灯 (R020GG1, 1x1, refined metal, its own kanim), a 15 W light with a
# decor bonus for the Furniture menu, available without research.
# How a player reaches it: the Furniture menu.
# What changes: a decorative pumpkin light.
#
# The Furniture menu offers it (its card is shot); one built in the east corridor lights its
# surroundings once powered (here unpowered: it stands, with its light component).
from: early-base
mods: [2919045981]
setup:
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"R020GG1\")", method: Build, args: [131786, Neutral, null, [Copper], 293.15, DEFAULT_FACADE]}}
steps:
  - expect_state:
      "Assets.GetBuildingDef(\"R020GG1\").EnergyConsumptionWhenActive": 15
      "Assets.GetBuildingDef(\"R020GG1\").AnimFiles[0].name": "R020GG1_kanim"
  - run: {seconds: 3}
  - expect: {buildings: {R020GG1: 1}}
  - expect_state:
      "count:all:Light2D::[*] if .gameObject.name == R020GG1Complete": 1
  - driver: {camera.set: {cell: [113, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Furniture"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/R020GG1 Group*", cond: stable}
  - scroll: {at: "**/PlanBuildingSelectionPanel/BuildingGroups", notches: -10}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/R020GG1 Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/R020GG1 Group*"}
  - ui_wait: {path: "**/ProductInfoScreen", cond: stable}
  - shot: {name: product, crop: "**/ProductInfoScreen", threshold: 0.04}

# Cluster Generation Settings Manager (2945098028), classes M, O.
#
# What it does: PLib options pick a new game's cluster contents: the start and warp asteroids
# (from the game's and its own templates), which outer asteroids and moonlets join, the
# starmap's size and its points of interest, their counts and world mixing. When a cluster
# category is chosen on the new game screens, it writes clusters from those options
# (worldgen/clusters/CGSM.yaml, CGSMVanilla.yaml, CGSMLab.yaml in its folder, coordinate prefix
# CGSM-C) and offers them as "Cluster Generation Settings Manager"; worldgen and mixing follow
# them.
# How a player reaches it: the Mods screen's options; New Game, the carousel's CGSM cluster.
# What changes: the cluster a new game generates.
#
# options set a starmap radius of 15. From early-base the game is quit to the main menu and a
# new Survival game started in the Spaced Out category: the carousel offers the mod's cluster,
# and the cluster file it wrote holds 15 rings. (Typing its coordinate did not select it in
# the original, so this spec does not generate one.)
from: early-base
mods: [2945098028]
options:
  MikeB26.CGSM: {starmapRadius: 15}
steps:
  - key: {code: Escape}
  - ui_wait: {path: "**/PauseScreen/**/Main MenuButton", cond: stable}
  - click: {ui: "**/PauseScreen/**/Main MenuButton"}
  - ui_wait: {path: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton", cond: stable}
  - click: {ui: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton"}   # Quit Without Saving
  - ui_wait: {path: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons", cond: stable, frames: 3000}
  - click: {text: "NEW GAME", under: "**/MainMenuButtons"}
  - ui_wait: {path: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame", cond: stable}
  - click: {ui: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame"}
  - ui_wait: {path: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/SpacedOutGame", cond: stable}
  - click: {ui: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/SpacedOutGame"}
  - ui_wait: {path: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton", cond: stable, frames: 3000}
  - expect_state:
      "count:all:DestinationSelectPanel::[0].clusterKeys[*] if .EndsWith(\"clusters/CGSM\") == true": 1
  # The written cluster follows the options: 15 rings of starmap.
  - expect_state:
      "file:mods/Local/2945098028/worldgen/clusters/CGSM.yaml": [{contains: "coordinatePrefix: CGSM-C"}, {contains: "numRings: 15"}]
      "file:mods/Local/2945098028/worldgen/clusters/CGSMVanilla.yaml": exists
  - ui_dump: {name: destination, root: "**/ColonyDestinationScreen2/Layout/Buttons"}

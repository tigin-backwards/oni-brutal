# (MG) Particle collection speed 10 times (超级辐射收集器, 2567161929), class P.
#
# What it does: the Radbolt Generator cools instead of heating (self-heat -2 kDTU/s, a
# postfix on its CreateBuildingDef), and a postfix on HighEnergyParticleStorage.Store adds a
# hundred times each stored amount again, so radbolt storages fill far faster.
# How a player reaches it: the Radiation menu's Radbolt Generator (Spaced Out).
# What changes: radbolts come cheaply.
#
# The generator's tech is researched in setup. Its def cools; its card in the Radiation menu is shot.
from: early-base
mods: [2567161929]
setup:
  - driver: {setup.call: {target: "Research.Instance", method: SetActiveResearch, args: [{"$": "Db.Get().Techs.TryGetTechForTechItem(\"HighEnergyParticleSpawner\")"}, true]}}
  - driver: {setup.call: {target: "Research.Instance", method: CompleteQueue}}
  - driver: {setup.call: {target: "Game.Instance", method: Trigger, args: [-107300940]}}
  - driver: {setup.call: {target: "PlanScreen.Instance._researchedDefs", method: Clear}}
steps:
  - expect_state:
      "Assets.GetBuildingDef(\"HighEnergyParticleSpawner\").SelfHeatKilowattsWhenActive": -2
  - run: {seconds: 3}
  - driver: {camera.set: {cell: [113, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Radiation"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/HighEnergyParticleSpawner Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/HighEnergyParticleSpawner Group*"}
  - ui_wait: {path: "**/ProductInfoScreen", cond: stable}
  - shot: {name: product, crop: "**/ProductInfoScreen", threshold: 0.04}

# Stacking bed 叠叠床 (2857940400), class B.
#
# What it does: adds Stackingbed (叠叠床), a 2x1 refined-metal bed on the Ladder Bed's look,
# to the Furniture menu (Spaced Out only): a ladder and a bed in one, stackable on another
# (its attach point takes a LadderBed), with the Ladder Bed's stamina and health effects.
# Its OnLoad calls PLib's PUtil.InitLibrary, but the mod ships no PLib.
# How a player reaches it: the build menu (Furniture).
# What changes: stackable ladder beds.
#
# The prefab is read; the Furniture menu lists the bed (shot).
from: early-base
mods: [2857940400]
steps:
  - expect_state:
      "Assets.GetPrefab(\"Stackingbed\").GetComponent<Bed>.effects": {contains: LadderBedStamina}
      "Assets.GetPrefab(\"Stackingbed\").GetComponent<Ladder>": exists
  - run: {seconds: 10}
  - click: {ui: "**/PlanScreen/Toggle:Furniture"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/Stackingbed Group*", cond: stable, stable: 120, frames: 600}
  - shot: {name: furniture-menu, crop: "**/PlanBuildingSelectionPanel/BuildingGroups", threshold: 0.04}

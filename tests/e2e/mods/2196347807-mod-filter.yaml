# Mod Filter (2196347807), class M.
#
# What it does: puts a search field over the Mods screen's list (a copy of the Colony Summary
# screen's search bar, made at the main menu): typing narrows the list to mods whose title
# contains the text, ignoring case; its clear button empties it. While a filter is typed, the
# enable/disable-all button is disabled ("Disabled while filter is active").
# How a player reaches it: the main menu's Mods screen (from a colony: the pause menu's Main
# Menu, then Quit Without Saving).
# What changes: which mods the list shows.
#
# The main menu cannot be screenshot through OniMcp, so the screen is compared by its layout
# dump only. "driver" is typed into the field: only E2eDriver stays listed; the clear button
# brings the three mods back.
from: early-base
mods: [2196347807]
steps:
  - key: {code: Escape}
  - ui_wait: {path: "**/PauseScreen/**/Main MenuButton", cond: stable}
  - click: {ui: "**/PauseScreen/**/Main MenuButton"}
  - ui_wait: {path: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton", cond: stable}
  - click: {ui: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton"}   # Quit Without Saving
  - ui_wait: {path: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons", cond: stable, frames: 3000}
  - click: {text: "MODS", under: "**/MainMenuButtons"}
  - ui_wait: {path: "**/ModsScreen/Panel", cond: stable}
  - expect_ui:
      "**/ModsScreen/Panel/Search/LocTextInputField": {active: true}
      "**/ModsScreen/Panel/ListView/Files/Viewport/Content/*": {count: 3}
  - ui_dump: {name: search, root: "**/ModsScreen/Panel/Search"}
  - ui_wait: {path: "**/ModsScreen/Panel/Search/LocTextInputField", cond: stable}
  - type: {ui: "**/ModsScreen/Panel/Search/LocTextInputField", text: "driver"}
  - ui_wait: {path: "**/ModsScreen/Panel/ListView/Files/Viewport/Content", cond: stable}
  - expect_ui:
      "**/ModsScreen/Panel/ListView/Files/Viewport/Content/*": {count: 1}
      "**/ModsScreen/Panel/ListView/Files/Viewport/Content/E2eDriver": {active: true}
  - expect_state:
      "type:ModsFilter.ModsFilterPatches::_filterManager.Text": driver
  - ui_dump: {name: filtered, root: "**/ModsScreen/Panel/ListView"}
  - click: {ui: "**/ModsScreen/Panel/Search/ClearButton"}
  - ui_wait: {path: "**/ModsScreen/Panel/ListView/Files/Viewport/Content", cond: stable}
  - expect_ui:
      "**/ModsScreen/Panel/ListView/Files/Viewport/Content/*": {count: 3}

# The True Luxury Bed - 真正的豪华床 (2858439107), class P.
#
# What it does: a postfix on LuxuryBedConfig.CreateBuildingDef makes the Comfy Bed cost 400 kg
# of raw minerals and 4 kg of reed fiber (the game asks for plastic and reed fiber).
# How a player reaches it: research Luxury; the Furniture menu's Comfy Bed.
# What changes: a Comfy Bed without plastic.
#
# Luxury is researched in setup. The Comfy Bed's card shows the new materials, and one is
# built in the corridor west of the printing pod of sandstone and reed fiber.
from: early-base
mods: [2858439107]
setup:
  - driver: {setup.call: {target: "Research.Instance", method: SetActiveResearch, args: [{"$": "Db.Get().Techs.Get(\"Luxury\")"}, true]}}
  - driver: {setup.call: {target: "Research.Instance", method: CompleteQueue}}
  - driver: {setup.call: {target: "Game.Instance", method: Trigger, args: [-107300940]}}
  - driver: {setup.call: {target: "PlanScreen.Instance._researchedDefs", method: Clear}}
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"LuxuryBed\")", method: Build, args: [{"$": "Grid.XYToCell(112, 206)"}, Neutral, null, [SandStone, BasicFabric], 293.15, DEFAULT_FACADE]}}
steps:
  - expect_state:
      "Assets.GetBuildingDef(\"LuxuryBed\").Mass": {equals: [400, 4]}
      "Assets.GetBuildingDef(\"LuxuryBed\").MaterialCategory": {equals: [BuildableRaw, BuildingFiber]}
  - run: {seconds: 3}
  - expect: {buildings: {LuxuryBed: 1}}
  - driver: {camera.set: {cell: [113, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Furniture"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/LuxuryBed Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/LuxuryBed Group*"}
  - ui_wait: {path: "**/ProductInfoScreen/MaterialSelectionPanel", cond: stable}
  - shot: {name: product, crop: "**/ProductInfoScreen", threshold: 0.04}

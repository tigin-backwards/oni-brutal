# Advanced Electrolyzers (1801004057), classes B, O.
#
# What it does: adds the Industrial Electrolyzer (AdvacnedElectrolyzer, 2x2, 250 kg of refined
# metal, in the Oxygen menu, researched with Improved Oxygen): fed any water through a liquid
# pipe, it pipes out oxygen and hydrogen (a second gas output) at 400 W. Its PLib options
# (config.json) set the rates, temperatures, heat, power, and whether it takes salt water and
# brine.
# How a player reaches it: the build menu (Oxygen), after the research.
# What changes: an electrolyzer with piped outputs.
#
# setup grants the research and sets 500 kg of copper down in the dug-out corridor west of
# the printing pod. The electrolyzer is built there; once built it is selected, and its
# water intake, storage and power are the options'.
from: early-base
mods: [1801004057]
setup:
  - driver: {setup.call: {target: "Research.Instance", method: SetActiveResearch, args: [{"$": "Db.Get().Techs.Get(\"ImprovedOxygen\")"}, true]}}
  - driver: {setup.call: {target: "Research.Instance", method: CompleteQueue}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"Copper\").substance", method: SpawnResource, args: [[110.5, 206.5, -12], 500, 300, 255, 0]}}
steps:
  - expect_state:
      "Db.Get().Techs.Get(\"ImprovedOxygen\").unlockedItemIDs": {contains: AdvacnedElectrolyzer}
      "Assets.GetBuildingDef(\"AdvacnedElectrolyzer\").EnergyConsumptionWhenActive": 400
  - build: {prefab: AdvacnedElectrolyzer, at: [113, 206], material: Copper}
  - expect: {blueprints: {AdvacnedElectrolyzer: 1}}
  - run: {seconds: 900, until: {buildings: {AdvacnedElectrolyzer: 1}, pending_construction: 0}}
  - driver: {camera.set: {cell: [114, 208], ortho: 8}}
  - click_world: {cell: [113, 206], select: AdvacnedElectrolyzer}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - expect_ui:
      "**/DetailsScreen/TitleBar/Border/LabelGroup/Label": {text: "~Industrial Electrolyzer"}
  - expect_state:
      "selected:PrimaryElement.ElementID": Copper
      "selected:EnergyConsumer.WattsNeededWhenActive": 400
      "selected:GetComponent<TagnumElite.AdvancedElectrolyzers.IndustrialElectrolyzer>": exists
      "selected:ConduitConsumer.capacityTag.Name": AnyWater
      "selected:Storage.capacityKg": 6

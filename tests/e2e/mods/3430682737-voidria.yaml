# Voidria (3430682737), classes O, M (a worldgen mod).
#
# What it does: the Voidria clusters for Spaced Out (Classic style VOA-TG-C, Spaced Out style
# VOA-TG-M): a start asteroid that is mostly void, a forest start of its own (voa_ForestStart,
# voa_forestBase), gifts, critter templates and an oil reservoir instead of geysers, with a
# tiny warp asteroid and a tiny landing zone. Its code (a postfix on the MutatedWorldData
# constructor) edits the world's template rules and space subworlds by its PLib options and
# the DLCs mixed in, and when the Temporal Tear registers it spawns every waiting entity (Save
# Critters, without the background) and opens the tear unless the tear opener is kept.
# How a player reaches it: the main menu, New Game, Survival, Classic; the carousel lists
# Voidria; its options are in the Mods screen.
# What changes: the cluster a new game generates.
#
# With its defaults (no background, critters saved, the tear opener kept): from a colony, Main
# Menu, Quit Without Saving, New Game, Survival, Classic; the Classic-style cluster chosen by
# typing its coordinate, launched and embarked. Functional expectations (mod-play-testing.md,
# "Worldgen mods"): the three worlds, the start world's size and subworlds (plain space, not the
# background one the option removes), its templates spawned at once, the tear still closed.
from: early-base
mods: [3430682737]
memory_gb: 8
steps:
  - key: {code: Escape}
  - ui_wait: {path: "**/PauseScreen/**/Main MenuButton", cond: stable}
  - click: {ui: "**/PauseScreen/**/Main MenuButton"}
  - ui_wait: {path: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton", cond: stable}
  - click: {ui: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton"}   # Quit Without Saving
  - ui_wait: {path: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons", cond: stable, frames: 3000}
  - click: {text: "NEW GAME", under: "**/MainMenuButtons"}
  - ui_wait: {path: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame", cond: stable}
  - click: {ui: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame"}
  - ui_wait: {path: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/ClassicStyleGame", cond: stable}
  - click: {ui: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/ClassicStyleGame"}
  - ui_wait: {path: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton", cond: stable, frames: 3000}
  - expect_state:
      "all:DestinationSelectPanel::[0].clusterKeys": {contains: "expansion1::clusters/Voidria"}
  - click: {ui: "**/CoordinateContainer/SeedInput"}
  - ui_wait: {path: "**/CoordinateContainer/SeedInput", cond: stable}
  - type: {ui: "**/CoordinateContainer/SeedInput", text: "VOA-TG-C-12345-0-0-0", clear: true, enter: true}
  - ui_wait: {path: "**/Section - Destination/DestinationDetailsHeader/ClusterName", cond: text, value: "~Voidria"}
  - expect_ui:
      "**/CoordinateContainer/SeedInput/Text Area/Text": {text: "~VOA-TG-C-12345-0-0-0"}
      "**/StartingAsteroidCategory/Content/Prefab_AsteroidLine/Label": {text: "Voidria"}
  - expect_state:
      "CustomGameSettings.Instance.GetCurrentQualitySetting(\"ClusterLayout\").id": "expansion1::clusters/Voidria"
  - ui_dump: {name: asteroids, root: "**/Section - Destination/World Scoll (Rect Size Set By Screen Code!)/Content/Details"}
  - click: {ui: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton"}
  # Worldgen runs on its own thread; the Duplicant selection follows once the world is loaded.
  - ui_wait: {path: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton", cond: stable, frames: 60000}
  - click: {ui: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton"}
  - ui_wait: {path: "**/MinionSelectScreen", cond: gone, frames: 6000}
  - expect_state:
      "ClusterManager.Instance.WorldContainers.Count": 3
      "ClusterManager.Instance.GetStartWorld().worldName": "expansion1::worlds/VoidriaSO"
      "ClusterManager.Instance.GetStartWorld().worldSize.x": 240
      "ClusterManager.Instance.GetStartWorld().worldSize.y": 380
      "count:ClusterManager.Instance.WorldContainers[*] if .worldName == expansion1::worlds/TinyWarpSurface": 1
      "count:ClusterManager.Instance.WorldContainers[*] if .worldName == expansion1::worlds/TinyLandingZone": 1
      "Components.LiveMinionIdentities.Count": 3
      "ClusterManager.Instance.GetStartWorld().m_generatedSubworlds": {contains: subworlds/Voidria/voa_ForestStart}
      # Without the background option, the plain space subworld stands in for the mod's.
      "count:ClusterManager.Instance.GetStartWorld().m_generatedSubworlds[*] if .Contains(\"voa_SpaceWithBg\") == true": 0
      # Save Critters: every waiting entity spawned when the tear registered; the tear stays shut.
      "SaveGame.Instance.worldGenSpawner.spawnables.Count": {save_as: spawners}
      "all:TemporalTear::Length": 1
      "all:TemporalTear::[0].IsOpen()": false
      "Assets.Sprites[\"biomeIconVoidria\"]": exists
  # Most of them spawned at once (a new world of the game's spawns only what it uncovers).
  - expect_state:
      "count:SaveGame.Instance.worldGenSpawner.spawnables[*] if .isSpawned == true": ">= 0.6 * spawners"
      "ClusterManager.Instance.GetStartWorld().m_generatedSubworlds": {contains: subworlds/space/Space}

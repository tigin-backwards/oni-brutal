# AllBiomesWorld - Fuleria (1794510050), class P (a worldgen mod).
#
# What it does: the Fuleria cluster, an event-style ("Special") cluster for Spaced Out whose
# start asteroid, Fuleria (260 x 380), holds every biome (forest start, sandstone, jungle,
# marsh, swamp, ocean, aquatic, frozen, rust, barren, oil, magma, wasteland, Moo, radioactive,
# space) with a long list of geysers, beside four outer moonlets (Tundra, Marshy, Niobium, Moo).
# Its code adds the world's name and description strings (Db.Initialize).
# How a player reaches it: the main menu, New Game, Survival, the event category; the carousel
# lists Fuleria (coordinate prefix FULC-PHO).
# What changes: the cluster a new game generates.
#
# From a colony: Main Menu, Quit Without Saving, New Game, Survival, the event category; the
# cluster chosen by typing its coordinate (fixed seed), launched and embarked. Functional
# expectations (mod-play-testing.md, "Worldgen mods"): its five worlds, the start world's size,
# its biomes (sixteen kinds), geysers among the spawners, starmap POIs.
from: early-base
mods: [1794510050]
memory_gb: 8
steps:
  - key: {code: Escape}
  - ui_wait: {path: "**/PauseScreen/**/Main MenuButton", cond: stable}
  - click: {ui: "**/PauseScreen/**/Main MenuButton"}
  - ui_wait: {path: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton", cond: stable}
  - click: {ui: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton"}   # Quit Without Saving
  - ui_wait: {path: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons", cond: stable, frames: 3000}
  - click: {text: "NEW GAME", under: "**/MainMenuButtons"}
  - ui_wait: {path: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame", cond: stable}
  - click: {ui: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame"}
  - ui_wait: {path: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/EventGame", cond: stable}
  - click: {ui: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/EventGame"}
  - ui_wait: {path: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton", cond: stable, frames: 3000}
  - expect_state:
      "all:DestinationSelectPanel::[0].clusterKeys": {contains: "expansion1::clusters/FuleriaDLC"}
  - click: {ui: "**/CoordinateContainer/SeedInput"}
  - ui_wait: {path: "**/CoordinateContainer/SeedInput", cond: stable}
  - type: {ui: "**/CoordinateContainer/SeedInput", text: "FULC-PHO-12345-0-0-0", clear: true, enter: true}
  - ui_wait: {path: "**/Section - Destination/DestinationDetailsHeader/ClusterName", cond: text, value: "~Fuleria"}
  - expect_ui:
      "**/CoordinateContainer/SeedInput/Text Area/Text": {text: "~FULC-PHO-12345-0-0-0"}
      "**/StartingAsteroidCategory/Content/Prefab_AsteroidLine/Label": {text: "Fuleria"}
  - expect_state:
      "CustomGameSettings.Instance.GetCurrentQualitySetting(\"ClusterLayout\").id": "expansion1::clusters/FuleriaDLC"
  - ui_dump: {name: asteroids, root: "**/Section - Destination/World Scoll (Rect Size Set By Screen Code!)/Content/Details"}
  - click: {ui: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton"}
  # Worldgen runs on its own thread; the Duplicant selection follows once the world is loaded.
  - ui_wait: {path: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton", cond: stable, frames: 60000}
  - click: {ui: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton"}
  - ui_wait: {path: "**/MinionSelectScreen", cond: gone, frames: 6000}
  - expect_state:
      "ClusterManager.Instance.WorldContainers.Count": 5
      "ClusterManager.Instance.GetStartWorld().worldName": "expansion1::worlds/FuleriaDLC"
      "ClusterManager.Instance.GetStartWorld().worldSize.x": 260
      "ClusterManager.Instance.GetStartWorld().worldSize.y": 380
      "Components.LiveMinionIdentities.Count": 3
      # Every biome on one asteroid.
      "ClusterManager.Instance.GetStartWorld().Biomes.Count": ">= 15"
      "ClusterManager.Instance.GetStartWorld().WorldTraitIds.Count": ">= 1"
      "count:SaveGame.Instance.worldGenSpawner.spawnables[*] if .spawnInfo.id.StartsWith(\"GeyserGeneric\") == true": ">= 8"
      "all:TemporalTear::Length": 1
      "all:HarvestablePOIClusterGridEntity::Length": ">= 20"
  - expect_state:
      "ClusterManager.Instance.GetStartWorld().Biomes": {contains: wasteland}
  - expect_state:
      "ClusterManager.Instance.GetStartWorld().Biomes": {contains: aquatic}
  - expect_state:
      "ClusterManager.Instance.GetStartWorld().Biomes": {contains: radioactive}

# Heliconia - The Thermal Runaway (3663491695), class O,M (worldgen).
#
# What it does: adds the Heliconia clusters, hot worlds of its own biomes (forest, marsh,
# barren, desert, jungle, frozen and more), subworlds, features and templates: a base-game
# world (HCA-TG-B), a classic-style Spaced Out cluster (HCA-TG-C, HeliconiaClassic 240x380 and
# seven moonlets) and a Spaced Out one (HCA-TG-S, HeliconiaMoonlet 160x274, a landing site,
# a warp target and six moonlets). PLib options choose its shelter and critter-cave templates
# (patched into each world's template rules as MutatedWorldData is made), a temperature mode
# and an instant temperature balance after worldgen.
# How a player reaches it: New Game, the Spaced Out category, its cluster in the carousel.
# What changes: new worlds.
#
# From early-base, a new Spaced Out game at HCA-TG-S-12345-0-0-0: the screen picks the
# Heliconia cluster; generated and embarked, the start world is HeliconiaMoonlet, 160x274,
# with the cluster's nine worlds.
from: early-base
mods: [3663491695]
memory_gb: 8
steps:
  - key: {code: Escape}
  - ui_wait: {path: "**/PauseScreen/**/Main MenuButton", cond: stable}
  - click: {ui: "**/PauseScreen/**/Main MenuButton"}
  - ui_wait: {path: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton", cond: stable}
  - click: {ui: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton"}   # Quit Without Saving
  - ui_wait: {path: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons", cond: stable, frames: 3000}
  - click: {text: "NEW GAME", under: "**/MainMenuButtons"}
  - ui_wait: {path: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame", cond: stable}
  - click: {ui: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame"}
  - ui_wait: {path: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/SpacedOutGame", cond: stable}
  - click: {ui: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/SpacedOutGame"}
  - ui_wait: {path: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton", cond: stable, frames: 3000}
  - expect_state:
      "all:DestinationSelectPanel::[0].clusterKeys": {contains: "expansion1::clusters/HeliconiaMiniCluster"}
  - click: {ui: "**/CoordinateContainer/SeedInput"}
  - ui_wait: {path: "**/CoordinateContainer/SeedInput", cond: stable}
  - type: {ui: "**/CoordinateContainer/SeedInput", text: "HCA-TG-S-12345-0-0-0", clear: true, enter: true}
  - ui_wait: {path: "**/Section - Destination/DestinationDetailsHeader/ClusterName", cond: text, value: "~Heliconia"}
  - expect_state:
      "CustomGameSettings.Instance.GetCurrentQualitySetting(\"ClusterLayout\").id": "expansion1::clusters/HeliconiaMiniCluster"
  - ui_dump: {name: asteroids, root: "**/Section - Destination/World Scoll (Rect Size Set By Screen Code!)/Content/Details"}
  - click: {ui: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton"}
  - ui_wait: {path: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton", cond: stable, frames: 60000}
  - click: {ui: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton"}
  - ui_wait: {path: "**/MinionSelectScreen", cond: gone, frames: 6000}
  - expect_state:
      "ClusterManager.Instance.WorldContainers.Count": 9
      "ClusterManager.Instance.GetStartWorld().worldName": "expansion1::worlds/HeliconiaMoonlet"
      "ClusterManager.Instance.GetStartWorld().worldSize.x": 160
      "ClusterManager.Instance.GetStartWorld().worldSize.y": 274
      "Components.LiveMinionIdentities.Count": 3
      "count:ClusterManager.Instance.GetStartWorld().m_generatedSubworlds[*] if .StartsWith(\"subworlds/Heliconia/\") == true": ">= 3"

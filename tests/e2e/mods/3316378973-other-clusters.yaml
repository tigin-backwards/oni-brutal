# Other Clusters (3316378973), class W (worldgen only, no assembly).
#
# What it does: four Spaced Out clusters, one per start (Terra, Forest, Swamp, Ceres), whose
# worlds are variants of the game's (TerraMoonletDoModa and others: different subworlds,
# templates and geysers here and there, such as leaky oil and big volcano templates), listed
# in the Spaced Out cluster category.
# How a player reaches it: New Game, Survival, Spaced Out, then the cluster's coordinate.
# What changes: new cluster layouts.
#
# From early-base: back to the main menu, New Game, Survival, Spaced Out; the carousel offers
# the four clusters. The Terra variant's coordinate (SNDST-N78) and a fixed seed select it; the
# asteroid list is dumped, and the launched cluster has the mod's worlds, its start world the
# mod's Terra moonlet at the game's size, with its Temporal Tear and geysers (checked
# functionally, mod-play-testing.md's "Worldgen mods").
from: early-base
mods: [3316378973]
memory_gb: 8
steps:
  - key: {code: Escape}
  - ui_wait: {path: "**/PauseScreen/**/Main MenuButton", cond: stable}
  - click: {ui: "**/PauseScreen/**/Main MenuButton"}
  - ui_wait: {path: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton", cond: stable}
  - click: {ui: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton"}   # Quit Without Saving
  - ui_wait: {path: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons", cond: stable, frames: 3000}
  - click: {text: "NEW GAME", under: "**/MainMenuButtons"}
  - ui_wait: {path: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame", cond: stable}
  - click: {ui: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame"}
  - ui_wait: {path: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/SpacedOutGame", cond: stable}
  - click: {ui: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/SpacedOutGame"}
  - ui_wait: {path: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton", cond: stable, frames: 3000}
  # The carousel offers the mod's four clusters.
  - expect_state:
      "all:DestinationSelectPanel::[0].clusterKeys": {contains: clusters/SandstoneStartClusterDoModa}
      "count:all:DestinationSelectPanel::[0].clusterKeys[*] if .EndsWith(\"DoModa\") == true": 4
  - click: {ui: "**/CoordinateContainer/SeedInput"}
  - ui_wait: {path: "**/CoordinateContainer/SeedInput", cond: stable}
  - type: {ui: "**/CoordinateContainer/SeedInput", text: "SNDST-N78-12345-0-0-0", clear: true, enter: true}
  - ui_wait: {path: "**/Section - Destination/DestinationDetailsHeader/ClusterName", cond: text, value: "~Cluster"}
  - expect_ui:
      "**/CoordinateContainer/SeedInput/Text Area/Text": {text: "~SNDST-N78-12345-0-0-0"}
  - expect_state:
      "CustomGameSettings.Instance.GetCurrentQualitySetting(\"ClusterLayout\").id": clusters/SandstoneStartClusterDoModa
  - ui_dump: {name: asteroids, root: "**/Section - Destination/World Scoll (Rect Size Set By Screen Code!)/Content/Details"}
  - click: {ui: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton"}
  # Worldgen runs on its own thread; the Duplicant selection follows once the world is loaded.
  - ui_wait: {path: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton", cond: stable, frames: 60000}
  - click: {ui: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton"}
  - ui_wait: {path: "**/MinionSelectScreen", cond: gone, frames: 6000}
  - expect_state:
      "ClusterManager.Instance.WorldContainers.Count": [">= 8", "== original"]
      "ClusterManager.Instance.GetStartWorld().worldName": worlds/TerraMoonletDoModa
      "ClusterManager.Instance.GetStartWorld().worldSize.x": 160
      "ClusterManager.Instance.GetStartWorld().worldSize.y": 274
      "Components.LiveMinionIdentities.Count": 3
      "count:ClusterManager.Instance.WorldContainers[*] if .worldName.EndsWith(\"DoModa\") == true": [">= 4", "== original"]
      "ClusterManager.Instance.GetStartWorld().Biomes": "== original"
      "ClusterManager.Instance.GetStartWorld().m_generatedSubworlds": {contains: "expansion1::subworlds/sandstone/SandstoneStart"}
      "all:TemporalTear::Length": 1
      "count:SaveGame.Instance.worldGenSpawner.spawnables[*] if .spawnInfo.id.StartsWith(\"GeyserGeneric\") == true": ">= 2"

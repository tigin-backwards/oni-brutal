# 医废桶 Medical Waste Bucket (3038102790), class B.
#
# What it does: adds the Medical Waste Bucket (MM20230919GG1, 1x1, raw minerals, Medicine
# menu): a 10 kg storage locker for medical supplies and medicine whose contents are deleted
# every second (CC1MM20230919GG1, an ISim1000ms).
# How a player reaches it: the Medicine menu.
# What changes: unwanted medicine has somewhere to go.
#
# A bucket is built by setup in the corridor west of the printing pod and a Curative Tablet
# stored in it. The Medicine menu offers the bucket (its card); after a few seconds the tablet
# is gone.
from: early-base
mods: [3038102790]
setup:
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"MM20230919GG1\")", method: Build, args: [{"$": "Grid.XYToCell(112, 206)"}, Neutral, null, [SandStone], 293.15, DEFAULT_FACADE]}}
  - driver: {ui.wait: {path: "**/E2eNothing", cond: gone, frames: 5}}
  - driver: {setup.call: {type: Scenario, method: SpawnPrefab, args: [131762, 0, 0, BasicCure, Ore]}}
  - driver: {setup.call: {target: "last:", method: SetActive, args: [true]}}
  - driver: {setup.call: {target: "all:StorageLocker::[0].GetComponent<Storage>", method: Store, args: [{"$": "last:"}, true, false, true, false]}}
steps:
  - expect_state:
      "Assets.GetBuildingDef(\"MM20230919GG1\").BaseDecor": 1
      "Assets.GetPrefab(\"MM20230919GG1\").GetComponent<Storage>.capacityKg": 10
      "Assets.GetPrefab(\"MM20230919GG1\").GetComponent<Storage>.storageFilters": [{contains: MedicalSupplies}, {contains: Medicine}]
      "all:StorageLocker::[0].GetComponent<Storage>.items.Count": 1
  - run: {seconds: 4}
  - expect_state:
      "all:StorageLocker::[0].GetComponent<Storage>.items.Count": 0
  - driver: {camera.set: {cell: [113, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Medicine"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/MM20230919GG1 Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/MM20230919GG1 Group*"}
  - ui_wait: {path: "**/ProductInfoScreen", cond: stable}
  - shot: {name: product, crop: "**/ProductInfoScreen", threshold: 0.04}

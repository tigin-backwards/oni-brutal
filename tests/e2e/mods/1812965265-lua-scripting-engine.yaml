# Lua Scripting Engine (1812965265), classes B, S, M (a library).
#
# What it does: a MoonSharp Lua runtime for other mods: at start-up it looks in every enabled
# mod for a LuaEntryPoint.dll and its scripts, which can add buildings (a generic building
# config), new-game settings, world edits and hooks on the main menu, save load and Game
# updates. On its own it runs no script; one patch always applies: MaterialSelector's
# AllowInsufficientMaterialBuild holds, so blueprints can be placed without enough material.
# How a player reaches it: mods that ship Lua scripts; any build menu card.
# What changes: alone, building with too little material is allowed.
#
# The mod is enabled and its patch holds while the game's own setting is off. The Base menu's
# Tile card (its material selector) is shot, and the colony runs.
from: early-base
mods: [1812965265]
steps:
  - expect_state:
      "count:Global.Instance.modManager.mods[*] if .staticID == RainbowLuaScriptingEngine and .IsEnabledForActiveDlc() == true": 1
      "GenericGameSettings.instance.allowInsufficientMaterialBuild": false
      "MaterialSelector.AllowInsufficientMaterialBuild()": true
  - run: {seconds: 3}
  - driver: {camera.set: {cell: [113, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Base"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/Tile Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/Tile Group*"}
  - ui_wait: {path: "**/ProductInfoScreen", cond: stable}
  - shot: {name: product, crop: "**/ProductInfoScreen", threshold: 0.04}
  - key: {code: Escape}
  - run: {seconds: 20}
  - expect: {duplicants: 3}

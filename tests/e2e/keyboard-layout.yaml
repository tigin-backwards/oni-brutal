# Keyboard layouts (issue #24): which key codes a French (AZERTY) layout gives each physical
# key. The lane's Xvfb gets the fr layout (setxkbmap); each step presses one key by its X
# keycode (evdev numbering) and checks what E2eDriver's key log saw: the key codes
# Input.GetKeyDown was true for, the key codes of IMGUI KeyDown events and the characters
# typed, against the original's. The comment on each key is its US and its fr label.
from: main-menu
keyboard: fr
setup:
  - driver: {keys.log: {}}
steps:
  # 49: US grave, fr twosuperior
  # Characters not compared: the original types none on a key without a key code, ours
  # types the layout's (GLFW's character callback), as a French player expects.
  - key: {keycode: 49}
  - expect_state:
      "type:E2eDriver.KeyLog::Down": [{equals: ""}, "== original"]
      "type:E2eDriver.KeyLog::Events": [{equals: ""}, "== original"]
  - driver: {keys.log: {}}
  # 10: US 1, fr &
  - key: {keycode: 10}
  - expect_state:
      "type:E2eDriver.KeyLog::Down": [{equals: "Alpha1"}, "== original"]
      "type:E2eDriver.KeyLog::Events": [{equals: "Alpha1"}, "== original"]
      "type:E2eDriver.KeyLog::Chars": [{equals: "&"}, "== original"]
  - driver: {keys.log: {}}

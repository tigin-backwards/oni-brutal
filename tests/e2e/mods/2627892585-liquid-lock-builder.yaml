# Liquid Lock Builder (2627892585), class B.
#
# What it does: adds the Liquid Lock Builder to the Utilities menu, researched with Improved
# Liquid Piping: a 1x3 raw-mineral building whose side screen picks liquids; Duplicants bring
# 35 g of the heaviest one picked, which it pours beside its top, then unpicks it, so a
# liquid lock is built a few grams at a time.
# How a player reaches it: the build menu (Utilities), after the research; its filter side
# screen.
# What changes: liquid locks without bottling by hand.
#
# setup researches Improved Liquid Piping; the Utilities menu lists the builder, one is
# ordered and built in the dug-out corridor west of the printing pod, and its side screen
# lists the liquids to pick.
from: early-base
mods: [2627892585]
setup:
  - driver: {setup.call: {target: "Research.Instance", method: SetActiveResearch, args: [{"$": "Db.Get().Techs.Get(\"ImprovedLiquidPiping\")"}, true]}}
  - driver: {setup.call: {target: "Research.Instance", method: CompleteQueue}}
steps:
  - expect_state:
      "Db.Get().Techs.Get(\"ImprovedLiquidPiping\").unlockedItemIDs": {contains: LiquidLockBuilder}
      "Assets.GetPrefab(\"LiquidLockBuilder\").GetComponent<Storage>": exists
  - run: {seconds: 10}
  - click: {ui: "**/PlanScreen/Toggle:Utilities"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/LiquidLockBuilder Group*", cond: stable}
  - shot: {name: utilities-menu, crop: "**/PlanBuildingSelectionPanel/BuildingGroups", threshold: 0.04}
  - driver: {camera.set: {cell: [112, 208], ortho: 8}}
  - click: {ui: "**/BuildingGroups/**/Grid/LiquidLockBuilder Group*"}
  - ui_wait: {path: "**/PlanBuildingSelectionPanel/ProductInfoScreen", cond: stable}
  - click_world: {cell: [112, 206]}
  - key: {code: Escape}
  - expect: {blueprints: {LiquidLockBuilder: 1}}
  - run: {seconds: 900, until: {buildings: {LiquidLockBuilder: 1}, pending_construction: 0}}
  - driver: {camera.set: {cell: [112, 208], ortho: 8}}
  - click_world: {cell: [112, 207], select: LiquidLockBuilder}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - ui_wait: {path: "**/DetailsScreen/SideScreen/**/TreeFilterableSideScreen", cond: stable}
  - expect_ui:
      "**/DetailsScreen/TitleBar/Border/LabelGroup/Label": {text: "~Liquid Lock Builder"}

# Exponential Smart Battery 指数级智能电池 (2845739096), class B.
#
# What it does: adds a smart battery to the Power menu (ExponentialBatterySmart, researched
# with Advanced Power Regulation): the game's 2x2 smart battery, of refined metal, that holds
# 3.4e38 J, loses nothing and overheats only at 2500 C. Its automation port reports its charge
# as the game's smart battery does.
# How a player reaches it: the build menu (Power).
# What changes: a battery that never fills.
#
# setup grants Advanced Power Regulation and spawns 400 kg of copper (early-base has no refined
# metal). The battery is ordered in the dug-out corridor west of the printing pod and built
# (a tech granted in setup does not reach the open build menu); selected, its capacity is
# beyond 1e38 J and it leaks nothing.
from: early-base
mods: [2845739096]
setup:
  - driver: {setup.call: {target: "Research.Instance.GetTechInstance(\"AdvancedPowerRegulation\")", method: Purchased}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"Copper\").substance", method: SpawnResource, args: [[114.5, 207.5, -12], 400, 300, 255, 0]}}
steps:
  - expect_state:
      "Db.Get().Techs.Get(\"AdvancedPowerRegulation\").unlockedItemIDs": {contains: ExponentialBatterySmart}
      "Assets.GetBuildingDef(\"ExponentialBatterySmart\").OverheatTemperature": "> 2773"
  - build: {prefab: ExponentialBatterySmart, material: Copper, at: [113, 206]}
  - expect: {blueprints: {ExponentialBatterySmart: 1}}
  - run: {seconds: 900, until: {buildings: {ExponentialBatterySmart: 1}, pending_construction: 0}}
  - driver: {camera.set: {cell: [114, 208], ortho: 10}}
  - click_world: {cell: [113, 206], select: ExponentialBatterySmart}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - expect_ui:
      "**/DetailsScreen/TitleBar/Border/LabelGroup/Label": {text: "~指数级智能电池"}
  - expect_state:
      "selected:BatterySmart.capacity": "> 1e38"
      "selected:BatterySmart.joulesLostPerSecond": 0
      "selected:PrimaryElement.ElementID": Copper

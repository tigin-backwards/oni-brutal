# Self-sealing Airlocks (1735550356).
#
# What it does: makes doors block gases and liquids.
# How a player reaches it: doors, as built.
#
# Broken upstream: Its Workshop build has no mod_info.yaml, which the game requires since 2021: KMod logs
# "Is missing a mod_info.yaml file and will not be loaded" and leaves it out.
# The spec checks that it is enabled, then runs the colony.
from: early-base
mods: [1735550356]
steps:
  - expect_state:
      "count:Global.Instance.modManager.mods[*] if .label.id == 1735550356 and .IsEnabledForActiveDlc() == true": 1
  - run: {seconds: 30}
  - expect: {duplicants: 3}

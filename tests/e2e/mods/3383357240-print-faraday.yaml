# Print Faraday (3383357240), class X (content for Dupery).
#
# What it does: no code. With Dupery (here Dupery Fixed, 3172734005, which its description
# requires), its PERSONALITIES.json adds a printable bionic Duplicant personality, Faraday
# (male, Stress Shocker stress reaction, Data Rainer joy trait), whose eyes, eyes_faraday, come
# from the mod's anim folder.
# How a player reaches it: Duplicants printed or picked for a new colony; the Duplicant's
# Personality tab.
# What changes: another personality in the pool, with its own eyes.
#
# Dupery imports the personality into the game's Personalities and loads the eyes as an
# accessory.
from: early-base
mods: [3172734005, 3383357240]
require_log: ['\[Dupery\]: accessory eyes_faraday successfully loaded']
steps:
  - expect_state:
      "Db.Get().Personalities.TryGet(\"FARADAY\")": exists
      "Db.Get().Personalities.TryGet(\"FARADAY\").Disabled": false
      "Db.Get().Accessories.TryGet(\"eyes_faraday\")": exists
      "Db.Get().Personalities.Count": "== original"
  - run: {seconds: 10}
  - expect: {duplicants: 3}

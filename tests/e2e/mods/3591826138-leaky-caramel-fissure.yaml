# Custom Geysers - Leaky Caramel Fissure (3591826138), class P (a worldgen mod).
#
# What it does: a new generic geyser, the Leaky Caramel Fissure (GeyserGeneric_sucrose_drip,
# 4 x 2): a GeyserGenericConfig.GenerateConfigs postfix adds its type (liquid sucrose at
# 473.15 K, 125 to 375 kg a cycle, a maximum pressure of 50 kg), generic so that worldgen may
# roll it wherever a random geyser goes; a Geotuner postfix gives it tuning settings; its name
# and description are added to the strings, and a template places one.
# How a player reaches it: a new world's random geysers, or the sandbox spawner.
# What changes: one more kind of geyser.
#
# Functional expectations (mod-play-testing.md, "Worldgen mods"): its prefab is registered
# beside the random geyser spawner's, and one placed in the dug-out corridor west of the
# printing pod is selected: its name, its element, its rolled rate within the type's range.
from: early-base
mods: [3591826138]
setup:
  - driver: {setup.call: {target: "Scenario.SpawnPrefab(131124, 0, 0, \"GeyserGeneric_sucrose_drip\", \"BuildingBack\")", method: SetActive, args: [true]}}
steps:
  - expect_state:
      "Assets.GetPrefab(\"GeyserGeneric_sucrose_drip\")": exists
      "Assets.GetPrefab(\"GeyserGeneric\")": exists
  - driver: {camera.set: {cell: [110, 208], ortho: 8}}
  - click_world: {cell: [108, 206], select: GeyserGeneric_sucrose_drip}
  - ui_wait: {path: "**/DetailsScreen/TitleBar", cond: stable}
  - expect_ui:
      "**/DetailsScreen/TitleBar/Border/LabelGroup/Label": {text: "~Leaky Caramel Fissure"}
  - expect_state:
      "selected:Geyser.configuration.GetElement()": "== 'MoltenSucrose'"
      "selected:Geyser.configuration.GetTemperature()": [">= 473.14", "<= 473.16"]
      "selected:Geyser.configuration.GetMaxPressure()": 50
      "selected:Geyser.configuration.scaledRate": [">= 125", "<= 375"]
  # Rolled from the world seed and the cell, as in the original: to a float's last bits, which
  # Mono's double-precision intermediates set (ARCHITECTURE D25).
  - expect_state:
      "selected:Geyser.configuration.scaledRate": [">= 0.99999 * original", "<= 1.00001 * original"]

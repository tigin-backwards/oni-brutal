# Basic 3 Worlds (3003736085), class M (worldgen).
#
# What it does: adds three Spaced Out clusters in the special category, each starting from the
# basic base: Vortex (coordinate prefix Vortex, a 380x380 classic-style start asteroid of
# forest, sandstone, marsh, jungle, ocean, magma, oil and wasteland subworlds with a space
# surface), Inferno and WaterWorld (both with a flipped inferno warp asteroid), with the
# game's mini asteroids and moonlets; a Db.Initialize postfix adds their names and
# descriptions and an Iron Depth element name.
# How a player reaches it: New Game, the special category's carousel.
# What changes: three more clusters to start on.
#
# From early-base the game is quit to the main menu and a new Survival game started in the
# special category; the coordinate Vortex-12345-0-0-0 picks the Vortex cluster. Its asteroid
# list is compared with the original's; it generates, the Duplicants embark, and the start
# world is the mod's, 380 by 380, with its forest start and wasteland subworlds.
from: early-base
mods: [3003736085]
memory_gb: 11
steps:
  - key: {code: Escape}
  - ui_wait: {path: "**/PauseScreen/**/Main MenuButton", cond: stable}
  - click: {ui: "**/PauseScreen/**/Main MenuButton"}
  - ui_wait: {path: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton", cond: stable}
  - click: {ui: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton"}   # Quit Without Saving
  - ui_wait: {path: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons", cond: stable, frames: 3000}
  - click: {text: "NEW GAME", under: "**/MainMenuButtons"}
  - ui_wait: {path: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame", cond: stable}
  - click: {ui: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame"}
  - ui_wait: {path: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/EventGame", cond: stable}
  - click: {ui: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/EventGame"}
  - ui_wait: {path: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton", cond: stable, frames: 3000}
  - expect_state:
      "count:all:DestinationSelectPanel::[0].clusterKeys[*] if .EndsWith(\"clusters/vortex\") == true": 1
      "count:all:DestinationSelectPanel::[0].clusterKeys[*] if .EndsWith(\"clusters/Inferno\") == true": 1
  - click: {ui: "**/CoordinateContainer/SeedInput"}
  - ui_wait: {path: "**/CoordinateContainer/SeedInput", cond: stable}
  - type: {ui: "**/CoordinateContainer/SeedInput", text: "Vortex-12345-0-0-0", clear: true, enter: true}
  - ui_wait: {path: "**/Section - Destination/DestinationDetailsHeader/ClusterName", cond: text, value: "~Vortex"}
  - ui_dump: {name: asteroids, root: "**/Section - Destination/World Scoll (Rect Size Set By Screen Code!)/Content/Details"}
  - click: {ui: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton"}
  - ui_wait: {path: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton", cond: stable, frames: 60000}
  - click: {ui: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton"}
  - ui_wait: {path: "**/MinionSelectScreen", cond: gone, frames: 6000}
  - expect_state:
      "ClusterManager.Instance.GetStartWorld().worldName.EndsWith(\"worlds/vortex\")": true
      "ClusterManager.Instance.GetStartWorld().worldSize.x": 380
      "ClusterManager.Instance.GetStartWorld().worldSize.y": 380
      "ClusterManager.Instance.WorldContainers.Count": ">= 8"
      "Components.LiveMinionIdentities.Count": 3
      "all:TemporalTear::Length": 1
  - expect_state:
      "ClusterManager.Instance.GetStartWorld().m_generatedSubworlds": {contains: subworlds/forest/ForestStart}
      "count:ClusterManager.Instance.GetStartWorld().m_generatedSubworlds[*] if .StartsWith(\"expansion1::subworlds/wasteland\") == true": ">= 1"

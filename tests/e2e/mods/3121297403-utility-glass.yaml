# Utility Glass (3121297403), class B.
#
# What it does: adds two glass buildings to the Base menu: the Window Wall
# (UG_ExteriorGlassWall, a 1x1 backwall of glass after the Drywall, researched with Glass
# Blowing: it keeps gas and liquid in, lets light through and adds decor) and the Reinforced
# Window Tile (ug_reinforcedglass, glass and steel after the Bunker Tile, researched with
# Superheated Forging: a transparent bunker-strength tile).
# How a player reaches it: the build menu (Base).
# What changes: see-through walls and tiles.
#
# setup grants Glass Blowing and spawns glass. The Window Wall is built behind the dug-out
# corridor west of the printing pod and selected.
from: early-base
mods: [3121297403]
setup:
  - driver: {setup.call: {target: "Research.Instance", method: SetActiveResearch, args: [{"$": "Db.Get().Techs.Get(\"GlassFurnishings\")"}, true]}}
  - driver: {setup.call: {target: "Research.Instance", method: CompleteQueue}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"Glass\").substance", method: SpawnResource, args: [[114.5, 207.5, -12], 300, 300, 255, 0]}}
steps:
  - expect_state:
      "Db.Get().Techs.Get(\"GlassFurnishings\").unlockedItemIDs": {contains: UG_ExteriorGlassWall}
      "Db.Get().Techs.Get(\"HighTempForging\").unlockedItemIDs": {contains: ug_reinforcedglass}
  - build: {prefab: UG_ExteriorGlassWall, at: [113, 208]}
  - expect: {blueprints: {UG_ExteriorGlassWall: 1}}
  - run: {seconds: 900, until: {buildings: {UG_ExteriorGlassWall: 1}, pending_construction: 0}}
  - driver: {camera.set: {cell: [113, 208], ortho: 8}}
  - click_world: {cell: [113, 208], select: UG_ExteriorGlassWall}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - expect_state:
      "selected:GetComponent<KPrefabID>.PrefabTag.Name": UG_ExteriorGlassWall
      "selected:GetComponent<PrimaryElement>.ElementID": Glass
  - expect_ui:
      "**/DetailsScreen/TitleBar/Border/LabelGroup/Label": {text: "~Window Wall"}
  - shot: {name: title, crop: "**/DetailsScreen/TitleBar", threshold: 0.04}

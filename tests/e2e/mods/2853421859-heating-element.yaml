# HeatingElement (2853421859), classes B, O.
#
# What it does: adds the Heating Element (HeatingElement, 1x1, refined metal), a powered
# building for the Utilities menu unlocked by Temperature Modulation: while powered it draws
# 2000 W and gives off 4179 kW of heat (PLib options set both).
# How a player reaches it: research Temperature Modulation; the Utilities menu.
# What changes: a strong electric heater.
#
# Temperature Modulation is researched in setup and a Heating Element built in the east
# corridor. The Utilities menu offers it (its card is shot); the def and the built one carry
# the default wattage and heat.
from: early-base
mods: [2853421859]
setup:
  - driver: {setup.call: {target: "Research.Instance", method: SetActiveResearch, args: [{"$": "Db.Get().Techs.Get(\"TemperatureModulation\")"}, true]}}
  - driver: {setup.call: {target: "Research.Instance", method: CompleteQueue}}
  - driver: {setup.call: {target: "Game.Instance", method: Trigger, args: [-107300940]}}
  - driver: {setup.call: {target: "PlanScreen.Instance._researchedDefs", method: Clear}}
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"HeatingElement\")", method: Build, args: [131786, Neutral, null, [Copper], 293.15, DEFAULT_FACADE]}}
steps:
  - expect_state:
      "Db.Get().Techs.Get(\"TemperatureModulation\").unlockedItemIDs": {contains: HeatingElement}
      "Assets.GetBuildingDef(\"HeatingElement\").EnergyConsumptionWhenActive": 2000
      "Assets.GetBuildingDef(\"HeatingElement\").SelfHeatKilowattsWhenActive": 4179
      "Assets.GetBuildingDef(\"HeatingElement\").RequiresPowerInput": true
  - run: {seconds: 3}
  - expect: {buildings: {HeatingElement: 1}}
  - driver: {camera.set: {cell: [113, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Utilities"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/HeatingElement Group*", cond: stable}
  - scroll: {at: "**/PlanBuildingSelectionPanel/BuildingGroups", notches: -10}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/HeatingElement Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/HeatingElement Group*"}
  - ui_wait: {path: "**/ProductInfoScreen", cond: stable}
  - shot: {name: product, crop: "**/ProductInfoScreen", threshold: 0.04}

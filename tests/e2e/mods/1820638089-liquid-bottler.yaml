# Liquid Bottler (1820638089), class B.
#
# What it does: adds the Liquid Bottler (LIQUIDBOTTLER, 3x2, 400 kg of metal, in the Plumbing
# menu, researched with Improved Liquid Piping): liquid piped into it is stored (350 kg,
# sealed) and bottled for Duplicants to carry away, like the Canister Filler for gas. Its user menu button turns auto-drop on or off: with it on, a full bottler
# drops its contents on the floor.
# How a player reaches it: the build menu (Plumbing), after the research; its user menu.
# What changes: liquids can be bottled from a pipe.
#
# Broken upstream: the game now has its own Bottle Filler, LiquidBottler, and both codex
# entries take the key LIQUIDBOTTLER. Loading early-base, the original logs "An item with the
# same key has already been added. Key: LIQUIDBOTTLER" from CodexCache.AddEntry under
# ManagementMenu.OnPrefabInit, and the crash screen covers the game before any step.
#
# setup grants the research. The bottler is built in the dug-out corridor west of the
# printing pod from the base's metal ore; once built it is selected, and its user menu button
# turns auto-drop on.
from: early-base
mods: [1820638089]
setup:
  - driver: {setup.call: {target: "Research.Instance", method: SetActiveResearch, args: [{"$": "Db.Get().Techs.Get(\"ImprovedLiquidPiping\")"}, true]}}
  - driver: {setup.call: {target: "Research.Instance", method: CompleteQueue}}
steps:
  - expect_state:
      "Db.Get().Techs.Get(\"ImprovedLiquidPiping\").unlockedItemIDs": {contains: LIQUIDBOTTLER}
  - build: {prefab: LIQUIDBOTTLER, at: [114, 206], material: Cuprite}
  - expect: {blueprints: {LIQUIDBOTTLER: 1}}
  - run: {seconds: 900, until: {buildings: {LIQUIDBOTTLER: 1}, pending_construction: 0}}
  - driver: {camera.set: {cell: [114, 208], ortho: 8}}
  - click_world: {cell: [114, 206], select: LIQUIDBOTTLER}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - expect_state:
      "selected:Storage.capacityKg": 350
      "selected:ConduitConsumer.conduitType": Liquid
      "selected:GetComponent<LiquidBottler.LiquidBottler>.dropWhenFull": false

# Mineral Processing - Metallurgy (1970894610), classes B, O.
#
# What it does: adds refining buildings to the Refining menu, each in a vanilla tech: the
# Pyrolysis Kiln (Basic Refinement: 1x2, metal ore, no power) cooks wood into coal (1 kg/s of
# wood into 0.33 kg/s of coal and 0.1 kg/s of carbon dioxide, dropping coal in 20 kg lumps), a
# jaw crusher and a ball mill, a soil mixer, an advanced kiln and metal refinery, a glass
# foundry, a plasma furnace and a basic oil refinery. A PLib options menu toggles parts.
# How a player reaches it: the build menu (Refining), after research.
# What changes: new refining chains.
#
# setup grants Basic Refinement and spawns metal ore and 200 kg of wood. The Pyrolysis Kiln is
# picked in the build menu, placed in the dug-out corridor west of the printing pod, built, and
# left to work: Duplicants fill it with the wood and it drops coal.
from: early-base
mods: [1970894610]
setup:
  - driver: {setup.call: {target: "Research.Instance.GetTechInstance(\"BasicRefinement\")", method: Purchased}}
  # The build menu shows a category once one of its buildings is researched, as it learns.
  - driver: {setup.call: {target: "Game.Instance", method: Trigger, args: [-107300940]}}
  - driver: {setup.call: {target: "PlanScreen.Instance._researchedDefs", method: Clear}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"Cuprite\").substance", method: SpawnResource, args: [[109.5, 206.5, -12], 300, 300, 255, 0]}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"WoodLog\").substance", method: SpawnResource, args: [[110.5, 206.5, -12], 200, 300, 255, 0]}}
steps:
  - expect_state:
      "sum:all:Pickupable::[*].GetComponent<PrimaryElement>.Mass if .GetComponent<PrimaryElement>.ElementID == Carbon": {save_as: coal}
  - run: {seconds: 5}
  - driver: {camera.set: {cell: [113, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Refinement"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/Metallurgy_PyrolysisKiln Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/Metallurgy_PyrolysisKiln Group*"}
  - ui_wait: {path: "**/ProductInfoScreen", cond: stable}
  - shot: {name: product, crop: "**/ProductInfoScreen", threshold: 0.04}
  - click_world: {cell: [114, 206]}
  - key: {code: Escape}
  - expect: {blueprints: {Metallurgy_PyrolysisKiln: 1}}
  - run: {seconds: 1200, until: {buildings: {Metallurgy_PyrolysisKiln: 1}, pending_construction: 0}}
  - driver: {camera.set: {cell: [114, 207], ortho: 8}}
  - click_world: {cell: [114, 206], select: Metallurgy_PyrolysisKiln}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - expect_ui:
      "**/DetailsScreen/TitleBar/Border/LabelGroup/Label": {text: "~Pyrolysis Kiln"}
  - shot: {name: details, crop: "**/DetailsScreen", threshold: 0.04}
  - key: {code: Escape}
  - run: {seconds: 600}
  - expect_state:
      "sum:all:Pickupable::[*].GetComponent<PrimaryElement>.Mass if .GetComponent<PrimaryElement>.ElementID == Carbon": ">= coal + 20"

# The Golden Throne (Buffed gold lavatories) (2787598894), classes O, V.
#
# What it does: a Lavatory (FlushToilet) built of a precious metal (gold amalgam, gold, fool's
# gold, platinum: PLib options) gets a golden animation (a prefix on FlushToilet.OnSpawn swaps
# in gold_flush_kanim) and a "Golden Throne" facade; a Duplicant using it is "Too
# Comfortable" (slower), then "Royally Relieved" for a while (decor and morale bonus, a crown
# and gold sparkles).
# How a player reaches it: the build menu (Plumbing, Sanitation Sciences), with gold amalgam
# picked as the material; the Mods screen's options.
# What changes: the Lavatory's look, and its users' effects.
#
# setup grants Sanitation Sciences and spawns gold amalgam. A Lavatory of gold amalgam is built
# unplumbed in the dug-out corridor west of the printing pod and selected: it plays the
# mod's golden animation, and a close-up of it is compared with the original's.
from: early-base
mods: [2787598894]
setup:
  - driver: {setup.call: {target: "Research.Instance.GetTechInstance(\"SanitationSciences\")", method: Purchased}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"GoldAmalgam\").substance", method: SpawnResource, args: [[109.5, 206.5, -12], 500, 300, 255, 0]}}
steps:
  - expect_state:
      "Db.Get().Permits.BuildingFacades.TryGet(\"GoldenThroneToilet\").PrefabID": FlushToilet
  - build: {prefab: FlushToilet, at: [113, 206], material: GoldAmalgam}
  - expect: {blueprints: {FlushToilet: 1}}
  - run: {seconds: 1200, until: {buildings: {FlushToilet: 1}, pending_construction: 0}}
  - driver: {camera.set: {cell: [114, 208], ortho: 6}}
  - click_world: {cell: [113, 207], select: FlushToilet}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - expect_state:
      "selected:GetComponent<PrimaryElement>.ElementID": GoldAmalgam
      "selected:GetComponent<KBatchedAnimController>.AnimFiles[0].name": gold_flush_kanim
  - key: {code: Escape}
  - world_shot: {name: throne, ortho: 4, at: [114, 207]}

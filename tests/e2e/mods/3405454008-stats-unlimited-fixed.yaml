# Stats Unlimited Fixed (3405454008), classes S, O.
#
# What it does: Duplicants' attributes level past the game's 20, up to a cap (50 by default),
# with a global and a per-attribute experience multiplier (a prefix replacing
# AttributeLevel.AddExperience); each gain of experience above a threshold pops up a coloured
# "DIGGING: ++N%/M% (level)" text over the Duplicant. Other options: the starting stats and
# hit points of new Duplicants, a regenerative trait, injury penalties, "curses".
# How a player reaches it: automatic as Duplicants work; the options on the Mods screen.
# What changes: how fast and how far attributes grow.
#
# Options here: digging experience times 1000. Four cells of sandstone are dug at the east end
# of the corridor west of the printing pod; the Duplicants' digging levels rise.
#
# setup spawns 200 Hatches west of the pod, so that the game's amounts (over 1000 of them
# here) update in several blocks of 512, run on the JobManager's worker threads. Each block
# reads every amount's delta attribute, which the mod's postfix of
# AttributeInstance.GetTotalValue answers after reading its options (Config.Cfg). Issue #15:
# ours threw a StackOverflowException there on every worker (their stacks are 128 KB), where
# Mono ran it.
from: early-base
mods: [3405454008]
options:
  "3405454008": {$file: StatsUnlimited.json, DiggingMultiplier: 1000}
setup:
  - driver: {setup.call: {type: GameUtil, method: KInstantiate, args: [{"$": "Assets.GetPrefab(\"Hatch\")"}, [106.5, 206.01, -24.5], Creatures]}}
  - driver: {setup.call: {target: "last:", method: SetActive, args: [true]}}

# [FIX] Start with all Research (3001972449), classes M, P.
#
# What it does: adds a game setting, "Start with all Research" (StartWithAllResearch, off by
# default, Chinese labels in Chinese), to the new game's Game Settings (registered from a
# CustomGameSettings.OnPrefabInit postfix). With it on, the research screen completes every
# tech when it spawns (a postfix on ResearchScreen.OnSpawn) and research-complete
# notifications are muted.
# How a player reaches it: New Game, the destination screen's Game Settings, its checkbox.
# What changes: a colony that starts with the whole tech tree.
#
# From early-base the game is quit to the main menu and a new Survival game started; the
# Game Settings show the checkbox, a click turns the setting on, and the colony that embarks
# has every tech researched.
from: early-base
mods: [3001972449]
memory_gb: 8
steps:
  - key: {code: Escape}
  - ui_wait: {path: "**/PauseScreen/**/Main MenuButton", cond: stable}
  - click: {ui: "**/PauseScreen/**/Main MenuButton"}
  - ui_wait: {path: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton", cond: stable}
  - click: {ui: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton"}   # Quit Without Saving
  - ui_wait: {path: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons", cond: stable, frames: 3000}
  - click: {text: "NEW GAME", under: "**/MainMenuButtons"}
  - ui_wait: {path: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame", cond: stable}
  - click: {ui: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame"}
  - ui_wait: {path: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/ClassicStyleGame", cond: stable}
  - click: {ui: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/ClassicStyleGame"}
  - ui_wait: {path: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton", cond: stable, frames: 3000}
  - click: {ui: "**/ColonyDestinationScreen2/Layout/Buttons/CustomizeButton"}
  - ui_wait: {path: "**/Customization/Content/ScrollRect/ScrollContent/Columns", cond: stable}
  - expect_state:
      "CustomGameSettings.Instance.GetCurrentQualitySetting(\"StartWithAllResearch\").id": Disabled
  - expect_ui:
      "**/Customization/**/Columns/Prefab_Checkbox/Label": {any_text: "Start with all Research"}
  - click: {at: [814.5, 459.3]}   # its checkbox, right of the label (the label itself does not toggle)
  - expect_state:
      "CustomGameSettings.Instance.GetCurrentQualitySetting(\"StartWithAllResearch\").id": Enabled
  - click: {ui: "**/CustomizationContainer/Customization/Header/CloseButton"}
  - click: {ui: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton"}
  - ui_wait: {path: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton", cond: stable, frames: 60000}
  - click: {ui: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton"}
  - ui_wait: {path: "**/MinionSelectScreen", cond: gone, frames: 6000}
  - run: {seconds: 2}
  - expect_state:
      "count:Db.Get().Techs.resources[*] if .IsComplete() == false": 0
      "Components.LiveMinionIdentities.Count": 3

# Research Included (3315374510), class P.
#
# What it does: a postfix on Tech.IsComplete returns true for every tech once a colony's
# Research exists, so every building is available without research (the research screen still
# runs as before).
# How a player reaches it: the build menu in any colony.
# What changes: all buildings from the start.
#
# Techs early-base never researched read complete; the Power menu offers the transformer and
# the Smart Battery as built-ready buttons (dumped and compared in a shot).
from: early-base
mods: [3315374510]
require_log: ["MrPurple6411's ResearchIncluded patched\\."]
steps:
  - expect_state:
      "Db.Get().Techs.Get(\"AdvancedPowerRegulation\").IsComplete()": true
      "Db.Get().Techs.Get(\"HighTempForging\").IsComplete()": true
  - run: {seconds: 5}
  - driver: {camera.set: {cell: [114, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Power"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/PowerTransformer Group*", cond: stable}
  - ui_dump: {name: power-menu, root: "**/PlanBuildingSelectionPanel/BuildingGroups"}
  - shot: {name: power-menu, crop: "**/PlanBuildingSelectionPanel/BuildingGroups", threshold: 0.04}
  - key: {code: Escape}

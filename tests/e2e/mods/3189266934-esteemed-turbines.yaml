# Esteemed Turbines (3189266934), class B.
#
# What it does: adds five turbines built on the Steam Turbine (SteamTurbineConfig2) that
# take other gases: the Naphtha, Ethanol and Magma Turbines and the Hydrogen and Oxygen
# Liquimpellers (the last two draw power to condense their gas). Each condenses its gas to
# the liquid or solid it comes from; their stats follow the elements' transition
# temperatures. They go into the Power menu; the mod means to unlock them with Renewable
# Energy, but its Db.Initialize postfix runs before the buildings are registered, so no
# tech lists them and they need no research.
# How a player reaches it: the Power menu.
# What changes: turbines for gases other than steam.
#
# The turbines' prefabs condense their gases; the Power menu offers the Ethanol Turbine
# (its card).
from: early-base
mods: [3189266934]
steps:
  - expect_state:
      "Db.Get().Techs.Get(\"RenewableEnergy\").unlockedItemIDs": {equals: [SteamTurbine2, SolarPanel, Sauna, SteamEngineCluster, WireRubber, WireRubberBridge]}
      "Assets.GetPrefab(\"Ethanol Turbine\").GetComponent<SteamTurbine>.srcElem": "== 'EthanolGas'"
      "Assets.GetPrefab(\"Ethanol Turbine\").GetComponent<SteamTurbine>.destElem": "== 'Ethanol'"
      "Assets.GetPrefab(\"Magma Turbine\").GetComponent<SteamTurbine>.destElem": "== 'Magma'"
      "Assets.GetBuildingDef(\"Oxy Liquimpeller\").RequiresPowerInput": true
      "Assets.GetBuildingDef(\"Ethanol Turbine\").GeneratorWattageRating": "== original"
  - run: {seconds: 3}
  - driver: {camera.set: {cell: [113, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Power"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/Ethanol Turbine Group*", cond: stable}
  - scroll: {at: "**/PlanBuildingSelectionPanel/BuildingGroups", notches: -10}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/Ethanol Turbine Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/Ethanol Turbine Group*"}
  - ui_wait: {path: "**/ProductInfoScreen", cond: stable}
  - shot: {name: product, crop: "**/ProductInfoScreen", threshold: 0.04}

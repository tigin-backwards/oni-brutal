# Mining Reimagined (3651975886), class P.
#
# What it does: scales what a dug cell drops (a prefix on WorldDamage.OnDigComplete): by a flat
# Yield Multiplier (PLib option, 0.1 to 10, default 1, which gives the cell's full mass where the
# game drops half), or, with Attribute Scaling on, by the digger's Digging attribute (50 % to
# 100 % at the Full Yield Skill, more with Allow Bonus Yield). Excluded elements (oxylite,
# diamond, niobium) keep the game's half. It logs its mode at Game.OnPrefabInit.
# How a player reaches it: any dig order; the options in the mods screen.
# What changes: the mass of the debris a dig leaves.
#
# The options set the flat multiplier to 1.5 (1.5 times the cell's mass, three times the game's
# drop). Four cells of sandstone at the east end of the corridor west of the printing pod are
# dug, and all the sandstone debris of the base is weighed before and after.
from: early-base
mods: [3651975886]
options:
  "3651975886": {YieldMultiplier: 1.5}
require_log: ['\[MiningReimagined\] v2\.2\.2\.1 \| Flat \(x1\.5\)']
steps:
  - expect_state:
      "cells:119,209..120,210::Grid.Mass.get_Item({cell})": {save_as: block}
      "sum:all:Clearable::[*].GetComponent<PrimaryElement>.Mass if .GetComponent<PrimaryElement>.ElementID == SandStone": {save_as: before}
  - expect_state: {"cells:119,209..120,210::Grid.Element[{cell}].hardness": "> 0"}
  - dig: [119, 209, 120, 210]
  - run: {seconds: 900, until: {pending_digs: 0}}
  # The game alone would leave before + 0.5 * block.
  - expect_state:
      "sum:all:Clearable::[*].GetComponent<PrimaryElement>.Mass if .GetComponent<PrimaryElement>.ElementID == SandStone": ">= before + 1.45 * block"
  - expect_state:
      "sum:all:Clearable::[*].GetComponent<PrimaryElement>.Mass if .GetComponent<PrimaryElement>.ElementID == SandStone": "<= before + 1.55 * block"

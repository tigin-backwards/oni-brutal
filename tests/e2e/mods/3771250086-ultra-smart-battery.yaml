# 超大容量智能电池 Ultra Smart Battery (3771250086), class B.
#
# What it does: adds the Ultra Smart Battery (UltraBCSmartBattery, 2x2), a 1000 kJ smart
# battery with the smart battery's automation output, 10 J/s of leak and 0.5 kDTU/s of heat,
# built of 3600 kg of steel, 450 of plastic and 450 of glass (refunded whole when
# deconstructed); in the Power menu, unlocked by Renewable Energy.
# How a player reaches it: research Renewable Energy; the Power menu.
# What changes: a big smart battery.
#
# Renewable Energy is researched in setup and a battery built in the corridor west of the
# printing pod. The Power menu offers it (its card); selected, the built one holds 1000 kJ.
from: early-base
mods: [3771250086]
setup:
  - driver: {setup.call: {target: "Research.Instance", method: SetActiveResearch, args: [{"$": "Db.Get().Techs.Get(\"RenewableEnergy\")"}, true]}}
  - driver: {setup.call: {target: "Research.Instance", method: CompleteQueue}}
  - driver: {setup.call: {target: "Game.Instance", method: Trigger, args: [-107300940]}}
  - driver: {setup.call: {target: "PlanScreen.Instance._researchedDefs", method: Clear}}
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"UltraBCSmartBattery\")", method: Build, args: [131764, Neutral, null, [Steel, Plastic, Glass], 293.15, DEFAULT_FACADE]}}
steps:
  - expect_state:
      "Db.Get().Techs.Get(\"RenewableEnergy\").unlockedItemIDs": {contains: UltraBCSmartBattery}
      "Assets.GetPrefab(\"UltraBCSmartBattery\").GetComponent<BatterySmart>.capacity": 1000000
      "Assets.GetBuildingDef(\"UltraBCSmartBattery\").Mass[0]": 3600
  - run: {seconds: 3}
  - driver: {camera.set: {cell: [113, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Power"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/UltraBCSmartBattery Group*", cond: stable}
  - scroll: {at: "**/PlanBuildingSelectionPanel/BuildingGroups", notches: -10}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/UltraBCSmartBattery Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/UltraBCSmartBattery Group*"}
  - ui_wait: {path: "**/ProductInfoScreen", cond: stable}
  - shot: {name: product, crop: "**/ProductInfoScreen", threshold: 0.04}
  - key: {code: Escape}
  - click_world: {cell: [112, 207], select: UltraBCSmartBattery}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - expect_state:
      "selected:GetComponent<BatterySmart>.capacity": 1000000

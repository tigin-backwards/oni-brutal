# 火箭相关 About Rocket Modules (2984798228), class P.
#
# What it does: prefixes and postfixes on the rocket modules' configs make every cargo bay
# (solid, liquid, gas; small, normal and cluster) hold 100 t, the Petroleum, Carbon Dioxide
# and Radbolt engines carry seven to forty modules up to 100 or 200 tall with a big fuel tank
# and a power generator, fuel costs per distance near zero, rocket heights much taller, the
# rocket wall and window tiles buildable from the Base menu with 50 decor, the scout rover
# sturdier and the drillcone's harvest a thousand times faster.
# How a player reaches it: build rockets.
# What changes: huge, cheap rockets.
#
# The modules' prefabs carry the new values; the Base menu offers the rocket window tile.
from: early-base
mods: [2984798228]
steps:
  - expect_state:
      "Assets.GetPrefab(\"SolidCargoBaySmall\").GetComponent<CargoBayCluster>.storage.capacityKg": 100000
      "Assets.GetPrefab(\"LiquidCargoBayCluster\").GetComponent<CargoBayCluster>.storage.capacityKg": 100000
      "Assets.GetPrefab(\"GasCargoBaySmall\").GetComponent<CargoBayCluster>.storage.capacityKg": 100000
      "Assets.GetPrefab(\"KeroseneEngineCluster\").GetComponent<RocketEngineCluster>.maxModules": 7
      "Assets.GetPrefab(\"HEPEngine\").GetComponent<RocketEngineCluster>.maxModules": 40
      "Assets.GetBuildingDef(\"RocketEnvelopeWindowTile\").ShowInBuildMenu": true
      "Assets.GetBuildingDef(\"NoseconeHarvest\").BaseDecor": 200
  - run: {seconds: 3}
  - driver: {camera.set: {cell: [113, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Base"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/RocketEnvelopeWindowTile Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/RocketEnvelopeWindowTile Group*"}
  - ui_wait: {path: "**/ProductInfoScreen", cond: stable}
  - shot: {name: product, crop: "**/ProductInfoScreen", threshold: 0.04}

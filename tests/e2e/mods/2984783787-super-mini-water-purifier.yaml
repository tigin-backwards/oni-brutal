# 迷你净水器加强版 Super Mini Water Purifier (2984783787), class B.
#
# What it does: adds the 迷你净水器加强版 (SupperMiniWaterPurifier, 1x2, the Mini Liquid Pump's
# art), an unpowered piped building for the Refining menu unlocked by Improved Oxygen
# (Air Systems): it takes 1 kg/s of any water and outputs 9 kg/s of water plus 10 kg/s each of
# nineteen other elements, which it drops once 10 kg of one has gathered. +300 decor.
# How a player reaches it: research Air Systems; the Refining menu.
# What changes: a cheat source of water and materials.
#
# Air Systems is researched in setup and one built in the east corridor. The Refining menu
# offers it (its card is shot); its converter has the 20 outputs.
from: early-base
mods: [2984783787]
setup:
  - driver: {setup.call: {target: "Research.Instance", method: SetActiveResearch, args: [{"$": "Db.Get().Techs.Get(\"ImprovedOxygen\")"}, true]}}
  - driver: {setup.call: {target: "Research.Instance", method: CompleteQueue}}
  - driver: {setup.call: {target: "Game.Instance", method: Trigger, args: [-107300940]}}
  - driver: {setup.call: {target: "PlanScreen.Instance._researchedDefs", method: Clear}}
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"SupperMiniWaterPurifier\")", method: Build, args: [131786, Neutral, null, [Copper], 293.15, DEFAULT_FACADE]}}
steps:
  - expect_state:
      "Db.Get().Techs.Get(\"ImprovedOxygen\").unlockedItemIDs": {contains: SupperMiniWaterPurifier}
      "Assets.GetBuildingDef(\"SupperMiniWaterPurifier\").BaseDecor": 300
      "Assets.GetPrefab(\"SupperMiniWaterPurifier\").GetComponent<ElementConverter>.outputElements.Length": 20
      "Assets.GetPrefab(\"SupperMiniWaterPurifier\").GetComponent<ElementConverter>.consumedElements[0].MassConsumptionRate": 1
  - run: {seconds: 3}
  - expect: {buildings: {SupperMiniWaterPurifier: 1}}
  - driver: {camera.set: {cell: [113, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Refinement"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/SupperMiniWaterPurifier Group*", cond: stable}
  - scroll: {at: "**/PlanBuildingSelectionPanel/BuildingGroups", notches: -10}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/SupperMiniWaterPurifier Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/SupperMiniWaterPurifier Group*"}
  - ui_wait: {path: "**/ProductInfoScreen", cond: stable}
  - shot: {name: product, crop: "**/ProductInfoScreen", threshold: 0.04}

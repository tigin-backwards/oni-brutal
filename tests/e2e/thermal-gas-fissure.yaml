# A Thermal Gas Fissure (UnderwaterVent, Aquatic Pack) must release natural gas.
#
# Underwater, the fissure sends its gas up as bubbles (BubbleManager.SpawnBubble), and each
# bubble adds its element to the cell it pops in. The bubble manager files bubbles under an
# archetype id: the hash of a struct of velocity, element and fade speed, from the struct's
# inherited ValueType.GetHashCode (ARCHITECTURE D26). Mono's hash mixes in every field; CoreCLR's
# took the velocity alone, so every bubble that rises straight up had one id, and the first
# element filed under it was every later bubble's: after an Oxy Coral's oxygen bubble, the
# fissure released oxygen (a reported bug).
#
# setup builds a pit of granite east of the printing pod, below the floor, with a cavity 4
# cells wide and 8 tall: the fissure stands on its floor, six rows of water cover it, and the
# top two rows are a vacuum the gas collects in. Before that, one oxygen bubble pops in the
# room's air, as an Oxy Coral's do. Then the game runs, and the vacuum must hold natural gas.
from: landing
setup:
  # The pit: granite walls around a cavity 4 cells wide, its top two rows a vacuum.
  - driver: {setup.call: {type: SimMessages, method: ReplaceElement, args: [{"$": "Grid.XYToCell(140, 190)"}, Granite, {"$": "CellEventLogger.Instance.SandBoxTool"}, 1000, 300]}}

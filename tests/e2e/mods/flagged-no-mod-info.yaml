# Mods onimaxxing flags as not loading, which ship no mod_info.yaml or one without
# `APIVersion: 2` (ranks 388-746): each was built for the game of 2019-2021, before KMod required
# a mod_info.yaml and Harmony 2.
#
# What they did (their titles): buildings (Meteor Defense Laser, Bleachstone Refinery, High Flow
# Storage, Thermal Isolation Door, Shinsei Super Heaters, Waterproof Transformer + Battery, Blow
# Dryer, Giga-Watt Wire, Radiator, Advanced Generators 2, Piped Electrolyzer, Liquid Cooler,
# Reverse-Cycle AquaTuner, Electrolyzer suit, Advanced Storage, Assignable Showers, Extra Marble
# Sculptures), geysers and worlds (Ethanol Geyser, more geysers, Neon Eden, Nubrion, Roller
# Snakes, Planet Balancer, Custom World Size), and tuning or UI (speeds, sublimation in storage,
# room size, no damage, menus, favorites, skill sets, research speed, refrigerators, sweepies,
# pedestal and pipe germ info, heat in space, Wheezewort without phosphorite).
# How a player reaches them: once enabled in the mods screen and the game restarted.
# What changes today: nothing. KMod reads each mod's mod_info.yaml before it loads any of it; a
# mod without one is skipped ("Is missing a mod_info.yaml file and will not be loaded"), and one
# whose DLL is not declared `APIVersion: 2` loads no content ("DLLs found but not using the
# correct API version"). Either way the mod stays disabled and the mods screen marks it.
#
# The spec loads the base-game colony (these mods predate Spaced Out) with all of them installed
# and enabled, and checks that each is enabled for the active DLC: it fails in the original, as
# KMod disabled every one of them while it scanned the mods.

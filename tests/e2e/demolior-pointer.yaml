# The Demolior impactor reveal must not take the pointer from the world. Raising the research
# portal's event shows LargeImpactorSequenceReticle over the screen's centre. Its labels carry
# TMP sub-meshes saved with the prefab, empty and covering each label's rect; in the shipped
# TextMeshPro a sub-mesh is not a raycast target until its raycastTarget changes to true
# (docs/cleanroom/textmeshpro.md, "Sub-meshes and raycasts"). Here one used to be the topmost hit
# at the centre, so the event system reported the pointer over UI there, and the tool cursor's
# icon and hover card vanished over empty world.
from: prehistoric1
setup:
  - driver: {setup.call: {target: "Game.Instance", method: Trigger, args: [1633134300, {"$": "all:POITechItemUnlockWorkable::[0].gameObject"}]}}
steps:
  - ui_wait: {path: "**/LargeImpactorSequenceReticle/CalculatingImpactSection/label", cond: exists, frames: 600}
  # The pointer to the screen's centre, over the reticle's empty "calculating" label.
  - scroll: {at: center, notches: 0}
  # The sequence's fade plane takes raycasts for its first seconds (about 1000 frames in the
  # original, paused), in both players.
  - expect_hit: {at: center, not: "~FadePlaneFront", frames: 3000}
  - expect_hit: {at: center, not: "~TMP SubMeshUI"}
  - expect_state:
      "type:UnityEngine.EventSystems.EventSystem::current.IsPointerOverGameObject()": false

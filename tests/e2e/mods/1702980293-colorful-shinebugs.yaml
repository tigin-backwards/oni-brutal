# Colorful Shinebugs (1702980293), class P (critter definitions).
#
# What it does: each Shinebug morph's light takes a strong colour of its own (the Light2D
# colour set in LightBug*Config.CreateLightBug): yellow (2, 2, 0), orange (2, 1.2, 0), purple
# (1.3, 0.85, 2.2), pink (2, 1.2, 2), blue (1, 1.6, 2.2) and white for the crystal one.
# How a player reaches it: any Shinebug in the colony.
# What changes: the colour of the light a Shinebug casts around it.
#
# setup spawns a blue and an orange Shinebug in the dug-out room west of the printing pod; each
# one's light has its morph's colour.
from: early-base
mods: [1702980293]
setup:
  - driver: {setup.call: {target: "Scenario.SpawnPrefab(131762, 0, 0, \"LightBugBlue\", \"Creatures\")", method: SetActive, args: [true]}}
  - driver: {setup.call: {target: "Scenario.SpawnPrefab(131766, 0, 0, \"LightBugOrange\", \"Creatures\")", method: SetActive, args: [true]}}
steps:
  - expect_state:
      "Assets.GetPrefab(\"LightBugBlue\").GetComponent<Light2D>.Color.g": 1.6
      "Assets.GetPrefab(\"LightBugPurple\").GetComponent<Light2D>.Color.r": 1.3
  - expect_state:
      "count:all:Light2D::[*] if .name == 'LightBugBlue' and .Color.b == 2.2": 1
      "count:all:Light2D::[*] if .name == 'LightBugOrange' and .Color.g == 1.2": 1

# Auto Drop Gas Bottler Filler and Liquid Filler (3477214095), class S.
#
# What it does: the Canister Filler and the Bottle Filler drop their canister or bottle on the
# floor by themselves as soon as it holds the set amount, instead of waiting for a Duplicant
# to empty them; neither can be flooded or entombed. A button in the building's menu turns the
# automatic drop off (and back on); while it is off the building is set to "automation only"
# (Duplicants no longer empty it), and the automation side screen is hidden.
# How a player reaches it: building a Canister or Bottle Filler; its menu button.
# What changes: who empties the filler, and when.
#
# setup grants Portable Gases and spawns steel. A Canister Filler is built in the dug-out room
# west of the printing pod and selected: its menu offers "Disable AutoDrop". Pressed, the
# filler is automation only and, selected again, its button reads "Enable AutoDrop"; pressed,
# it drops by itself once more.
from: early-base
mods: [3477214095]
setup:
  - driver: {setup.call: {target: "Research.Instance.GetTechInstance(\"PortableGasses\")", method: Purchased}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"Steel\").substance", method: SpawnResource, args: [[109.5, 206.5, -12], 500, 300, 255, 0]}}
steps:
  - expect_state:
      "Assets.GetBuildingDef(\"GasBottler\").Floodable": false
      "Assets.GetBuildingDef(\"GasBottler\").Entombable": false
  - build: {prefab: GasBottler, at: [113, 206], material: Steel}
  - expect: {blueprints: {GasBottler: 1}}
  - run: {seconds: 900, until: {buildings: {GasBottler: 1}, pending_construction: 0}}
  - driver: {camera.set: {cell: [114, 207], ortho: 8}}
  - click_world: {cell: [114, 206], select: GasBottler}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - expect_state:
      "selected:GetComponent<Auto_Drop_Gas_Bottler_and_Liquid_v2.Patcher.AutoDropComponent>": exists
      "selected:Automatable.GetAutomationOnly()": false
  - ui_dump: {name: user-menu, root: "**/DetailsScreen/UserMenuButtons/UserMenuScreen"}
  - click: {ui: "**/UserMenuScreen/Buttons/Disable AutoDropButton"}
  - expect_state:
      "selected:Automatable.GetAutomationOnly()": true
      "selected:GetComponent<Auto_Drop_Gas_Bottler_and_Liquid.Patcher.Toggle>.automationOnly": true
  # The mod does not refresh the menu after a press: its button reads anew once the filler is
  # selected again.
  - key: {code: Escape}
  - click_world: {cell: [114, 206], select: GasBottler}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - expect_ui:
      "**/UserMenuScreen/Buttons/Enable AutoDropButton/Text": {text: "Enable AutoDrop"}
  - click: {ui: "**/UserMenuScreen/Buttons/Enable AutoDropButton"}
  - expect_state:
      "selected:Automatable.GetAutomationOnly()": false
      "selected:GetComponent<Auto_Drop_Gas_Bottler_and_Liquid_v2.Patcher.AutoDropComponent>": exists

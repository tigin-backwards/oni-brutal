# Ethanol Fermenter (2787109631), class B.
#
# What it does: adds the Ethanol Fermenter (EthanolFermenter, 3x2, 60 W), a Refinement
# building unlocked by Food Repurposing. It runs without a Duplicant and ferments food into
# 20 kg of ethanol a batch: thirteen recipes, from Meal Lice to Plant Meat, piped out of its
# liquid output.
# How a player reaches it: research Food Repurposing; the Refinement menu.
# What changes: food can be turned into ethanol.
#
# Food Repurposing is researched in setup and a fermenter built in the corridor west of the
# printing pod. The Refinement menu offers the fermenter (its card); selected, the built one
# lists its recipes.
from: early-base
mods: [2787109631]
setup:
  - driver: {setup.call: {target: "Research.Instance", method: SetActiveResearch, args: [{"$": "Db.Get().Techs.Get(\"FoodRepurposing\")"}, true]}}
  - driver: {setup.call: {target: "Research.Instance", method: CompleteQueue}}
  - driver: {setup.call: {target: "Game.Instance", method: Trigger, args: [-107300940]}}
  - driver: {setup.call: {target: "PlanScreen.Instance._researchedDefs", method: Clear}}
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"EthanolFermenter\")", method: Build, args: [131765, Neutral, null, [Copper], 293.15, DEFAULT_FACADE]}}
steps:
  - expect_state:
      "Db.Get().Techs.Get(\"FoodRepurposing\").unlockedItemIDs": {contains: EthanolFermenter}
      "count:ComplexRecipeManager.Get().recipes[*] if .id.StartsWith(\"EthanolFermenter_I_\") == true": 13
      "ComplexRecipeManager.Get().GetRecipe(\"EthanolFermenter_I_BasicPlantFood_O_Ethanol\").results[0].amount": 20
  - run: {seconds: 3}
  - driver: {camera.set: {cell: [113, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Refinement"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/EthanolFermenter Group*", cond: stable}
  - scroll: {at: "**/PlanBuildingSelectionPanel/BuildingGroups", notches: -10}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/EthanolFermenter Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/EthanolFermenter Group*"}
  - ui_wait: {path: "**/ProductInfoScreen", cond: stable}
  - shot: {name: product, crop: "**/ProductInfoScreen", threshold: 0.04}
  - key: {code: Escape}
  - click_world: {cell: [113, 207], select: EthanolFermenter}
  - ui_wait: {path: "**/ComplexFabricatorSideScreen/Contents/ButtonScrollView", cond: stable}
  - ui_dump: {name: recipes, root: "**/ComplexFabricatorSideScreen/Contents/ButtonScrollView"}

# Immigrants Reroll (2537508393), class S.
#
# What it does: the printing pod's Reject All button becomes a reroll: it is labelled with the
# game's Shuffle string, and a prefix on ImmigrantScreen.OnRejectAll destroys the offered cards
# and deals new ones (InitializeContainers) without the confirmation box, the screen staying
# open. Clicks less than half a second apart are ignored.
# How a player reaches it: the printing pod's immigrant screen, its bottom button.
# What changes: the cards on offer; the pod stays ready to print.
#
# The cards are random, so only the bottom buttons are compared by structure, and the check is
# that the cards are new ones.
from: early-base
mods: [2537508393]
setup:
  - driver: {seed: 12345}
  - driver: {setup.call: {target: "Immigration.Instance", method: "Sim200ms", args: [100000]}}   # Duplicants on offer now
steps:
  - expect_state: {"Immigration.Instance.ImmigrantsAvailable": true}
  - call: {tool: building_control, args: {domain: side_surface, surface: facility, kind: telepad, action: open_immigrants, confirm: true}}
  - ui_wait: {path: "**/ImmigrantScreen/Layout", cond: stable}
  - expect_ui:
      "**/ImmigrantScreen/Layout/Content/*Container": {count: 4}
      "**/ImmigrantScreen/Layout/BottomButtons/RejectButton/Label": {text: "/(?i)^reroll$/"}
  - expect_state:
      "ui:**/ImmigrantScreen/Layout/Content/*Container[0]::GetInstanceID()": {save_as: first}
      "ui:**/ImmigrantScreen/Layout/Content/*Container[3]::GetInstanceID()": {save_as: last}
  - ui_dump: {name: buttons, root: "**/ImmigrantScreen/Layout/BottomButtons"}
  - shot: {name: buttons, crop: "**/ImmigrantScreen/Layout/BottomButtons"}
  - click: {ui: "**/ImmigrantScreen/Layout/BottomButtons/RejectButton"}
  - ui_wait: {path: "**/ImmigrantScreen/Layout/Content", cond: stable}
  - expect_ui:
      "**/ImmigrantScreen/ConfirmationBox": {exists: false}
      "**/ImmigrantScreen/Layout/BottomButtons/RejectButton": {interactable: true}
      "**/ImmigrantScreen/Layout/Content/*Container": {count: 4}
  - expect_state:
      "Immigration.Instance.ImmigrantsAvailable": true
      "ui:**/ImmigrantScreen/Layout/Content/*Container[0]::GetInstanceID()": "!= first"
      "ui:**/ImmigrantScreen/Layout/Content/*Container[3]::GetInstanceID()": "!= last"

# Super Incubator (3738526308), classes B, U.
#
# What it does: adds the Super Incubator (SuperIncubator, 2x3, 240 W), a Food building after
# the Incubator, unlocked by Animal Control: a rancher with Critter Ranching sings it a
# "Super Lullaby" (the SuperEggSong effect, a big incubation multiplier from
# SuperIncubator.json), the base incubator's song and Sim1000ms are skipped for it, and an
# automation output says when its egg needs singing. The Mods screen gets a Config button
# for the JSON settings.
# How a player reaches it: research Animal Control; the Food menu.
# What changes: a much faster incubator.
#
# Animal Control is researched in setup and an incubator built in the corridor west of the
# printing pod. The Food menu offers it (its card); selected, the built one is a super
# incubator with its logic output.
from: early-base
mods: [3738526308]
setup:
  - driver: {setup.call: {target: "Research.Instance", method: SetActiveResearch, args: [{"$": "Db.Get().Techs.Get(\"AnimalControl\")"}, true]}}
  - driver: {setup.call: {target: "Research.Instance", method: CompleteQueue}}
  - driver: {setup.call: {target: "Game.Instance", method: Trigger, args: [-107300940]}}
  - driver: {setup.call: {target: "PlanScreen.Instance._researchedDefs", method: Clear}}
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"SuperIncubator\")", method: Build, args: [131765, Neutral, null, [Copper], 293.15, DEFAULT_FACADE]}}
require_log: ['\[SuperIncubator\] Registered SuperEggSong']
steps:
  - expect_state:
      "Db.Get().Techs.Get(\"AnimalControl\").unlockedItemIDs": {contains: SuperIncubator}
      "Db.Get().effects.Get(\"SuperEggSong\").duration": 600
      "Assets.GetPrefab(\"SuperIncubator\").GetComponent<SuperIncubator.SuperEggIncubator>": exists
  - run: {seconds: 3}
  - driver: {camera.set: {cell: [113, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Food"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/SuperIncubator Group*", cond: stable}
  - scroll: {at: "**/PlanBuildingSelectionPanel/BuildingGroups", notches: -10}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/SuperIncubator Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/SuperIncubator Group*"}
  - ui_wait: {path: "**/ProductInfoScreen", cond: stable}
  - shot: {name: product, crop: "**/ProductInfoScreen", threshold: 0.04}
  - key: {code: Escape}
  - click_world: {cell: [113, 208], select: SuperIncubator}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - expect_ui:
      "**/DetailsScreen/TitleBar/Border/LabelGroup/Label": {text: "~Super Incubator"}
  - expect_state:
      "selected:GetComponent<LogicPorts>.outputPortInfo.Length": 1

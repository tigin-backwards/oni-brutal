# [MG]Super Wire(超级电线) (2558054404), class P.
#
# What it does: every wire carries 5,000,000 W (a prefix on Wire.GetMaxWattageAsFloat), every
# battery stores 20 times as much and leaks 1 % as fast (a prefix on
# BaseBatteryConfig.DoPostConfigureComplete), and the debug-only generators (the Dev
# Generator and the Dev Radiation Generator) are no longer debug-only, so they show in the
# Power menu.
# How a player reaches it: the build menu (Power); building wires and batteries.
# What changes: no circuit overloads, large batteries, free generators to build.
#
# The Power menu lists the Dev Generator after a short run. A Battery is built from the base's
# copper ore in the dug-out corridor west of the printing pod, and selected: it holds
# 200 kJ (the game's 10 kJ times 20).
from: early-base
mods: [2558054404]
steps:
  - expect_state:
      "Wire.GetMaxWattageAsFloat(\"Max1000\")": 5000000
      "Wire.GetMaxWattageAsFloat(\"Max20000\")": 5000000
      "Assets.GetBuildingDef(\"DevGenerator\").DebugOnly": false
  - run: {seconds: 5}
  - driver: {camera.set: {cell: [114, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Power"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/DevGenerator Group*", cond: stable}
  - expect_ui:
      "**/BuildingGroups/**/Grid/DevGenerator Group*": {active: true}
  - shot: {name: power-menu, crop: "**/PlanBuildingSelectionPanel/BuildingGroups", threshold: 0.04}
  - key: {code: Escape}
  - expect_ui: {"**/PauseScreen": {exists: false}}
  - build: {prefab: Battery, at: [113, 206]}
  - expect: {blueprints: {Battery: 1}}
  - run: {seconds: 900, until: {buildings: {Battery: 1}, pending_construction: 0}}
  - driver: {camera.set: {cell: [113, 207], ortho: 8}}
  - click_world: {cell: [113, 206], select: Battery}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - expect_state:
      "selected:GetComponent<Battery>.capacity": 200000
  - expect_ui:
      "**/DetailsScreen/TitleBar/Border/LabelGroup/Label": {text: "~Battery"}

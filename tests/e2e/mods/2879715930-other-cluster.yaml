# Other Cluster (2879715930), class P (a worldgen mod, no code).
#
# What it does: three Spaced Out clusters in the Special (event) category, each with a
# 203x195 start world (sandstone, swampy or forest), a warp planet, oil, forest, swampy and
# jungle planets of its own, and the game's moonlets mixed in (tundra, marshy, niobium, moo,
# water, regolith), with a starmap of POIs and the Temporal Tear.
# How a player reaches it: the main menu, New Game, Survival, the event category; the
# destination screen's carousel lists them (coordinate prefixes M-OTHRS-C, M-OTHRW-C,
# M-OTHRF-C).
# What changes: the cluster a new game generates.
#
# From a colony: the pause menu's Main Menu, Quit Without Saving, New Game, Survival, the
# event category. The sandstone cluster is chosen by typing its coordinate (fixed seed),
# launched and embarked. Worldgen expectations are functional: the mod's start world and
# size, its worlds among the cluster's, the Temporal Tear. The destination's list of
# asteroids is dumped.
from: early-base
mods: [2879715930]
memory_gb: 8
steps:
  - key: {code: Escape}
  - ui_wait: {path: "**/PauseScreen/**/Main MenuButton", cond: stable}
  - click: {ui: "**/PauseScreen/**/Main MenuButton"}
  - ui_wait: {path: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton", cond: stable}
  - click: {ui: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton"}   # Quit Without Saving
  - ui_wait: {path: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons", cond: stable, frames: 3000}
  - click: {text: "NEW GAME", under: "**/MainMenuButtons"}
  - ui_wait: {path: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame", cond: stable}
  - click: {ui: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame"}
  - ui_wait: {path: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/EventGame", cond: stable}
  - click: {ui: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/EventGame"}
  - ui_wait: {path: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton", cond: stable, frames: 3000}
  - expect_state:
      "count:all:DestinationSelectPanel::[0].clusterKeys[*] if .Contains(\"clusters/OtherCluster\") == true": 3
  - click: {ui: "**/CoordinateContainer/SeedInput"}
  - ui_wait: {path: "**/CoordinateContainer/SeedInput", cond: stable}
  - type: {ui: "**/CoordinateContainer/SeedInput", text: "M-OTHRS-C-12345-0-0-0", clear: true, enter: true}
  - ui_wait: {path: "**/Section - Destination/DestinationDetailsHeader/ClusterName", cond: stable}
  - expect_state:
      "CustomGameSettings.Instance.GetCurrentQualitySetting(\"ClusterLayout\").id.EndsWith(\"clusters/OtherClusterSandstoneStartCluster\")": true
  - ui_dump: {name: asteroids, root: "**/Section - Destination/World Scoll (Rect Size Set By Screen Code!)/Content/Details"}
  - click: {ui: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton"}
  - ui_wait: {path: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton", cond: stable, frames: 60000}
  - click: {ui: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton"}
  - ui_wait: {path: "**/MinionSelectScreen", cond: gone, frames: 6000}
  - expect_state:
      "ClusterManager.Instance.GetStartWorld().worldName.EndsWith(\"worlds/OtherClusterSandstoneStart\")": true
      "ClusterManager.Instance.GetStartWorld().worldSize.x": 203
      "ClusterManager.Instance.GetStartWorld().worldSize.y": 195
      "ClusterManager.Instance.WorldContainers.Count": ">= 10"
      "count:ClusterManager.Instance.WorldContainers[*] if .worldName.Contains(\"worlds/OtherCluster\") == true": 6
      "Components.LiveMinionIdentities.Count": 3
      "all:TemporalTear::Length": 1

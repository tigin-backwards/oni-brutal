# EmptyWorlds (SkyBlock) (1825146346), classes P, O (a worldgen mod).
#
# What it does: two event-style ("Special") clusters for Spaced Out, Emptera and Islands: start
# asteroids that are mostly space, with forest start biomes of its own (ForestStartModified,
# ForestMiniWaterModified), space subworlds with geysers and wells, a SkyBlock bunker template
# (poi_bunker_skyblock), a mob lab and a brain ruin, and a "Holes" world trait. Its code adds the
# worlds' strings, loads the trait's SpaceHole sprite, can force a world border, and (PLib option
# RemoveBunkerAtWorldgen, off by default) replaces the bunker template with one cell.
# How a player reaches it: the main menu, New Game, Survival, the third (event) category; the
# carousel lists Emptera and Islands (coordinate prefixes EMP-PHO, ISD-PHO).
# What changes: the cluster a new game generates.
#
# From a colony: Main Menu, Quit Without Saving, New Game, Survival, the event category; the
# Islands cluster chosen by typing its coordinate (fixed seed), launched and embarked.
# Functional expectations (mod-play-testing.md, "Worldgen mods"): its nine worlds, the start
# world Islands with its own subworlds and mostly space, the Emptera asteroid among them, the
# bunker's doors and the mob lab's gene shuffler among the spawners, geysers, starmap POIs.
from: early-base
mods: [1825146346]
memory_gb: 8
steps:
  - key: {code: Escape}
  - ui_wait: {path: "**/PauseScreen/**/Main MenuButton", cond: stable}
  - click: {ui: "**/PauseScreen/**/Main MenuButton"}
  - ui_wait: {path: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton", cond: stable}
  - click: {ui: "**/ConfirmDialog/GameObject/Panel/ConfigurableButton"}   # Quit Without Saving
  - ui_wait: {path: "**/MainMenu_SpacedOut/MainMenuMenubar/MainMenuButtons", cond: stable, frames: 3000}
  - click: {text: "NEW GAME", under: "**/MainMenuButtons"}
  - ui_wait: {path: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame", cond: stable}
  - click: {ui: "**/ModeSelectScreen/Panel/Content/RootToggles/StandardGame"}
  - ui_wait: {path: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/EventGame", cond: stable}
  - click: {ui: "**/ClusterCategorySelectionScreen/Panel/Content/RootToggles/EventGame"}
  - ui_wait: {path: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton", cond: stable, frames: 3000}
  - expect_state:
      "all:DestinationSelectPanel::[0].clusterKeys": {contains: "expansion1::clusters/IslandsDLC"}
  - expect_state:
      "all:DestinationSelectPanel::[0].clusterKeys": {contains: "expansion1::clusters/EmpteraDLC"}
  - click: {ui: "**/CoordinateContainer/SeedInput"}
  - ui_wait: {path: "**/CoordinateContainer/SeedInput", cond: stable}
  - type: {ui: "**/CoordinateContainer/SeedInput", text: "ISD-PHO-12345-0-0-0", clear: true, enter: true}
  - ui_wait: {path: "**/Section - Destination/DestinationDetailsHeader/ClusterName", cond: text, value: "~Islands"}
  - expect_ui:
      "**/CoordinateContainer/SeedInput/Text Area/Text": {text: "~ISD-PHO-12345-0-0-0"}
      "**/StartingAsteroidCategory/Content/Prefab_AsteroidLine/Label": {text: "Islands"}
  - expect_state:
      "CustomGameSettings.Instance.GetCurrentQualitySetting(\"ClusterLayout\").id": "expansion1::clusters/IslandsDLC"
  - ui_dump: {name: asteroids, root: "**/Section - Destination/World Scoll (Rect Size Set By Screen Code!)/Content/Details"}
  - click: {ui: "**/ColonyDestinationScreen2/Layout/Buttons/LaunchButton"}
  # Worldgen runs on its own thread; the Duplicant selection follows once the world is loaded.
  - ui_wait: {path: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton", cond: stable, frames: 60000}
  - click: {ui: "**/MinionSelectScreen/Content/BottomContent/Buttons/ProceedButton"}
  - ui_wait: {path: "**/MinionSelectScreen", cond: gone, frames: 6000}
  - expect_state:
      "ClusterManager.Instance.WorldContainers.Count": 9
      "ClusterManager.Instance.GetStartWorld().worldName": "expansion1::worlds/IslandsDLC"
      "ClusterManager.Instance.GetStartWorld().worldSize.x": 230
      "ClusterManager.Instance.GetStartWorld().worldSize.y": 290
      "count:ClusterManager.Instance.WorldContainers[*] if .worldName == expansion1::worlds/EmpteraDLC": 1
      "Components.LiveMinionIdentities.Count": 3
      "ClusterManager.Instance.GetStartWorld().m_generatedSubworlds": {contains: subworlds/forest/ForestStartModified}
      "ClusterManager.Instance.GetStartWorld().Biomes": {contains: space}
      # Space zones in the cluster's overworld (the start world's included).
      "count:SaveLoader.Instance.clusterDetailSave.overworldCells[*] if .zoneType == Space": ">= 40"
      # Its templates, waiting among the spawners: the bunker's exterior doors, the mob lab.
      "count:SaveGame.Instance.worldGenSpawner.spawnables[*] if .spawnInfo.id == POIBunkerExteriorDoor": ">= 2"
      "count:SaveGame.Instance.worldGenSpawner.spawnables[*] if .spawnInfo.id == GeneShuffler": ">= 1"
      "count:SaveGame.Instance.worldGenSpawner.spawnables[*] if .spawnInfo.id.StartsWith(\"GeyserGeneric\") == true": ">= 6"
      "all:TemporalTear::Length": 1
      "all:HarvestablePOIClusterGridEntity::Length": ">= 15"
      "Assets.Sprites[\"SpaceHole\"].name": exists

# Liquid Conditioner Config 液温调整器耗电调整 (1931516176), classes P, O.
#
# What it does: sets the Thermo Aquatuner's (LiquidConditioner) power draw from a PLib option,
# Power (1 to 4000 W, 600 by default; the game's is 1200 W): a postfix on
# LiquidConditionerConfig.CreateBuildingDef.
# How a player reaches it: the Mods screen's options; then the Thermo Aquatuner in the build
# menu (Utilities, researched with Liquid Tuning).
# What changes: how much power an aquatuner draws.
#
# Options here: 500 W. setup grants Liquid Tuning; the Thermo Aquatuner is picked in the
# Utilities menu, and its card shows the 500 W.
from: early-base
mods: [1931516176]
options:
  keep.Aqua: {Power: 500.0}
setup:
  - driver: {setup.call: {target: "Research.Instance", method: SetActiveResearch, args: [{"$": "Db.Get().Techs.Get(\"LiquidTemperature\")"}, true]}}
  - driver: {setup.call: {target: "Research.Instance", method: CompleteQueue}}
  - driver: {setup.call: {target: "Game.Instance", method: Trigger, args: [-107300940]}}
  - driver: {setup.call: {target: "PlanScreen.Instance._researchedDefs", method: Clear}}
require_log: ['New power: 500']
steps:
  - expect_state:
      "Assets.GetBuildingDef(\"LiquidConditioner\").EnergyConsumptionWhenActive": 500
  - run: {seconds: 5}
  - driver: {camera.set: {cell: [113, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Utilities"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/LiquidConditioner Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/LiquidConditioner Group*"}
  - ui_wait: {path: "**/ProductInfoScreen", cond: stable}
  - expect_ui:
      "**/ProductInfoScreen/**": {any_text: "~500 W"}
  - shot: {name: product, crop: "**/ProductInfoScreen", threshold: 0.04}
  - key: {code: Escape}

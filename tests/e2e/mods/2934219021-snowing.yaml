# 下雪啦 Snowing (2934219021), class B.
#
# What it does: adds a decoration, SNOWING20230216 (1x1, any buildable material, Furniture
# menu, built anywhere, +decor): an animated snowfall with a logic input that turns it off.
# How a player reaches it: the Furniture menu.
# What changes: a snow effect to place.
#
# One is built by setup in the corridor west of the printing pod; the Furniture menu offers
# it (its card is shot).
from: early-base
mods: [2934219021]
setup:
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"SNOWING20230216\")", method: Build, args: [{"$": "Grid.XYToCell(112, 207)"}, Neutral, null, [SandStone], 293.15, DEFAULT_FACADE]}}
steps:
  - expect_state:
      "Assets.GetBuildingDef(\"SNOWING20230216\").BuildLocationRule": "== 'Anywhere'"
      "Assets.GetBuildingDef(\"SNOWING20230216\").BaseDecor": "== original"
  - run: {seconds: 3}
  - expect: {buildings: {SNOWING20230216: 1}}
  - driver: {camera.set: {cell: [113, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Furniture"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/SNOWING20230216 Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/SNOWING20230216 Group*"}
  - ui_wait: {path: "**/ProductInfoScreen", cond: stable}
  - shot: {name: product, crop: "**/ProductInfoScreen", threshold: 0.04}

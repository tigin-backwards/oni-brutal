# Advanced Generators (1934934314), class B.
#
# What it does: adds four generators to the Power menu, each in a vanilla tech: the Refined
# Carbon Generator (Advanced Power Regulation: 3x3, 800 kg metal and 400 kg raw mineral) burns
# 1 kg/s of refined carbon for 1200 W, the Naphtha Generator (Plastics), the Thermoelectric
# Generator (Renewable Energy) and the Eco-Friendly Methane Generator (Improved Combustion).
# How a player reaches it: the build menu (Power), after research.
# What changes: new power sources.
#
# setup grants Advanced Power Regulation and spawns metal ore, sandstone and refined carbon.
# The Refined Carbon Generator is picked in the build menu, placed in the dug-out corridor west
# of the printing pod, built, and selected: it is rated 1200 W. (Duplicants do not fill an
# unwired generator within minutes, so its burning is not checked.)
from: early-base
mods: [1934934314]
setup:
  - driver: {setup.call: {target: "Research.Instance.GetTechInstance(\"AdvancedPowerRegulation\")", method: Purchased}}
  # The build menu shows a category once one of its buildings is researched, as it learns.
  - driver: {setup.call: {target: "Game.Instance", method: Trigger, args: [-107300940]}}
  - driver: {setup.call: {target: "PlanScreen.Instance._researchedDefs", method: Clear}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"Cuprite\").substance", method: SpawnResource, args: [[109.5, 206.5, -12], 900, 300, 255, 0]}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"SandStone\").substance", method: SpawnResource, args: [[110.5, 206.5, -12], 500, 300, 255, 0]}}
  - driver: {setup.call: {target: "ElementLoader.FindElementByName(\"RefinedCarbon\").substance", method: SpawnResource, args: [[108.5, 206.5, -12], 100, 300, 255, 0]}}
steps:
  - run: {seconds: 5}
  - driver: {camera.set: {cell: [113, 208], ortho: 10}}
  - click: {ui: "**/PlanScreen/Toggle:Power"}
  - ui_wait: {path: "**/BuildingGroups/**/Grid/RefinedCarbonGenerator Group*", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/RefinedCarbonGenerator Group*"}
  - ui_wait: {path: "**/ProductInfoScreen", cond: stable}
  - shot: {name: product, crop: "**/ProductInfoScreen", threshold: 0.04}
  - click_world: {cell: [114, 206]}
  - key: {code: Escape}
  - expect: {blueprints: {RefinedCarbonGenerator: 1}}
  - run: {seconds: 1500, until: {buildings: {RefinedCarbonGenerator: 1}, pending_construction: 0}}
  - driver: {camera.set: {cell: [114, 208], ortho: 8}}
  - click_world: {cell: [114, 207], select: RefinedCarbonGenerator}
  - ui_wait: {path: "**/DetailsScreen", cond: stable}
  - expect_ui:
      "**/DetailsScreen/TitleBar/Border/LabelGroup/Label": {text: "~Refined Carbon Generator"}
  - expect_state:
      "selected:GetComponent<Generator>.WattageRating": 1200

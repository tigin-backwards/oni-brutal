# High magnification (2972057294), classes K, V.
#
# What it does: a prefix on CameraController.OnPrefabInit sets the camera's maximum
# orthographic size to 200 (the game's is 20, kept to the world's size), so the mouse wheel
# zooms out much further. The DLL also holds an empty UserMod2 of the author's wallpaper mod.
# How a player reaches it: the mouse wheel over the world.
# What changes: how far the camera zooms out, and what is drawn at that size.
from: early-base
mods: [2972057294]
steps:
  - expect_state:
      "CameraController.Instance.maxOrthographicSize": 200
      "Camera.main.orthographicSize": "<= 20"
  - scroll: {at: center, notches: -40}
  - expect_state: {"CameraController.Instance.targetOrthographicSize": "> 20"}
  - expect_state: {"CameraController.Instance.targetOrthographicSize": "== original"}
  - world_shot: {name: mid, ortho: 40, at: [122, 208]}
  - world_shot: {name: far, ortho: 120, at: [122, 208]}

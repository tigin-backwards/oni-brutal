# Move This Here (2667816955), classes B, S.
#
# What it does: adds the Hauling Point (Base > storage): a 1x1 marker that costs nothing and is
# placed at once (BuildingDef.Instantiate is patched to build it outright), with a storage
# filter like a storage bin's. Duplicants bring the chosen items to it; its user menu's Remove
# drops them there. Its build card hides the material selector.
# How a player reaches it: the build menu (Base), then its side screen and user menu.
# What changes: a hauling point that collects the checked items.
#
# The build menu offers a material only once the colony's inventory has been counted, which
# takes the game running a moment after the load (straight after it every building's card
# reads "Missing resources"): a short run comes first.
from: early-base
mods: [2667816955]
steps:
  - run: {seconds: 5}
  - driver: {camera.set: {cell: [110, 208], ortho: 10}}
  - open: {key: Alpha1}
  - ui_wait: {path: "**/PlanBuildingSelectionPanel/BuildingGroups", cond: stable}
  - click: {ui: "**/BuildingGroups/**/Grid/HaulingPoint Group*"}
  - ui_wait: {path: "**/PlanBuildingSelectionPanel/ProductInfoScreen", cond: stable}
  - expect_state: {"PlayerController.Instance.ActiveTool.name": BuildTool}
  - click_world: {cell: [108, 206]}
  - expect: {buildings: {HaulingPoint: 1}}
  - key: {code: Escape}
  # Its side screen: the element filter; sandstone, found through its search field.
  - click_world: {cell: [108, 206]}
  - ui_wait: {path: "**/DetailsScreen/SideScreen", cond: stable}
  - expect_state: {"selected:GetComponent<MoveThisHere.HaulingPoint>": exists}
  - expect_ui:
      "**/UserMenuScreen/Buttons/RemoveButton": {interactable: true}
      "**/UserMenuScreen/Buttons/Enable Auto-DropButton": {interactable: true}
  - ui_dump: {name: user-menu, root: "**/DetailsScreen/UserMenuButtons/UserMenuScreen"}
  - type: {ui: "**/TreeFilterableSideScreen/SearchRow/FilterInputField", text: "sandstone"}
  - ui_wait: {path: "**/TreeFilterableRow/Elements/Element/CheckBox", cond: stable}
  - click: {ui: "**/TreeFilterableRow/Elements/Element/CheckBox"}
  - expect_state: {"selected:GetComponent<TreeFilterable>.AcceptedTags": {contains: SandStone}}
  # Duplicants bring sandstone to it; Remove drops it there and takes the point away.
  - run: {seconds: 240}
  - expect_state: {"all:MoveThisHere.HaulingPoint::[0].GetComponent<Storage>.MassStored()": "> 0"}
  # Still selected (a click on its cell now may pick a Duplicant hauling to it).
  - expect_state: {"selected:GetComponent<MoveThisHere.HaulingPoint>": exists}
  - click: {ui: "**/UserMenuScreen/Buttons/RemoveButton"}
  - expect: {buildings: {HaulingPoint: 0}}

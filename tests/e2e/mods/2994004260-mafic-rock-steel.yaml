# 精炼镁铁质岩生产钢 (2994004260), class P (a recipe).
#
# What it does: adds a Metal Refinery recipe turning 100 kg of mafic rock and 10 kg of refined
# carbon into 40 kg of steel in 40 s (a postfix on GourmetCookingStationConfig, which the game
# configures before the refinery's recipes are listed).
# How a player reaches it: the Metal Refinery's recipe list.
# What changes: another way to make steel.
#
# setup builds a Metal Refinery in the dug-out room west of the printing pod; selected, its
# recipe list offers steel from mafic rock and is compared with the original.
from: early-base
mods: [2994004260]
setup:
  - driver: {setup.call: {target: "Assets.GetBuildingDef(\"MetalRefinery\")", method: Build, args: [{"$": "Grid.XYToCell(111, 207)"}, Neutral, null, [Cuprite], 293.15, DEFAULT_FACADE]}}
steps:
  - expect_state:
      "ComplexRecipeManager.Get().GetRecipe(\"MetalRefinery_I_MaficRock_RefinedCarbon_O_Steel\").fabricators[0]": MetalRefinery
      "ComplexRecipeManager.Get().GetRecipe(\"MetalRefinery_I_MaficRock_RefinedCarbon_O_Steel\").time": 40
      "ComplexRecipeManager.Get().GetRecipe(\"MetalRefinery_I_MaficRock_RefinedCarbon_O_Steel\").results[0].amount": 40
  - run: {seconds: 2}
  - driver: {camera.set: {cell: [111, 208], ortho: 8}}
  - click_world: {cell: [111, 207], select: MetalRefinery}
  - ui_wait: {path: "**/ComplexFabricatorSideScreen/Contents/ButtonScrollView", cond: stable}
  - ui_dump: {name: recipes, root: "**/ComplexFabricatorSideScreen/Contents/ButtonScrollView"}
  - shot: {name: recipes, crop: "**/DetailsScreen", threshold: 0.04}
